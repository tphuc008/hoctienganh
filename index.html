// All Grade/Unit metadata and global bank references come from the Content Manifest.
const GRADES=ContentManifest.grades;
const UNITS=ContentManifest.units;
const BANKS=ContentManifest.loadedBanks();

function explanationGloss(question,detail,answer){
  const direct=String(question?.q||"").match(/(?:means|có nghĩa|nghĩa)\s*[“"]([^”"]+)[”"]/i);
  if(direct)return direct[1].trim();
  const e=String(question?.e||"");
  let m=e.match(/=\s*([^.;]+)/);
  if(m)return m[1].trim();
  const meaning=String(detail?.meaning||"");
  m=meaning.match(/(?:=|—)\s*[“"]?([^.;”"]+)/);
  if(m)return m[1].trim();
  return "";
}

function explanationFamily(detail,answer){
  let family=String(detail?.family||"").trim();
  if(!family){
    const usage=String(detail?.usage||"");
    const wf=usage.match(/Word family:\s*([^.]*(?:→[^.]*)?)/i);
    if(wf)family=wf[1].trim();
    if(!family){
      const arrow=usage.split(/\.\s+/).find(x=>x.includes("→"));
      if(arrow)family=arrow.replace(/^Word family:\s*/i,"").replace(/^Collocations?:\s*/i,"").trim();
    }
  }
  if(!family||family==="—")return "";
  if(!family.includes("→"))return "";
  if(/tài liệu|không mở rộng|cụm cố định|dạng từ trọng tâm|ghi nhớ cả cụm|giữ đúng từ loại|rare|thường dùng|\s\+\s|community-based|city \(n\).*urban|cultural heritage|project-based|peer group|plural n|fauna|flora|qualitative|anciently|due date/i.test(family))return "";
  return family;
}
function questionCore(text){
  return String(text||"")
    .replace(/^Choose the vocabulary item that best completes the source sentence:\s*/i,"")
    .replace(/^Choose the most precise vocabulary item from the source:\s*/i,"")
    .trim();
}

function blankInfo(text,answer){
  const core=questionCore(text);
  const m=core.match(/_{2,}/);
  if(!m)return {core,completed:core,before:"",after:""};
  const pos=m.index;
  const before=core.slice(0,pos).trim();
  const after=core.slice(pos+m[0].length).trim();
  const completed=core.slice(0,pos)+answer+core.slice(pos+m[0].length);
  const clip=(s,n=92)=>{
    const clean=s.replace(/\s+/g," ").replace(/^[“"]|[”"]$/g,"").trim();
    return clean.length<=n?clean:clean.slice(clean.length-n).trim();
  };
  const clipAfter=(s,n=92)=>{
    const clean=s.replace(/\s+/g," ").replace(/^[“"]|[”"]$/g,"").trim();
    return clean.length<=n?clean:clean.slice(0,n).trim()+"…";
  };
  return {core,completed,before:clip(before),after:clipAfter(after)};
}

function partOfSpeechClue(detail){
  const text=String(detail?.meaning||"").toLowerCase();
  if(/\((?:adj|adjective)[^)]*\)/.test(text))return "Vị trí chỗ trống cần một tính từ để mô tả đặc điểm hoặc trạng thái của đối tượng đang được nói tới.";
  if(/\((?:adv|adverb)[^)]*\)/.test(text))return "Vị trí chỗ trống cần một trạng từ để bổ nghĩa cho hành động hoặc đặc điểm trong câu.";
  if(/\((?:v|verb|phr\.? ?v|pv)[^)]*\)/.test(text))return "Vị trí chỗ trống cần một động từ hoặc cụm động từ để diễn tả hành động xảy ra trong tình huống này.";
  if(/\((?:n|noun)[^)]*\)/.test(text))return "Vị trí chỗ trống cần một danh từ hoặc cụm danh từ để gọi tên người, vật, sự việc hoặc khái niệm được nhắc tới.";
  return "";
}

function connectorClue(core,gloss){
  const because=core.match(/\bbecause\b\s+(.+)$/i);
  if(because)return `Mệnh đề sau “because” — “${because[1].trim()}” — nêu lý do trực tiếp làm rõ đặc điểm hoặc ý “${gloss}” mà chỗ trống cần diễn đạt.`;
  const semi=core.split(";");
  if(semi.length>1)return `Phần sau dấu chấm phẩy — “${semi.slice(1).join(";").trim()}” — giải thích cụ thể cho ý cần điền ở vế trước.`;
  const soThat=core.match(/\bso\b[^.?!]*\bthat\b[^.?!]*/i);
  if(soThat)return `Cấu trúc “${soThat[0].trim()}” cho thấy vế sau là kết quả trực tiếp của đặc điểm hoặc hành động được chọn ở chỗ trống.`;
  if(/\binstead of\b/i.test(core))return "Cụm “instead of” tạo thế đối chiếu ngay trong câu, nên đáp án phải phù hợp với hành động hoặc ý được đặt đối lập ở hai vế.";
  if(/\brather than\b/i.test(core))return "Cụm “rather than” đặt hai khả năng trong thế đối chiếu; đáp án đúng phải khớp với hành động hoặc đặc điểm mà câu ưu tiên ở vế còn lại.";
  return "";
}

function grade9MeaningMap(bank){
  const map={};
  bank.questions.forEach((q,i)=>{
    const answer=q.o[q.a];
    const detail=bank.explanations[i]||{};
    const gloss=explanationGloss(q,detail,answer);
    if(answer&&gloss)map[answer]=gloss;
  });
  return map;
}
function grade9SemanticClue(core,info,answer,gloss){
  const text=String(core||"").replace(/\s+/g," ").trim();

  const because=text.match(/\bbecause\b\s+([^.!?]+)/i);
  if(because){
    return `Mệnh đề “because ${because[1].trim()}” nêu lý do trực tiếp. Chi tiết này giải thích vì sao đặc điểm “${gloss}” đúng với đối tượng được nói tới.`;
  }

  const show=text.match(/^(.{1,150}?)\b(?:show|shows|showed)\b\s+(.+)$/i);
  if(show){
    return `Phần “${show[1].trim()}” là bằng chứng, còn động từ “show” cho biết bằng chứng đó đang chứng minh một đặc điểm. Vì các chi tiết này thể hiện rõ “${gloss}”, đáp án “${answer}” phù hợp về nghĩa.`;
  }

  const soThat=text.match(/\bso\b\s+([^.!?]+?)\s+\bthat\b\s+([^.!?]+)/i);
  if(soThat){
    return `Cấu trúc “so ${soThat[1].trim()} that ${soThat[2].trim()}” nối mức độ với kết quả. Kết quả ở vế sau giúp xác định đặc điểm cần điền là “${gloss}”.`;
  }

  const result=text.match(/;\s*(it|this|that|he|she|they|we)\s+([^.!?]+)/i);
  if(result){
    return `Vế sau dấu chấm phẩy — “${result[0].slice(1).trim()}” — giải thích hoặc cho thấy hệ quả của ý ở chỗ trống. Hệ quả này phù hợp với nghĩa “${gloss}”.`;
  }

  const before=String(info.before||"");
  const after=String(info.after||"");

  if(/\b(a|an|the)\s*$/i.test(before) && /^[a-z][^.!?]{2,120}/i.test(after)){
    return `Cụm sau chỗ trống — “${after}” — mô tả hành động hoặc vai trò của người/vật cần điền. Những hành động đó phù hợp với “${answer}” (= “${gloss}”), nên đáp án được xác định từ chính vai trò trong câu.`;
  }

  if(/\b(to|can|could|will|would|should|may|might|must)\s*$/i.test(before)){
    return `Chỗ trống đứng sau “${before.split(/\s+/).slice(-1)[0]}”, nên cần một động từ hoặc cụm động từ. Phần còn lại “${after}” cho biết đối tượng hoặc kết quả của hành động; “${answer}” mang nghĩa “${gloss}” nên khớp với hành động câu đang mô tả.`;
  }

  if(/\b(is|are|was|were|be|become|became|seem|feel|look|remain)\s*$/i.test(before)){
    return `Chỗ trống đứng sau động từ nối, nên cần một từ mô tả trạng thái hoặc đặc điểm. Chi tiết “${after}” làm rõ trạng thái đó và phù hợp với nghĩa “${gloss}” của “${answer}”.`;
  }

  return `Cụm ngay trước chỗ trống là “${info.before}”, còn phần sau là “${info.after}”. Hai phần này cùng xác định ý cần điền là “${gloss}”; “${answer}” diễn đạt đúng ý đó và đúng vai trò ngữ pháp trong câu.`;
}
function grade9StandardExplanation(bank,question,detail){
  const answer=question.o[question.a];
  const gloss=explanationGloss(question,detail,answer);
  const direct=/Which English word or phrase means|có nghĩa/i.test(question.q);
  const info=blankInfo(question.q,answer);

  const rawMeaning=String(detail.meaning||question.e||`${answer} = ${gloss}`).trim();
  const sentences=rawMeaning.split(/(?<=[.!?])\s+/);
  const isPhrase=/phr|phrasal|pv|cụm động từ|cụm giới từ/i.test(rawMeaning);
  const meaning=isPhrase&&sentences[1] ? sentences.slice(0,2).join(" ") : sentences[0];

  let why;
  if(direct){
    why=`“${answer}” mang nghĩa “${gloss}”. Đây là câu nhận diện nghĩa trực tiếp, nên không cần suy luận thêm từ ngữ cảnh.`;
  }else{
    const grammar=partOfSpeechClue(detail);
    const semantic=grade9SemanticClue(info.core,info,answer,gloss);
    why=`${grammar?grammar+" ":""}${semantic}`;
  }

  const meaningMap=grade9MeaningMap(bank);
  const distractors=question.o
    .filter(x=>x!==answer)
    .map(x=>meaningMap[x]?`“${x}” = “${meaningMap[x]}”`:`“${x}”`)
    .join("; ");
  const contrast=`“${answer}” = “${gloss}”. So với các lựa chọn còn lại: ${distractors}. ${direct
    ? `Các nghĩa khác nhau rõ ràng nên chỉ “${answer}” khớp với khái niệm được hỏi.`
    : `Trong câu này, chỉ “${answer}” vừa đúng nghĩa “${gloss}” vừa phù hợp với vai trò mà câu đang mô tả; các lựa chọn kia sẽ làm câu đổi nghĩa hoặc sai vai trò.`}`;

  return {meaning,why,contrast,family:explanationFamily(detail,answer),standard:true};
}
function unit6StandardExplanation(question,detail){
  const answer=question.o[question.a];
  const gloss=explanationGloss(question,detail,answer);
  const info=blankInfo(question.q,answer);
  const meaning=String(detail.meaning||"").trim();
  const baseWhy=String(detail.why||"").trim();
  let why=baseWhy;
  if(info.before||info.after){
    const left=info.before?` Trước chỗ trống là “${info.before}”.`:"";
    const right=info.after?` Sau chỗ trống là “${info.after}”.`:"";
    const glossNote=gloss?` “${answer}” ở đây mang nghĩa “${gloss}”.`:"";
    why+=`${left}${right}${glossNote} Hai phần này cho thấy trực tiếp vai trò của “${answer}” trong câu và giải thích vì sao đáp án phù hợp với tình huống đang được mô tả.`;
  }
  return {
    meaning,
    why,
    contrast:String(detail.contrast||"").trim(),
    family:explanationFamily(detail,answer),
    standard:true
  };
}
function fallbackStandardExplanation(bank,question,detail){
  const answer=question.o[question.a];
  const gloss=explanationGloss(question,detail,answer);
  const info=blankInfo(question.q,answer);
  const meaning=String(detail.meaning||question.e||`${answer} = ${gloss}`).trim();
  const why=String(detail.why||"").trim() || (info.before||info.after
    ? `Ngay trước chỗ trống là “${info.before}”, còn sau chỗ trống là “${info.after}”. “${answer}” mang nghĩa “${gloss}”, nên nó hoàn chỉnh đúng ý và đúng vai trò ngữ pháp của câu.`
    : `“${answer}” mang nghĩa “${gloss}”, nên đáp án này khớp trực tiếp với yêu cầu của câu hỏi.`);
  return {
    meaning,
    why,
    contrast:String(detail.contrast||"").trim(),
    family:explanationFamily(detail,answer),
    standard:true
  };
}


function compactCore(text){
  return String(text||"")
    .replace(/^Choose the vocabulary item that best completes the source sentence:\s*/i,"")
    .replace(/^Choose the most precise vocabulary item from the source:\s*/i,"")
    .replace(/^Chọn từ\/cụm từ phù hợp nhất để hoàn thành câu:\s*/i,"")
    .replace(/^Chọn từ\/cụm từ chính xác nhất để hoàn thành câu:\s*/i,"")
    .replace(/^Chọn từ\/cụm từ hoàn thành đúng collocation:\s*/i,"")
    .trim();
}
function compactSnippet(text,max=76){
  const clean=String(text||"")
    .replace(/\s+/g," ")
    .replace(/^[“”"'.,;:!?\s]+|[“”"'.,;:!?\s]+$/g,"")
    .trim();
  if(clean.length<=max)return clean;
  return clean.slice(0,max).replace(/\s+\S*$/,"").trim()+"…";
}
function compactBlankInfo(text,answer){
  const core=compactCore(text);
  const m=core.match(/_{2,}/);
  if(!m)return {core,completed:core,before:"",after:""};
  const pos=m.index;
  const before=core.slice(0,pos).trim();
  const after=core.slice(pos+m[0].length).trim();
  return {
    core,
    completed:core.slice(0,pos)+answer+core.slice(pos+m[0].length),
    before,
    after
  };
}
function explanationPos(detail,answer){
  const text=String(detail?.meaning||"").toLowerCase();
  const a=String(answer||"").toLowerCase().trim();
  if(/\((?:adj|adjective|adj\.)[^)]*\)/.test(text) || /\b(adj\.?|adjective)\b/.test(text))return "adj";
  if(/\((?:adv|adverb|adv\.)[^)]*\)/.test(text) || /\b(adv\.?|adverb)\b/.test(text))return "adv";
  if(/\((?:v|verb|phr\.?\s*v|phr\.?v|pv|v\.)[^)]*\)/.test(text) || /\b(phr\.?\s*v|phrasal verb|verb|v\.)\b/.test(text))return "v";
  if(/\((?:n|noun|n\.)[^)]*\)/.test(text) || /\b(noun|n\.)\b/.test(text))return "n";
  if(/ly$/.test(a))return "adv";
  if(/(tion|sion|ment|ness|ity|ance|ence|ship|ism|ist)$/.test(a))return "n";
  if(/(ous|ive|al|ic|able|ible|less|ful|ant|ent)$/.test(a) || /^(world-class)$/.test(a))return "adj";
  return "";
}
function usageCollocation(detail,answer,info){
  const usage=String(detail?.usage||"");
  if(!usage)return "";
  const candidates=usage
    .split(/[;.]/)
    .map(x=>x.trim())
    .filter(x=>x && !/word family/i.test(x) && x.toLowerCase().includes(String(answer).toLowerCase()));
  if(!candidates.length)return "";
  const local=(info.before+" "+answer+" "+info.after).toLowerCase();
  return candidates.find(x=>{
    const words=x.toLowerCase().match(/[a-z][a-z'-]*/g)||[];
    return words.length>=2 && words.every(w=>local.includes(w));
  })||"";
}
function naturalCombination(question,detail,answer,info,pos){
  const explicit=/collocation/i.test(String(question?.q||""));
  if(explicit && /_{2,}/.test(info.core)){
    return compactSnippet(
      info.completed.replace(/[“”"]/g,"").replace(/[.?!]+$/,"").trim(),
      82
    );
  }

  const after=String(info.after||"").replace(/^[”"',;:.!?()\s]+/,"").trim();
  const next=(after.match(/^([A-Za-z][A-Za-z'-]*)/)||[])[1]||"";
  const stop=/^(because|and|or|but|to|of|in|on|at|for|with|by|from|as|than|that|which|who|whose|where|when|is|are|was|were|be|been|being|has|have|had|can|could|will|would|should|may|might|must|a|an|the|this|these|those|his|her|their|our|your|my)$/i;
  if(next && !stop.test(next) && (pos==="adj" || pos==="adv" || !pos)){
    return answer+" "+next;
  }

  return "";
}
function decisiveGrammar(info,pos,answer,gloss){
  const b=String(info.before||"").replace(/[“"'(),;:.!?]+$/g,"").trim();
  const last=(b.match(/([A-Za-z'-]+)\s*$/)||[])[1]||"";
  if(pos==="v" && /^(to|can|could|will|would|should|may|might|must)$/i.test(last)){
    return "Sau “"+last+"” cần động từ nguyên mẫu; “"+answer+"” vừa đúng cấu trúc vừa diễn tả ý “"+gloss+"”.";
  }
  if(pos==="adj" && /^(is|are|was|were|be|been|being|become|became|seem|seems|feel|feels|look|looks|remain|remains)$/i.test(last)){
    return "Sau động từ nối “"+last+"” cần thành phần mô tả trạng thái hoặc đặc điểm; “"+answer+"” cung cấp đúng ý “"+gloss+"”.";
  }
  if(pos==="n" && /^(a|an|the|this|that|his|her|their|our|your)$/i.test(last)){
    return "Sau “"+last+"” vị trí này cần một danh từ/cụm danh từ; “"+answer+"” gọi đúng đối tượng hoặc khái niệm mà câu đang nói tới.";
  }
  if(pos==="adv"){
    return "Chỗ trống bổ nghĩa cho hành động hoặc cách thức thực hiện, nên cần trạng từ; “"+answer+"” diễn tả đúng sắc thái “"+gloss+"”.";
  }
  return "";
}
function evidenceReason(info,answer,gloss){
  const text=String(info.core||"").replace(/\s+/g," ").trim();
  let m=text.match(/\bbecause\b\s+([^.!?]+)/i);
  if(m)return "Dấu hiệu quyết định là mệnh đề “because "+compactSnippet(m[1],68)+"”: nó cung cấp bằng chứng trực tiếp cho ý “"+gloss+"”.";
  m=text.match(/\bsuch as\b\s+([^.!?]+)/i);
  if(m)return "Các ví dụ sau “such as” — “"+compactSnippet(m[1],68)+"” — xác định đúng trường nghĩa cần điền, dẫn tới “"+answer+"”.";
  m=text.match(/\bfor example\b[,:\s]+([^.!?]+)/i);
  if(m)return "Ví dụ “"+compactSnippet(m[1],68)+"” thu hẹp nghĩa của chỗ trống về đúng ý “"+gloss+"”.";
  m=text.match(/\bso\b\s+([^.!?]+?)\s+\bthat\b\s+([^.!?]+)/i);
  if(m)return "Quan hệ mức độ–kết quả trong “so … that …” là manh mối chính: kết quả phía sau cho thấy đặc điểm cần diễn đạt là “"+gloss+"”.";
  m=text.match(/\bnot\b\s+([^,.]{1,90})\s*,?\s*\bbut(?: rather)?\b\s+([^,.]{1,100})/i);
  if(m)return "Cấu trúc đối lập “not … but …” loại bỏ một khả năng và nhấn mạnh ý còn lại; ý được nhấn mạnh phù hợp với “"+answer+"”.";
  m=text.match(/\bfrom\b\s+([^,.]{1,70})\s+\bto\b\s+([^,.]{1,90})/i);
  if(m)return "Cấu trúc “from … to …” cho thấy một quá trình hoặc sự chuyển biến; “"+answer+"” khái quát đúng đặc điểm của quá trình đó.";
  const semi=text.split(";");
  if(semi.length>1){
    return "Vế sau dấu chấm phẩy — “"+compactSnippet(semi.slice(1).join(";"),72)+"” — đóng vai trò bằng chứng/giải thích cho ý “"+gloss+"”.";
  }
  const after=compactSnippet(info.after,70);
  const before=compactSnippet(info.before,70);
  const clue=after||before;
  if(clue)return "Dấu hiệu quyết định là “"+clue+"”: chi tiết này hướng tới ý “"+gloss+"”, nên “"+answer+"” là cách diễn đạt phù hợp.";
  return "“"+answer+"” diễn đạt chính xác ý “"+gloss+"” mà câu yêu cầu.";
}
function usefulExistingWhy(text){
  const s=String(text||"").trim();
  if(!s)return "";
  if(/Ngay trước chỗ trống|Ngay sau chỗ trống|Câu hoàn chỉnh là|Khi đặt vào|phần câu quanh đáp án|khớp trực tiếp với yêu cầu|không cần suy luận thêm|Hai phần này cùng xác định|đúng vai trò ngữ pháp/i.test(s))return "";
  const sentences=s.split(/(?<=[.!?])\s+/).filter(Boolean);
  const useful=sentences.filter(x=>!/^(“?Audience|“?Participant|“?Judge|“?Organiser|Các lựa chọn|Các phương án)/i.test(x));
  const picked=(useful.length?useful:sentences).slice(0,2).join(" ").trim();
  return picked.length<=460?picked:compactSnippet(picked,440);
}
function usefulExistingContrast(text){
  const s=String(text||"").trim();
  if(!s || s.length>330)return "";
  if(/các lựa chọn còn lại|các phương án còn lại|vì vậy chỉ|câu sẽ chuyển|không còn hợp|khớp chính xác|so với các lựa chọn|đổi nghĩa hoặc sai vai trò/i.test(s))return "";
  return s;
}
/* Never infer an object's semantic category from a suffix:
 * career, clapper and organiser can all end in -er/-or, but only one names a person.
 * Use the curated meaning and actual sentence rather than a guessed ontology.
 */
function nounMeaningContrast(answer,gloss,info){
  const meaning=String(gloss||"").trim();
  const after=compactSnippet(info.after,100);
  const before=compactSnippet(info.before,100);
  const clue=(after&&after.length>=10)?after:before;
  return "“"+answer+"” có nghĩa là “"+meaning+"”."+
    (clue?" Khi phân biệt đáp án, đối chiếu ý này với chi tiết “"+clue+"” trong câu.":" Hãy đối chiếu nghĩa này với nội dung thực tế của câu.")+
    " Một phương án có cùng từ loại vẫn có thể sai nếu không diễn đạt đúng ý đó.";
}
function compactWhy(question,detail,answer,gloss,info,pos){
  const q=String(question?.q||"");
  const direct=/Which English word or phrase means|Từ\/cụm từ nào có nghĩa|có nghĩa/i.test(q) && !/_{2,}/.test(q);
  if(direct)return "“"+answer+"” dùng để chỉ “"+gloss+"”; với dạng nhận diện nghĩa, đây là nét nghĩa cốt lõi cần ghi nhớ.";

  const explicit=/collocation/i.test(q);
  const combo=naturalCombination(question,detail,answer,info,pos);
  if(explicit && combo){
    return "“"+combo+"” là cấu trúc/collocation cố định; “"+answer+"” là thành tố được quy ước để tạo đúng nghĩa “"+gloss+"”.";
  }
  if(combo && (pos==="adj" || pos==="adv" || !pos)){
    return "“"+combo+"” là cách kết hợp tự nhiên; “"+answer+"” tạo đúng sắc thái “"+gloss+"” cho từ đứng cạnh.";
  }

  // Preserve a writer's question-specific explanation before any mechanical
  // part-of-speech heuristic; these carry the actual evidence for the answer.
  const existing=usefulExistingWhy(detail?.why);
  if(existing)return existing;

  const grammar=decisiveGrammar(info,pos,answer,gloss);
  if(grammar)return grammar;

  return evidenceReason(info,answer,gloss);
}
function compactContrast(question,detail,answer,gloss,info,pos){
  const q=String(question?.q||"");
  const explicit=/collocation/i.test(q);
  const combo=naturalCombination(question,detail,answer,info,pos);

  if(explicit && combo){
    return "Khung “"+combo+"” có tính cố định: “"+answer+"” được lựa chọn bởi chính collocation này. Từ gần nghĩa không thể thay vào tùy ý mà vẫn giữ cùng cách dùng và sắc thái.";
  }

  if(combo && (pos==="adj" || pos==="adv" || !pos)){
    const after=String(info.after||"").replace(/^[”"',;:.!?()\s]+/,"").trim();
    const head=(after.match(/^([A-Za-z][A-Za-z'-]*)/)||[])[1]||"";
    if(pos==="adv"){
      return "“"+answer+"” mô tả hành động “"+head+"” theo nghĩa “"+gloss+"”. Một trạng từ gần nghĩa khác có thể mô tả cách thực hiện khác, nên cần xét cả động từ được bổ nghĩa.";
    }
    return "“"+answer+"” bổ nghĩa cho “"+head+"” theo ý “"+gloss+"”. Khi so sánh đáp án, cần xét đúng đặc điểm được mô tả, không chỉ kiểm tra từ loại.";
  }

  const existing=usefulExistingContrast(detail?.contrast);
  if(existing)return existing;

  const after=String(info.after||"").replace(/^[”"',;:.!?()\s]+/,"").trim();
  const before=String(info.before||"").replace(/[”"',;:.!?()\s]+$/,"").trim();
  const prev=(before.match(/([A-Za-z][A-Za-z'-]*)$/)||[])[1]||"";

  if(pos==="adj" && /ly$/i.test(prev)){
    return "“"+prev+" "+answer+"” tạo một quan hệ nghĩa cụ thể: trạng từ giới hạn phương diện đánh giá, còn “"+answer+"” mang sắc thái “"+gloss+"”. Vì vậy điểm phân biệt nằm ở đúng phương diện nghĩa mà tính từ mô tả.";
  }
  if(pos==="v" && after){
    return "“"+answer+"” đi với phần sau “"+compactSnippet(after,48)+"” để diễn tả “"+gloss+"”. Cần chọn động từ diễn tả đúng hành động và quan hệ với phần bổ nghĩa trong câu.";
  }
  if(pos==="n"){
    return nounMeaningContrast(answer,gloss,info);
  }
  if(pos==="adv"){
    return "“"+answer+"” không chỉ đúng từ loại mà còn mang sắc thái “"+gloss+"”, tức mô tả chính xác cách thức hành động diễn ra; đó là điểm phân biệt với các trạng từ có sắc thái khác.";
  }
  if(/\s/.test(String(answer))){
    return "“"+answer+"” hoạt động như một đơn vị nghĩa cố định mang ý “"+gloss+"”; thay từng thành tố bằng từ gần nghĩa không bảo đảm giữ được cùng cách dùng và sắc thái.";
  }

  const direct=/Which English word or phrase means|Từ\/cụm từ nào có nghĩa|có nghĩa/i.test(q) && !/_{2,}/.test(q);
  if(direct){
    return "Điểm cần phân biệt là phạm vi nghĩa: “"+answer+"” gọi đúng khái niệm “"+gloss+"”, còn các lựa chọn khác biểu đạt những khái niệm khác trong cùng nhóm từ vựng.";
  }

  return "Điểm phân biệt nằm ở sắc thái “"+gloss+"”: “"+answer+"” phù hợp với loại đối tượng và quan hệ nghĩa mà ngữ cảnh cho phép.";
}
function unifiedStandardExplanation(bank,question,detail){
  if(detail?.preserve)return {...detail,standard:true};
  const answer=question.o[question.a];
  const gloss=explanationGloss(question,detail,answer);
  const info=compactBlankInfo(question.q,answer);
  const pos=explanationPos(detail,answer);
  const meaning=String(detail?.meaning||question.e||"“"+answer+"” = “"+gloss+"”.").trim();
  return {
    ...detail,
    meaning,
    why:compactWhy(question,detail,answer,gloss,info,pos),
    contrast:compactContrast(question,detail,answer,gloss,info,pos),
    family:explanationFamily(detail,answer),
    standard:true
  };
}

function sentenceTranslation(bank,question,index){
  const key=bank.grade+"-"+bank.unit;
  const mapped=window.SENTENCE_TRANSLATIONS?.[key]?.[index];
  if(mapped)return mapped;

  const text=String(question?.q||"").trim();
  let m=text.match(/^Which English word or phrase means “([^”]+)”\?$/i);
  if(m)return `Từ hoặc cụm từ tiếng Anh nào có nghĩa là “${m[1]}”?`;

  return "";
}

const normalizedBanks=new WeakSet();
function prepareManifestBank(bank){
  if(!bank?.questions||!bank?.explanations||normalizedBanks.has(bank))return;
  bank.explanations=bank.explanations.map((detail,index)=>{
    const question=bank.questions[index];
    if(!question)return detail;
    const normalized=unifiedStandardExplanation(bank,question,detail);
    return {...normalized,translation:normalized.translation||(normalized.preserve?"":sentenceTranslation(bank,question,index))};
  });
  normalizedBanks.add(bank);
}

function saveLearnerSession(data){

    ? Number(data.expires_at)*1000
    : Date.now()+Math.max(60,Number(data.expires_in)||3600)*1000;

    refresh_token:data.refresh_token||old.refresh_token||"",
    token_type:data.token_type||old.token_type||"bearer",

async function learnerAuthRequest(path,init={}){
  const headers={
    "apikey":SUPABASE_KEY,
    "Content-Type":"application/json",
    ...((init.headers)||{})
  };
  const res=await fetch(SUPABASE_URL+path,{...init,headers});
  const raw=await res.text();
  let data=null;
  if(raw){try{data=JSON.parse(raw)}catch(_){data={message:raw}}}
  if(!res.ok){
    const err=new Error(data?.msg||data?.message||data?.error_description||data?.error||"Authentication failed");
    err.status=res.status;
    throw err;
  }
  return data||{};
}
async function hydrateLearnerUser(session){
  if(!session?.access_token)return null;
  if(session.user)return session;
  try{
    const user=await learnerAuthRequest("/auth/v1/user",{
      method:"GET",
      headers:{"Authorization":"Bearer "+session.access_token}
    });
    return saveLearnerSession({...session,user});
  }catch(_){
    return null;
  }
}
async function refreshLearnerSession(session){
  if(!session?.refresh_token)return null;
  try{
    const data=await learnerAuthRequest("/auth/v1/token?grant_type=refresh_token",{
      method:"POST",
      body:JSON.stringify({refresh_token:session.refresh_token})
    });
    return saveLearnerSession(data);
  }catch(_){
    clearLearnerSession();
    return null;
  }
}
async function ensureLearnerSession(){
  let session=readLearnerSession();
  if(!session)return null;
  if(!session.expires_at_ms||session.expires_at_ms<Date.now()+60000){
    session=await refreshLearnerSession(session);
    if(!session)return null;
  }
  if(!session.user){
    session=await hydrateLearnerUser(session);
    if(!session){clearLearnerSession();return null}
  }
  return session;
}
function consumeLearnerAuthCallback(){
  const raw=location.hash.replace(/^#/,"");
  if(!raw.includes("access_token="))return false;
  const p=new URLSearchParams(raw);
  const accessToken=p.get("access_token");
  const refreshToken=p.get("refresh_token");
  if(!accessToken)return false;
  saveLearnerSession({
    access_token:accessToken,
    refresh_token:refreshToken||"",
    token_type:p.get("token_type")||"bearer",
    expires_in:Number(p.get("expires_in"))||3600
  });
  history.replaceState(null,"",location.pathname+location.search);
  return true;
}

function shuffled(items){
  const copy=[...items];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

function shuffleQuestionOptions(question){
  if(question?.lockOptions)return {...question,o:[...(question.o||[])]};
  if(!Array.isArray(question?.o))return {...question};
  const shuffledOptions=shuffled(
    question.o.map((text,originalIndex)=>({text,originalIndex}))
  );
  return {
    ...question,
    o:shuffledOptions.map(item=>item.text),
    a:shuffledOptions.findIndex(item=>item.originalIndex===question.a)
  };
}

function contextProgressRank(index,progress){
  const q=activeBank.questions[index]||{};
  const id=q.targetId||q.id||("cg-"+index);
  const st=progress.items[id];
  if(!st)return [0,0,0];
  const seen=Number(st.seenCount)||0;
  const wrong=Number(st.wrongAttempts)||0;
  const first=Number(st.firstTryCorrect)||0;
  const acc=seen?first/seen:0;
  const weakness=wrong>0&&acc<0.75?0:1;
  return [weakness,Number(st.lastSeen)||0,seen];
}
function pickContextAdaptive(pool,count,progress){
  const candidates=shuffled([...(pool||[])]);
  candidates.sort((a,b)=>{
    const A=contextProgressRank(a,progress),B=contextProgressRank(b,progress);
    return A[0]-B[0] || A[1]-B[1] || A[2]-B[2];
  });
  return candidates.slice(0,Math.max(0,count));
}
function recordContextProgress(question,wrongCount){
  if(!question)return;
  const id=question.targetId||question.id;
  if(!id)return;
  const data=readContextProgress();
  const st=data.items[id]||{seenCount:0,firstTryCorrect:0,wrongAttempts:0,lastSeen:0};
  st.seenCount++;
  if(!wrongCount)st.firstTryCorrect++;
  st.wrongAttempts+=Number(wrongCount)||0;
  st.lastSeen=Date.now();
  data.items[id]=st;
  writeContextProgress(data);
}
function progressRank(index,progress){
  const q=activeBank.questions[index]||{};
  const id=q.targetId||q.id||("q-"+index);
  const st=progress.items[id];
  if(!st)return [0,0,0];
  const seen=Number(st.seenCount)||0;
  const first=Number(st.firstTryCorrect)||0;
  const wrong=Number(st.wrongAttempts)||0;
  const acc=seen?first/seen:0;
  let band=2;
  if(st.mastery==="weak" || (wrong>0&&acc<0.7))band=1;
  else if(st.mastery==="mastered" || (seen>=3&&acc>=0.8))band=3;
  return [band,Number(st.lastSeen)||0,seen];
}
function pickAdaptive(pool,count,progress,exclude=new Set()){
  const candidates=shuffled((pool||[]).filter(i=>!exclude.has(i)));
  candidates.sort((a,b)=>{
    const A=progressRank(a,progress),B=progressRank(b,progress);
    return A[0]-B[0] || A[1]-B[1] || A[2]-B[2];
  });
  return candidates.slice(0,Math.max(0,count));
}
function recordVocabProgress(question,wrongCount){
  if(!question)return;
  if(question.type==="context_guessing")recordContextProgress(question,wrongCount);
  if(activeGrade!==12)return;
  const id=question.targetId||question.id;
  if(!id)return;
  const data=readVocabProgress();
  const st=data.items[id]||{seenCount:0,firstTryCorrect:0,wrongAttempts:0,lastSeen:0,mastery:"new"};
  st.seenCount++;
  if(!wrongCount)st.firstTryCorrect++;
  st.wrongAttempts+=Number(wrongCount)||0;
  st.lastSeen=Date.now();
  const acc=st.firstTryCorrect/st.seenCount;
  if(wrongCount>0&&acc<0.75)st.mastery="weak";
  else if(st.seenCount>=3&&acc>=0.8)st.mastery="mastered";
  else st.mastery="learning";
  data.items[id]=st;
  writeVocabProgress(data);
}

function loadQuestionPool(indices,{shuffleOrder=true}={}){
  activeQuestionIndices=shuffleOrder?shuffled(indices):[...indices];
  activeQuestions=activeQuestionIndices.map(i=>shuffleQuestionOptions(activeBank.questions[i]));
  activeExplanations=activeQuestions.map((q,pos)=>activeBank?.explanationById?.[q.id]||activeBank.explanations[activeQuestionIndices[pos]]||{});
}
function selectSet(setNo){
  const requested=Number(setNo)||1;
  const available=getUnitSetNumbers();
  const safe=available.includes(requested)?requested:(available[0]||1);
  activeSet=safe;
  activeLevel=activeLevelConfig[safe];
  activeSublevelKey="";

  if(activeMode==="grammar"){
    loadQuestionPool(activeLevel.pool||[],{shuffleOrder:false});
    return;
  }

  if(activeLevel?.contextGuessing){
    activeQuestionIndices=[];
    activeQuestions=[];
    activeExplanations=[];
    return;
  }
  if(activeLevel?.fixedOrder){
    loadQuestionPool(activeLevel.pool||[],{shuffleOrder:false});
    return;
  }
  if(activeLevel?.readingTail){
    const pool=[...(activeLevel.pool||[])];
    const head=pool.slice(0,Math.max(0,pool.length-5));
    const tail=pool.slice(-5);
    activeQuestionIndices=shuffled(head).concat(tail);
    activeQuestions=activeQuestionIndices.map(i=>shuffleQuestionOptions(activeBank.questions[i]));
    activeExplanations=activeQuestions.map((q,pos)=>activeBank?.explanationById?.[q.id]||activeBank.explanations[activeQuestionIndices[pos]]||{});
  }else if(activeGrade===12&&activeLevel?.sessionSize){
    const progress=readVocabProgress();
    const selected=[];
    const used=new Set();
    const mix=activeLevel.mix||{};
    const add=(pool,count)=>{
      const picked=pickAdaptive(pool,count,progress,used);
      picked.forEach(i=>{selected.push(i);used.add(i)});
    };
    if(mix.source)add(activeLevel.sourcePool||activeLevel.pool,mix.source);
    if(mix.external)add(activeLevel.externalPool||activeLevel.pool,mix.external);
    if(!mix.source&&!mix.external)add(activeLevel.pool,activeLevel.sessionSize);
    if(selected.length<activeLevel.sessionSize)add(activeLevel.pool,activeLevel.sessionSize-selected.length);
    loadQuestionPool(selected.slice(0,activeLevel.sessionSize),{shuffleOrder:true});
  }else{
    loadQuestionPool(activeLevel.pool||[],{shuffleOrder:true});
  }
}

async function validateStoredAccess(area){
  const stored=getStoredAccess(area);
  if(!stored?.token)return false;
  if(stored.expiresAt&&Date.parse(stored.expiresAt)<=Date.now()){
    clearStoredAccess(area);
    return false;
  }
  if(cachedAccessValid(area,stored.token))return true;
  try{
    const data=await accessRequest({action:"validate",area,token:stored.token,deviceId:getDeviceId()});
    if(data?.ok){cacheAccessValid(area,stored.token);return true}

const STREAK_WEEKS=27;
function vnDateKey(date=new Date()){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Ho_Chi_Minh",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date);
  const pick=t=>parts.find(p=>p.type===t)?.value||"";
  return pick("year")+"-"+pick("month")+"-"+pick("day");
}
function utcDateFromKey(key){
  const a=String(key).split("-").map(Number);
  return new Date(Date.UTC(a[0],a[1]-1,a[2]));
}
function dateKeyUTC(date){
  return date.getUTCFullYear()+"-"+String(date.getUTCMonth()+1).padStart(2,"0")+"-"+String(date.getUTCDate()).padStart(2,"0");
}
function addDaysKey(key,days){
  const d=utcDateFromKey(key);
  d.setUTCDate(d.getUTCDate()+days);
  return dateKeyUTC(d);
}
function streakHeatmapStart(todayKey=vnDateKey()){
  const today=utcDateFromKey(todayKey);
  const sundayOffset=today.getUTCDay();
  const currentSunday=new Date(today);
  currentSunday.setUTCDate(today.getUTCDate()-sundayOffset);
  currentSunday.setUTCDate(currentSunday.getUTCDate()-(STREAK_WEEKS-1)*7);
  return dateKeyUTC(currentSunday);
}
function streakLevel(count){
  const n=Number(count)||0;
  if(n<=0)return 0;
  if(n===1)return 1;
  if(n===2)return 2;
  if(n<=4)return 3;
  return 4;
}
function calculateCurrentStreak(activityMap,todayKey=vnDateKey()){
  let cursor=activityMap[todayKey]>0?todayKey:addDaysKey(todayKey,-1);
  if(!(activityMap[cursor]>0))return 0;
  let streak=0;
  while(activityMap[cursor]>0){
    streak++;
    cursor=addDaysKey(cursor,-1);
  }
  return streak;
}
function renderTutoringStreak(rows=[]){
  const heat=document.getElementById("tutoringStreakHeatmap");
  const months=document.getElementById("tutoringStreakMonths");
  const number=document.getElementById("tutoringStreakNumber");
  if(!heat||!months||!number)return;
  const today=vnDateKey();
  const start=streakHeatmapStart(today);
  const map={};
  rows.forEach(r=>{map[String(r.activity_date)]=Number(r.activity_count)||0});
  const cells=[];
  const monthSlots=[];
  let previousMonth="";
  const monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  for(let week=0;week<STREAK_WEEKS;week++){
    const weekStart=addDaysKey(start,week*7);
    const d=utcDateFromKey(weekStart);
    const month=d.getUTCMonth();
    const monthKey=d.getUTCFullYear()+"-"+month;
    if(monthKey!==previousMonth){
      monthSlots.push('<span style="grid-column:'+(week+1)+'">'+monthNames[month]+'</span>');
      previousMonth=monthKey;
    }
    for(let day=0;day<7;day++){
      const key=addDaysKey(weekStart,day);
      const count=map[key]||0;
      const future=key>today;
      const level=future?0:streakLevel(count);
      const label=future?"":key+" · "+count+" hoạt động";
      cells.push('<span class="streak-cell '+(future?"future":"level-"+level)+'" title="'+esc(label)+'" aria-label="'+esc(label)+'"></span>');
    }
  }
  months.innerHTML=monthSlots.join("");
  heat.innerHTML=cells.join("");
  number.textContent=String(calculateCurrentStreak(map,today));
}
async function loadTutoringStreak(){
  if(!document.getElementById("tutoringStreakCard"))return;
  const session=await ensureLearnerSession();
  if(!session?.user?.id||!session?.access_token)return;
  try{
    const query="?select=activity_date,activity_count&user_id=eq."+encodeURIComponent(session.user.id)+"&order=activity_date.asc";
    const res=await fetch(SUPABASE_URL+"/rest/v1/learner_daily_activity"+query,{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+session.access_token}});
    if(!res.ok)throw new Error("Streak fetch failed");
    renderTutoringStreak(await res.json());
  }catch(err){
    console.error(err);
    const number=document.getElementById("tutoringStreakNumber");
    if(number)number.textContent="—";
  }
}

function initQuizState(){
  current=0;
  answers=Array(activeQuestions.length).fill(null);
  solved=Array(activeQuestions.length).fill(false);
  mistakes=Array(activeQuestions.length).fill(0);
  wrongChoices=Array.from({length:activeQuestions.length},()=>new Set());
  skipped=Array(activeQuestions.length).fill(false);
  quizStartedAt=Date.now();
  scoreSubmitted=false;
  quizFinished=false;
  wordformDrafts=Array(activeQuestions.length).fill("");
  readingScrollTop=0;
  readingQuestionScrollTop=0;
  readingContextText="";
}
function quizAttemptIdentity(){
  return activeMode==="grammar"
    ?"grammar/"+activeGrammarSlug+"/set-"+activeSet
    :"grade-"+activeGrade+"/unit-"+activeUnit+"/set-"+activeSet+(activeLevel?.contextGuessing?"/context":"");
}
function saveQuizAttempt(){
  if(!quizStartedAt||quizFinished||!activeQuestions?.length)return;
  LearningCore.writeDraft("quiz",quizAttemptIdentity(),{
    version:activeBank?.version||1,startedAt:quizStartedAt,
    indices:activeQuestionIndices,questions:activeQuestions,current,
    sourceHashes:activeQuestionIndices.map(i=>LearningCore.fingerprint(activeBank.questions[i])),
    answers,solved,mistakes,wrongChoices:wrongChoices.map(x=>[...x]),skipped,
    wordformDrafts,sublevel:activeSublevelKey
  });
  LearningFlow.track({category:activeMode==="grammar"?"grammar":"vocabulary",
    slug:quizAttemptIdentity(),ownerId:LearningCore.userId(),started:true,
    startedAt:quizStartedAt,done:solved.filter(Boolean).length,total:activeQuestions.length,
    mode:"mastery"});
}
function restoreQuizAttempt(){
  const d=LearningCore.readDraft("quiz",quizAttemptIdentity());
  if(!d||d.version!==(activeBank?.version||1)||!Array.isArray(d.questions)
    ||!d.questions.length||!Array.isArray(d.indices)||d.indices.length!==d.questions.length
    ||d.solved?.length!==d.questions.length||d.mistakes?.length!==d.questions.length
    ||d.sourceHashes?.length!==d.indices.length
    ||d.indices.some((i,pos)=>!Number.isInteger(i)||!activeBank.questions[i]||d.sourceHashes[pos]!==LearningCore.fingerprint(activeBank.questions[i])))return false;
  activeQuestionIndices=d.indices;
  activeQuestions=d.questions;
  activeExplanations=d.indices.map((i,p)=>activeBank?.explanationById?.[d.questions[p]?.id]||activeBank.explanations[i]||{});
  current=Math.max(0,Math.min(d.questions.length-1,Number(d.current)||0));
  answers=Array.isArray(d.answers)&&d.answers.length===d.questions.length?d.answers:Array(d.questions.length).fill(null);
  solved=d.solved.map(Boolean);mistakes=d.mistakes.map(x=>Math.max(0,Number(x)||0));
  wrongChoices=d.questions.map((_,i)=>new Set(Array.isArray(d.wrongChoices?.[i])?d.wrongChoices[i]:[]));
  skipped=Array.isArray(d.skipped)&&d.skipped.length===d.questions.length?d.skipped.map(Boolean):Array(d.questions.length).fill(false);
  quizStartedAt=Number(d.startedAt)||Date.now();scoreSubmitted=false;quizFinished=false;
  wordformDrafts=Array.isArray(d.wordformDrafts)&&d.wordformDrafts.length===d.questions.length?d.wordformDrafts:Array(d.questions.length).fill("");
  activeSublevelKey=d.sublevel||activeSublevelKey;
  return true;
}
function readNickname(){
  const nickname=String(learnerDisplayName()||learnerUsername()||"").trim().replace(/\s+/g," ");
  if(nickname.length<2){toast("Không đọc được tên học viên từ tài khoản");return false}
  currentNickname=nickname.slice(0,24);
  localStorage.setItem("vocabNickname",currentNickname);
  return true;
}
function showQuizShell(){
  hideAll();
  document.getElementById("exitQuizBtn").textContent=activeMode==="grammar"
    ? "← "+activeBank.title+" · Set "+activeSet
    : (activeLevel?.contextGuessing
      ? "← "+currentUnitLabel()+" · Context Guessing"
      : "← "+currentUnitLabel()+" · Set "+activeSet);
  quizShell.style.display="block";
  renderQuestion();
  window.scrollTo({top:0,behavior:"smooth"});
}
function startContextGuessing(levelKey,fromRetry=false){
  const cfg=activeLevelConfig[activeSet];
  if(!cfg?.contextGuessing)return;
  if(!fromRetry&&!readNickname())return;
  if(fromRetry&&currentNickname.length<2){goUnit(activeUnit,activeGrade);return}

  activeLevel=cfg;
  activeSublevelKey="mixed";
  if(!fromRetry&&restoreQuizAttempt()){showQuizShell();return}
  if(fromRetry)LearningCore.clearDraft("quiz",quizAttemptIdentity());
  const progress=readContextProgress();
  const combinedPool=[...(cfg.pool||[])];
  const picked=pickContextAdaptive(combinedPool,cfg.sessionSize||10,progress);
  const passage=picked.map(i=>activeBank.questions[i]?.contextSentence||activeBank.questions[i]?.context||"").filter(Boolean).join(" ");

  activeQuestionIndices=picked;
  activeQuestions=activeQuestionIndices.map(i=>{
    const original=activeBank.questions[i]||{};
    const q={...original,context:passage||original.context||"",contextLevelLabel:"Mixed adaptive set"};
    return shuffleQuestionOptions(q);
  });
  activeExplanations=activeQuestions.map((q,pos)=>activeBank?.explanationById?.[q.id]||activeBank.explanations[activeQuestionIndices[pos]]||{});

  initQuizState();
  showQuizShell();
}
function startQuiz(reset=false,forceNew=false){
  if(reset&&activeLevel?.contextGuessing&&activeSublevelKey){
    startContextGuessing(activeSublevelKey,forceNew);
    return;
  }
  if(reset){
    if(activeMode!=="grammar"&&!readNickname())return;
    if(!forceNew&&restoreQuizAttempt()){showQuizShell();return}
    LearningCore.clearDraft("quiz",quizAttemptIdentity());
    LearningFlow.reset(activeMode==="grammar"?"grammar":"vocabulary",quizAttemptIdentity());
    selectSet(activeSet);
    initQuizState();
  }
  showQuizShell();
}

function correctAnswerText(q){
  if(q?.kind==="input")return q.answers?.[0]||q.answer||"";
  return Array.isArray(q?.o)&&Number.isInteger(q?.a)?`${"ABCD"[q.a]}. ${q.o[q.a]}`:"";
}
function normalizeQuizInput(value){
  return String(value??"").toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:]+$/g,"").replace(/\s+/g," ").trim();
}
function questionPromptHTML(q){
  const raw=String(q?.q||"");
  let body=esc(raw);
  const target=String(q?.target||"").trim();
  if(target){
    const pos=raw.toLowerCase().indexOf(target.toLowerCase());
    if(pos>=0){
      body=esc(raw.slice(0,pos))+'<u class="vocab-target">'+esc(raw.slice(pos,pos+target.length))+'</u>'+esc(raw.slice(pos+target.length));
    }
  }
  const label=q?.promptType?'<span class="question-mode">'+esc(q.promptType)+'</span>':"";
  return label+body;
}

function readingPassageHTML(q){
  let plain=String(q?.context||"").replace(/\*\*/g,"");
  let html=esc(plain).replace(/\n/g,"<br>");
  const focus=String(q?.focus||"").replace(/\*\*/g,"");
  if(focus){
    const token=esc(focus);
    const pos=html.indexOf(token);
    if(pos>=0)html=html.slice(0,pos)+'<span class="reading-focus">'+token+'</span>'+html.slice(pos+token.length);
  }
  return html;
}
function renderQuestion(){
  saveQuizAttempt();
  const q=activeQuestions[current],isSolved=solved[current];
  const solvedCount=solved.filter(Boolean).length;
  progress.style.width=((current+1)/activeQuestions.length*100)+"%";
  counter.textContent=`${current+1} / ${activeQuestions.length}`;
  LearningFlow.paint(document.getElementById("quizFlowStatus"),{started:true,
    done:solvedCount,total:activeQuestions.length,mode:"mastery"});
  if(q.context!==readingContextText){
    readingContextText=q.context||"";
    readingScrollTop=0;
    readingQuestionScrollTop=0;
  }
  const feedback=isSolved ? deepFeedback(current) : (wrongChoices[current].size ? wrongFeedback(current) : "");
  const answerBlock=q.kind==="input"
    ? `<div class="wordform-wrap">
        <input class="wordform-input" id="wordformInput" type="text" autocomplete="off" spellcheck="false"
          placeholder="Nhập đáp án" ${isSolved?"disabled":""} value="${isSolved?esc(correctAnswerText(q)):esc(wordformDrafts[current]||"")}">
        <button class="primary" id="wordformSubmit" ${isSolved?"disabled":""}>Kiểm tra</button>
      </div>`
    : `<div class="answers">
        ${q.o.map((opt,i)=>{
          const isCorrect=isSolved&&i===q.a;
          const wasWrong=wrongChoices[current].has(i);
          return `<button class="answer ${isCorrect?"correct":wasWrong?"wrong-choice":""}" data-i="${i}" ${isSolved||wasWrong?"disabled":""}>
            <span class="letter">${"ABCD"[i]}</span><span>${esc(opt)}</span>
          </button>`
        }).join("")}
      </div>`;
  const navBlock=`
      <div class="nav ${q.type==="context_guessing"?"context-nav":""}">
        <button class="secondary" id="prevBtn" ${current===0?"disabled":""}>← ${LearningFlow.labels.previous}</button>
        ${isSolved
          ? (current===activeQuestions.length-1
              ? '<button class="primary" id="finishBtn">Xem kết quả ✓</button>'
              : '<button class="primary" id="nextBtn">Câu tiếp theo →</button>')
          : '<span class="next-lock">Trả lời đúng để tiếp tục →</span>'}
      </div>`;
  const isReading=!!q.context&&(q.type==="reading"||q.type==="context_guessing")&&activeBank?.pilotFixedFormat;
  if(isReading){
    const paneLabel=q.type==="context_guessing"
      ? "CONTEXT GUESSING · "+(q.contextLevelLabel||activeLevel?.label||"")
      : "READING / CLOZE";
    qMount.innerHTML=`
      <div class="question-card reading-card">
        <div class="reading-layout ${q.type==="context_guessing"?"context-reading-layout":""}">
          <section class="reading-pane" id="readingPane">
            <div class="reading-pane-head"><b>Reading passage</b><span>${esc(paneLabel)}</span></div>
            <div class="reading-text">${readingPassageHTML(q)}</div>
          </section>
          <section class="reading-question-pane" id="readingQuestionPane">
            <div class="kicker"><span class="qnum">QUESTION ${String(current+1).padStart(2,"0")}</span><span>${solvedCount} mastered</span></div>
            <h2 class="question">${questionPromptHTML(q)}</h2>
            ${answerBlock}
            ${q.type==="context_guessing"?navBlock:""}
            <div id="feedbackMount">${feedback}</div>
            ${q.type==="context_guessing"?"":navBlock}
          </section>
        </div>
      </div>`;
    const pane=document.getElementById("readingPane");
    if(pane){
      pane.scrollTop=readingScrollTop;
      pane.addEventListener("scroll",()=>{readingScrollTop=pane.scrollTop},{passive:true});
    }
    const questionPane=document.getElementById("readingQuestionPane");
    if(questionPane){
      questionPane.scrollTop=readingQuestionScrollTop;
      questionPane.addEventListener("scroll",()=>{readingQuestionScrollTop=questionPane.scrollTop},{passive:true});
    }
  }else{
    const legacyContext=q.context?`<div class="reading-passage">${esc(q.context).replace(/\n/g,"<br>")}</div>`:"";
    qMount.innerHTML=`
      <div class="question-card">
        <div class="kicker"><span class="qnum">QUESTION ${String(current+1).padStart(2,"0")}</span><span>${solvedCount} mastered</span></div>
        ${legacyContext}
        <h2 class="question">${questionPromptHTML(q)}</h2>
        ${answerBlock}
        <div id="feedbackMount">${feedback}</div>
        ${navBlock}
      </div>`;
  }

  qMount.querySelectorAll(".answer:not(:disabled)").forEach(btn=>btn.onclick=()=>checkAnswer(Number(btn.dataset.i)));
  const input=document.getElementById("wordformInput");
  const submit=document.getElementById("wordformSubmit");
  const skipBtn=document.getElementById("skipWordformBtn");
  if(skipBtn)skipBtn.onclick=skipWordformQuestion;
  if(input&&!isSolved){
    input.addEventListener("input",()=>{wordformDrafts[current]=input.value;saveQuizAttempt()});
    if(submit)submit.onclick=()=>checkInputAnswer(input.value);
    input.addEventListener("keydown",e=>{
      if(e.key!=="Enter")return;
      e.preventDefault();
      e.stopPropagation();
      checkInputAnswer(input.value);
    });
    setTimeout(()=>input.focus(),0);
  }
  const p=document.getElementById("prevBtn"); if(p)p.onclick=()=>move(-1);
  const n=document.getElementById("nextBtn"); if(n)n.onclick=()=>move(1);
  const finish=document.getElementById("finishBtn"); if(finish)finish.onclick=finishLearning;
}

function checkInputAnswer(value){
  const q=activeQuestions[current];
  if(!q||q.kind!=="input"||solved[current])return;

  const entered=normalizeQuizInput(value);
  if(!entered)return;

  const accepted=(q.answers||[q.answer]).filter(Boolean).map(normalizeQuizInput);
  if(accepted.includes(entered)){
    answers[current]=value.trim();wordformDrafts[current]="";
    solved[current]=true;
    recordVocabProgress(q,mistakes[current]);
    renderQuestion();
    const panel=document.querySelector(".feedback.correct");
    if(panel)panel.scrollIntoView({behavior:"smooth",block:"nearest"});
    return;
  }

  mistakes[current]++;
  wrongChoices[current].add(entered);
  renderQuestion();
  const input=document.getElementById("wordformInput");
  if(input){
    input.value=value;
    input.focus();
    input.select();
  }
  const panel=document.querySelector(".feedback.wrong");
  if(panel)panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function skipWordformQuestion(){
  const q=activeQuestions[current];
  if(!q||q.kind!=="input"||solved[current]||!activeBank?.pilotFixedFormat||mistakes[current]<5)return;

  skipped[current]=true;
  answers[current]=correctAnswerText(q);
  solved[current]=true;
  recordVocabProgress(q,mistakes[current]);
  renderQuestion();

  const panel=document.querySelector(".feedback.correct");
  if(panel)panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function checkAnswer(i){
  const q=activeQuestions[current];
  if(solved[current])return;
  if(i===q.a){
    answers[current]=i;wordformDrafts[current]="";
    solved[current]=true;
    recordVocabProgress(q,mistakes[current]);
    renderQuestion();
    const panel=document.querySelector(".feedback.correct");
    if(panel)panel.scrollIntoView({behavior:"smooth",block:"nearest"});
    return;
  }
  mistakes[current]++;
  wrongChoices[current].add(i);
  renderQuestion();
  const panel=document.querySelector(".feedback.wrong");
  if(panel)panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function wrongFeedback(index){
  const q=activeQuestions[index];
  const msg=q?.kind==="input"?"✕ Sai — hãy thử lại":"✕ Sai — hãy chọn lại";
  const canSkip=q?.kind==="input"&&activeBank?.pilotFixedFormat&&mistakes[index]>=5;
  const skipButton=canSkip
    ? `<button class="secondary" id="skipWordformBtn" style="margin-top:10px">Bỏ qua — xem đáp án</button>`
    : "";
  return `<div class="feedback wrong"><div class="feedback-title">${msg}</div>${skipButton}</div>`;
}

function deepFeedback(index){
  const q=activeQuestions[index],d=activeExplanations[index]||{};
  // Grammar testing is intentionally excluded from Explanation Standard V1.
  if(activeMode!=="grammar"&&window.ExplanationV1){
    return ExplanationV1.render(ExplanationV1.vocab(q,d));
  }
  if(d.mode==="semantic_precision"){
    const step1=(d.step1||[]).map(p=>`<p>${esc(p)}</p>`).join("");
    const comparisons=(d.options||[]).map(opt=>`
      <div class="semantic-option ${opt.label==="ABCD"[q.a]?"correct-analysis":""}">
        <div class="semantic-option-head"><span>${esc(opt.label)}</span><b>${esc(opt.word)}</b><em>${esc(opt.meaning)}</em></div>
        <p>${esc(opt.analysis)}</p>
      </div>`).join("");
    const examples=(d.examples||[]).map(ex=>`
      <div class="semantic-example">
        <div class="semantic-example-title"><span>${esc(ex.label)}</span><b>${esc(ex.word)}</b></div>
        <p class="example-en">${esc(ex.en)}</p>
        <p class="example-vi">→ ${esc(ex.vi)}</p>
      </div>`).join("");
    const remember=d.remember?`<div class="semantic-remember"><b>Điểm cần nhớ</b><span>${esc(d.remember)}</span></div>`:"";
    return `<div class="feedback correct semantic-feedback">
      <div class="feedback-title">✓ Đúng — ${esc(correctAnswerText(q))}</div>
      <section class="semantic-step">
        <div class="semantic-step-label"><span>1</span><div><b>Dịch nghĩa + giải thích ngữ cảnh</b><small>Meaning · context · collocation · why this answer</small></div></div>
        <div class="semantic-prose">${step1}</div>
      </section>
      <section class="semantic-step">
        <div class="semantic-step-label"><span>2</span><div><b>So sánh A, B, C, D</b><small>Nuance · collocation · phạm vi nghĩa</small></div></div>
        <div class="semantic-options-grid">${comparisons}</div>
      </section>
      <section class="semantic-step">
        <div class="semantic-step-label"><span>3</span><div><b>Ví dụ thực tế cho từng đáp án</b><small>Đúng 1 ví dụ cho mỗi A–D</small></div></div>
        <div class="semantic-examples-grid">${examples}</div>
      </section>
      ${remember}
    </div>`;
  }
  if(d.mode==="context_guessing"){
    const usage=d.usage?`<div class="deep-box"><b>Cách dùng</b><span>${esc(d.usage)}</span></div>`:"";
    const nuance=d.inferenceNuance?`<div class="deep-box"><b>Sắc thái</b><span>${esc(d.inferenceNuance)}</span></div>`:"";
    return `<div class="feedback correct standard-feedback">
      <div class="feedback-title">✓ Đúng — ${esc(correctAnswerText(q))}</div>
      <div class="deep-grid">
        <div class="deep-box"><b>Nghĩa suy ra</b><span>${esc(d.meaning)}</span></div>
        <div class="deep-box"><b>Clue trong bài</b><span>${esc(d.why)}</span></div>
        ${nuance}
        ${usage}
        <div class="deep-box wide"><b>Phân biệt từ gần nghĩa</b><span>${esc(d.contrast)}</span></div>
      </div>
    </div>`;
  }
  if(activeBank?.explanationFormatV2){
    const translationBox=d.translation
      ? `<div class="deep-box wide"><b>Dịch câu</b><span>${esc(d.translation)}</span></div>`
      : "";
    const usageBox=d.usage
      ? `<div class="deep-box wide"><b>Collocation</b><span>${esc(d.usage)}</span></div>`
      : "";
    const contrastTitle=q?.kind==="mcq"?"Phân biệt với 3 đáp án còn lại":"Phân biệt";
    return `<div class="feedback correct standard-feedback">
      <div class="feedback-title">${skipped[index]?"↷ Đã bỏ qua — đáp án: ":"✓ Đúng — "}${esc(correctAnswerText(q))}</div>
      <div class="deep-grid">
        <div class="deep-box wide"><b>Nghĩa & sắc thái</b><span>${esc(d.meaning)}</span></div>
        ${translationBox}
        ${usageBox}
        <div class="deep-box wide"><b>${contrastTitle}</b><span>${esc(d.contrast||"")}</span></div>
      </div>
    </div>`;
  }

  const familyRow=d.family
    ? `<div class="word-family-row"><b>Word family</b><span>${esc(d.family)}</span></div>`
    : "";
  const translationRow=d.translation
    ? `<div class="sentence-translation"><strong>Dịch câu</strong> ${esc(d.translation)}</div>`
    : "";
  const usageBox=(d.usage||d.family)
    ? `<div class="deep-box"><b>Cách dùng / collocation</b><span>${esc(d.usage||"")}</span>${familyRow}</div>`
    : "";
  return `<div class="feedback correct standard-feedback">
    <div class="feedback-title">${skipped[index]?"↷ Đã bỏ qua — đáp án: ":"✓ Đúng — "}${esc(correctAnswerText(q))}</div>
    <div class="deep-grid">
      <div class="deep-box"><b>Nghĩa & sắc thái</b><span>${esc(d.meaning)}</span>${translationRow}</div>
      <div class="deep-box"><b>Vì sao đúng trong câu</b><span>${esc(d.why)}</span></div>
      ${usageBox}
      <div class="deep-box wide"><b>Phân biệt từ dễ nhầm</b><span>${esc(d.contrast)}</span></div>
    </div>
  </div>`;
}
function move(step){
  const n=current+step;
  if(n<0||n>=activeQuestions.length)return;
  if(step>0&&!solved[current])return;
  current=n;renderQuestion();window.scrollTo({top:0,behavior:"smooth"});
}

async function submitLearningScore(firstTry,totalMistakes,totalQuestions,submissionId){
  if(activeMode==="grammar")return;
  if(scoreSubmitted||!currentNickname||!quizStartedAt)return;
  scoreSubmitted=true;
  const duration=Math.max(1,Math.round((Date.now()-quizStartedAt)/1000));
  try{
    const session=await ensureLearnerSession();
    if(!session?.user?.id||!session?.access_token)throw new Error("Learner session unavailable");
    const payload={user_id:session.user.id,nickname:currentNickname,grade:activeGrade,unit_no:activeUnit,set_no:activeSet,difficulty:activeLevel.name,practice_submission_id:submissionId,first_try_correct:firstTry,total_questions:totalQuestions,mistakes:totalMistakes,duration_seconds:Math.min(duration,7200)};
    const res=await fetch(SUPABASE_URL+"/rest/v1/scores?on_conflict=practice_submission_id",{method:"POST",keepalive:true,headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json","Prefer":"resolution=ignore-duplicates,return=minimal"},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error("Score submit failed");
    toast("Đã ghi nhận bài hoàn thành vào tài khoản");
  }catch(err){
    scoreSubmitted=false;
    console.error(err);
    toast("Chưa ghi nhận được lượt học — kết quả trên máy vẫn giữ nguyên");
  }
}

function finishLearning(){
  if(quizFinished)return;
  const mastered=solved.filter(Boolean).length;
  if(mastered<activeQuestions.length)return;
  quizFinished=true;
  LearningCore.clearDraft("quiz",quizAttemptIdentity());
  const totalMistakes=mistakes.reduce((a,b)=>a+b,0);
  const firstTry=mistakes.filter(x=>x===0).length;
  const pct=Math.round(firstTry/activeQuestions.length*100);
  if(activeMode!=="grammar"&&activeBank?.trackSetCompletion)markSetCompleted(activeGrade,activeUnit,activeSet);
  hideAll();resultScreen.style.display="block";
  const resultCrumbs=resultScreen.querySelector(".breadcrumbs");
  const backUnitBtn=document.getElementById("backUnitBtn");
  if(activeMode==="grammar"){
    if(resultCrumbs) resultCrumbs.innerHTML=`<button class="crumb-btn" onclick="goAreaHome()">Home</button><span>›</span><button class="crumb-btn" onclick="goGrammar()">Grammar</button><span>›</span><button class="crumb-btn" onclick="goGrammarUnit('${esc(activeGrammarSlug)}')">${esc(activeBank.title)}</button><span>›</span><span>Set ${activeSet} Result</span>`;
    if(backUnitBtn){
      backUnitBtn.textContent="Back to "+activeBank.title;
      backUnitBtn.onclick=()=>goGrammarUnit(activeGrammarSlug);
    }
  }else{
    if(resultCrumbs) resultCrumbs.innerHTML=`<button class="crumb-btn" onclick="goAreaHome()">Home</button><span>›</span><button class="crumb-btn" onclick="goGrade(${activeGrade})">Lớp ${activeGrade}</button><span>›</span><button class="crumb-btn" onclick="goUnit(${activeUnit},${activeGrade})">${esc(currentUnitLabel())}</button><span>›</span><span>Set ${activeSet} Result</span>`;
    if(backUnitBtn){
      backUnitBtn.textContent=activeBank?.reviewMode?"Back to Ôn lại cơ bản":"Back to Unit "+activeUnit;
      backUnitBtn.onclick=()=>goUnit(activeUnit,activeGrade);
    }
  }
  LearningFlow.track({category:activeMode==="grammar"?"grammar":"vocabulary",
    slug:quizAttemptIdentity(),ownerId:LearningCore.userId(),started:true,
    startedAt:quizStartedAt,done:mastered,total:activeQuestions.length,completed:true,mode:"mastery"});
  LearningFlow.paint(document.getElementById("quizResultFlowStatus"),{
    started:true,done:mastered,total:activeQuestions.length,completed:true,mode:"mastery"});
  document.getElementById("scoreBig").textContent=pct+"%";
  document.getElementById("scoreFraction").textContent="first-try accuracy";
  document.getElementById("correctStat").textContent=mastered;
  document.getElementById("wrongStat").textContent=totalMistakes;
  document.getElementById("answeredStat").textContent=firstTry;
  document.getElementById("scoreRing").style.background=`conic-gradient(var(--accent) ${pct*3.6}deg,rgba(190,24,93,.10) 0deg)`;
  document.getElementById("resultTitle").textContent=totalMistakes===0?"Excellent — all first try.":totalMistakes<=8?"Strong vocabulary control.":"Review the tricky contrasts below.";
  buildReview();
  const completedSubmissionId=LearningCore.uuid();
  if(activeMode!=="grammar")submitLearningScore(firstTry,totalMistakes,activeQuestions.length,completedSubmissionId);
  LearningCore.submitPractice({
    category:activeMode==="grammar"?"grammar":"vocabulary",slug:quizAttemptIdentity(),
    correct:firstTry,total:activeQuestions.length,
    duration:Math.max(0,Math.round((Date.now()-quizStartedAt)/1000)),
    submissionId:completedSubmissionId,details:{mistakes:totalMistakes,firstTryAccuracy:pct}
  }).catch(err=>{console.error("Unified result save failed",err);toast("Chưa đồng bộ được kết quả bổ sung")});
  if(pct>=75)confetti();
  window.scrollTo({top:0,behavior:"smooth"});
}

function buildReview(){
  const list=document.getElementById("reviewList");
  list.innerHTML=activeQuestions.map((q,i)=>{
    const d=activeExplanations[i];
    const right=esc(correctAnswerText(q));
    const attemptLabel=skipped[i]
      ? `Skipped after ${mistakes[i]} mistakes`
      : (mistakes[i]===0?"Correct on first try":`${mistakes[i]} mistake${mistakes[i]>1?"s":""} before correct`);
    const reviewExplain=d?.mode==="semantic_precision"
      ? `<div class="explain"><b>Tóm tắt:</b> ${esc(d.step1?.[0]||"")}<br><br><b>Điểm cần nhớ:</b> ${esc(d.remember||"")}</div>`
      : `<div class="explain"><b>Nghĩa:</b> ${esc(d.meaning)}<br><br><b>Phân biệt:</b> ${esc(d.contrast)}</div>`;
    return `<div class="review-item correct">
      <div class="review-q">${i+1}. ${esc(q.q)}</div>
      <div class="review-meta"><span class="tag good">Correct: ${right}</span><span class="tag">${attemptLabel}</span></div>
      ${reviewExplain}
    </div>`;
  }).join("");
}

function confetti(){
  const h=document.getElementById("confetti");h.innerHTML="";
  for(let i=0;i<80;i++){const e=document.createElement("i");e.style.left=Math.random()*100+"vw";e.style.setProperty("--x",(Math.random()*220-110)+"px");e.style.setProperty("--t",(2.6+Math.random()*2)+"s");e.style.setProperty("--h",Math.floor(Math.random()*360));e.style.animationDelay=Math.random()*.6+"s";h.appendChild(e)}
  setTimeout(()=>h.innerHTML="",5200);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove("show"),2200)}
document.addEventListener("keydown",e=>{
  if(quizShell.style.display!=="block"||e.key!=="Enter")return;
  const target=e.target;
  if(target instanceof HTMLInputElement||target instanceof HTMLTextAreaElement||target?.isContentEditable)return;
  if(!solved[current])return;
  e.preventDefault();
  if(current<activeQuestions.length-1)move(1);
  else finishLearning();
});
// One manifest registers every published page; no duplicated route declarations.
function renderManifestItem(item){
  if(item.kind==="grade"){renderGrade(item.grade);return}
  if(item.kind==="handler"){
    const handler=window[item.handler];
    if(typeof handler==="function"){handler(...(item.args||[]));return}
    const requested=item.route;
    pageMount.style.display="block";
    pageMount.innerHTML='<div class="empty"><b>Đang tải nội dung bài học…</b>Vui lòng chờ trong giây lát.</div>';
    ContentManifest.ensureHandler(item).then(fn=>{
      if(location.hash.slice(1)===requested)fn(...(item.args||[]));
    }).catch(err=>{
      if(location.hash.slice(1)!==requested)return;
      console.error("Content Manifest renderer load failed",err);
      pageMount.innerHTML='<div class="empty"><b>Không tải được bài học</b>'+esc(err.message||String(err))+'</div>';
    });
    return;
  }
  if(item.kind==="vocabulary-unit"||item.kind==="vocabulary-set"||
     item.kind==="grammar-unit"||item.kind==="grammar-set"){
    const requested=item.route;
    const isGrammar=item.kind.startsWith("grammar");
    const key=item.grade+"-"+item.unit;
    if((isGrammar&&!window.GRAMMAR_BANKS?.[item.slug])||(!isGrammar&&!BANKS[key])){
      pageMount.style.display="block";
      pageMount.innerHTML='<div class="empty"><b>Đang tải nội dung bài học…</b>Vui lòng chờ trong giây lát.</div>';
    }
    ContentManifest.ensureBank(item).then(bank=>{
      if(location.hash.slice(1)!==requested)return;
      if(!isGrammar){BANKS[key]=bank;prepareManifestBank(bank)}
      if(item.kind==="vocabulary-unit")renderUnit(item.grade,item.unit);
      else if(item.kind==="vocabulary-set")renderExercise(item.grade,item.unit,item.setNo);
      else if(item.kind==="grammar-unit")renderGrammarUnit(item.slug);
      else renderGrammarExercise(item.slug,item.setNo);
    }).catch(err=>{
      if(location.hash.slice(1)!==requested)return;
      console.error("Content Manifest loading error",err);
      pageMount.style.display="block";
      pageMount.innerHTML='<div class="empty"><b>Không tải được bài học</b>'+esc(err.message||String(err))+'</div>';
    });
    return;
  }
  throw new Error("Unsupported page in Content Manifest: "+item.id);
}
ContentManifest.entries.forEach(item=>LearningCore.register({...item,render:()=>renderManifestItem(item)}));

route();
</script>
