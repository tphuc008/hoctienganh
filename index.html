function initQuizState(){
  current=0;
  answers=Array(activeQuestions.length).fill(null);
  solved=Array(activeQuestions.length).fill(false);
  mistakes=Array(activeQuestions.length).fill(0);
  wrongChoices=Array.from({length:activeQuestions.length},()=>new Set());
  skipped=Array(activeQuestions.length).fill(false);
  quizStartedAt=Date.now();
  scoreSubmitted=false;
  readingScrollTop=0;
  readingQuestionScrollTop=0;
  readingContextText="";
}
function readNickname(){
  const nicknameInput=document.getElementById("nicknameInput");
  const nickname=(nicknameInput?nicknameInput.value:currentNickname).trim().replace(/\s+/g," ");
  if(nickname.length<2){toast("Nhập nickname ít nhất 2 ký tự");return false}
  currentNickname=nickname.slice(0,24);
  localStorage.setItem("vocabNickname",currentNickname);
  return true;
}
function showQuizShell(){
  hideAll();
  document.getElementById("exitQuizBtn").textContent=activeLevel?.contextGuessing
    ? "← Unit "+activeUnit+" · Context Guessing"
    : "← Unit "+activeUnit+" · Set "+activeSet;
  quizShell.style.display="block";
  renderQuestion();
  window.scrollTo({top:0,behavior:"smooth"});
}
function startContextGuessing(levelKey,fromRetry=false){
  const cfg=activeLevelConfig[activeSet];
  const sub=cfg?.levels?.[levelKey];
  if(!cfg?.contextGuessing||!sub)return;
  if(!fromRetry&&!readNickname())return;
  if(fromRetry&&currentNickname.length<2){goUnit(activeUnit,activeGrade);return}
  activeLevel=cfg;
  activeSublevelKey=levelKey;
  activeQuestionIndices=[...(sub.pool||[])];
  activeQuestions=activeQuestionIndices.map(i=>shuffleQuestionOptions(activeBank.questions[i]));
  activeExplanations=activeQuestions.map((q,pos)=>activeBank?.explanationById?.[q.id]||activeBank.explanations[activeQuestionIndices[pos]]||{});
  initQuizState();
  showQuizShell();
}

function startQuiz(reset=false){
  if(reset&&activeLevel?.contextGuessing&&activeSublevelKey){
    startContextGuessing(activeSublevelKey,true);
    return;
  }
  if(reset){
    if(!readNickname())return;
    selectSet(activeSet);
    initQuizState();
  }
  showQuizShell();
}

function correctAnswerText(q){
  if(q?.kind==="input")return q.answers?.[0]||q.answer||"";
  return Array.isArray(q?.o)&&Number.isInteger(q?.a)?`${"ABCD"[q.a]}. ${q.o[q.a]}`:"";
}
function normalizeQuizInput(value){
  return String(value??"").toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:]+$/g,"").replace(/\s+/g," ").trim();
}
function readingPassageHTML(q){
  let plain=String(q?.context||"").replace(/\*\*/g,"");
  let html=esc(plain).replace(/\n/g,"<br>");
  const focus=String(q?.focus||"").replace(/\*\*/g,"");
  if(focus){
    const token=esc(focus);
    const pos=html.indexOf(token);
    if(pos>=0)html=html.slice(0,pos)+'<span class="reading-focus">'+token+'</span>'+html.slice(pos+token.length);
  }
  return html;
}
function renderQuestion(){
  const q=activeQuestions[current],isSolved=solved[current];
  const solvedCount=solved.filter(Boolean).length;
  progress.style.width=((current+1)/activeQuestions.length*100)+"%";
  counter.textContent=`${current+1} / ${activeQuestions.length}`;
  if(q.context!==readingContextText){
    readingContextText=q.context||"";
    readingScrollTop=0;
    readingQuestionScrollTop=0;
  }
  const feedback=isSolved ? deepFeedback(current) : (wrongChoices[current].size ? wrongFeedback(current) : "");
  const answerBlock=q.kind==="input"
    ? `<div class="wordform-wrap">
        <input class="wordform-input" id="wordformInput" type="text" autocomplete="off" spellcheck="false"
          placeholder="Type your answer" ${isSolved?"disabled":""} value="${isSolved?esc(correctAnswerText(q)):""}">
        <button class="primary" id="wordformSubmit" ${isSolved?"disabled":""}>Check</button>
      </div>`
    : `<div class="answers">
        ${q.o.map((opt,i)=>{
          const isCorrect=isSolved&&i===q.a;
          const wasWrong=wrongChoices[current].has(i);
          return `<button class="answer ${isCorrect?"correct":wasWrong?"wrong-choice":""}" data-i="${i}" ${isSolved||wasWrong?"disabled":""}>
            <span class="letter">${"ABCD"[i]}</span><span>${esc(opt)}</span>
          </button>`
        }).join("")}
      </div>`;
  const navBlock=`
      <div class="nav ${q.type==="context_guessing"?"context-nav":""}">
        <button class="secondary" id="prevBtn" ${current===0?"disabled":""}>← Previous</button>
        ${isSolved
          ? (current===activeQuestions.length-1
              ? '<button class="primary" id="finishBtn">Finish ✓</button>'
              : '<button class="primary" id="nextBtn">Next →</button>')
          : '<span class="next-lock">Trả lời đúng để tiếp tục →</span>'}
      </div>`;
  const isReading=!!q.context&&(q.type==="reading"||q.type==="context_guessing")&&activeBank?.pilotFixedFormat;
  if(isReading){
    const paneLabel=q.type==="context_guessing"
      ? "CONTEXT GUESSING · "+(activeLevel?.levels?.[activeSublevelKey]?.label||"")
      : "READING / CLOZE";
    qMount.innerHTML=`
      <div class="question-card reading-card">
        <div class="reading-layout ${q.type==="context_guessing"?"context-reading-layout":""}">
          <section class="reading-pane" id="readingPane">
            <div class="reading-pane-head"><b>Reading passage</b><span>${esc(paneLabel)}</span></div>
            <div class="reading-text">${readingPassageHTML(q)}</div>
          </section>
          <section class="reading-question-pane" id="readingQuestionPane">
            <div class="kicker"><span class="qnum">QUESTION ${String(current+1).padStart(2,"0")}</span><span>${solvedCount} mastered</span></div>
            <h2 class="question">${esc(q.q)}</h2>
            ${answerBlock}
            ${q.type==="context_guessing"?navBlock:""}
            <div id="feedbackMount">${feedback}</div>
            ${q.type==="context_guessing"?"":navBlock}
          </section>
        </div>
      </div>`;
    const pane=document.getElementById("readingPane");
    if(pane){
      pane.scrollTop=readingScrollTop;
      pane.addEventListener("scroll",()=>{readingScrollTop=pane.scrollTop},{passive:true});
    }
    const questionPane=document.getElementById("readingQuestionPane");
    if(questionPane){
      questionPane.scrollTop=readingQuestionScrollTop;
      questionPane.addEventListener("scroll",()=>{readingQuestionScrollTop=questionPane.scrollTop},{passive:true});
    }
  }else{
    const legacyContext=q.context?`<div class="reading-passage">${esc(q.context).replace(/\n/g,"<br>")}</div>`:"";
    qMount.innerHTML=`
      <div class="question-card">
        <div class="kicker"><span class="qnum">QUESTION ${String(current+1).padStart(2,"0")}</span><span>${solvedCount} mastered</span></div>
        ${legacyContext}
        <h2 class="question">${esc(q.q)}</h2>
        ${answerBlock}
        <div id="feedbackMount">${feedback}</div>
        ${navBlock}
      </div>`;
  }

  qMount.querySelectorAll(".answer:not(:disabled)").forEach(btn=>btn.onclick=()=>checkAnswer(Number(btn.dataset.i)));
  const input=document.getElementById("wordformInput");
  const submit=document.getElementById("wordformSubmit");
  const skipBtn=document.getElementById("skipWordformBtn");
  if(skipBtn)skipBtn.onclick=skipWordformQuestion;
  if(input&&!isSolved){
    if(submit)submit.onclick=()=>checkInputAnswer(input.value);
    input.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();checkInputAnswer(input.value)}});
    setTimeout(()=>input.focus(),0);
  }
  const p=document.getElementById("prevBtn"); if(p)p.onclick=()=>move(-1);
  const n=document.getElementById("nextBtn"); if(n)n.onclick=()=>move(1);
  const finish=document.getElementById("finishBtn"); if(finish)finish.onclick=finishLearning;
}

function checkInputAnswer(value){
  const q=activeQuestions[current];
  if(!q||q.kind!=="input"||solved[current])return;

  const entered=normalizeQuizInput(value);
  if(!entered)return;

  const accepted=(q.answers||[q.answer]).filter(Boolean).map(normalizeQuizInput);
  if(accepted.includes(entered)){
    answers[current]=value.trim();
    solved[current]=true;
    recordVocabProgress(q,mistakes[current]);
    renderQuestion();
    const panel=document.querySelector(".feedback.correct");
    if(panel)panel.scrollIntoView({behavior:"smooth",block:"nearest"});
    return;
  }

  mistakes[current]++;
  wrongChoices[current].add(entered);
  renderQuestion();
  const input=document.getElementById("wordformInput");
  if(input){
    input.value=value;
    input.focus();
    input.select();
  }
  const panel=document.querySelector(".feedback.wrong");
  if(panel)panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function skipWordformQuestion(){
  const q=activeQuestions[current];
  if(!q||q.kind!=="input"||solved[current]||!activeBank?.pilotFixedFormat||mistakes[current]<5)return;

  skipped[current]=true;
  answers[current]=correctAnswerText(q);
  solved[current]=true;
  recordVocabProgress(q,mistakes[current]);
  renderQuestion();

  const panel=document.querySelector(".feedback.correct");
  if(panel)panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function checkAnswer(i){
  const q=activeQuestions[current];
  if(solved[current])return;
  if(i===q.a){
    answers[current]=i;
    solved[current]=true;
    recordVocabProgress(q,mistakes[current]);
    renderQuestion();
    const panel=document.querySelector(".feedback.correct");
    if(panel)panel.scrollIntoView({behavior:"smooth",block:"nearest"});
    return;
  }
  mistakes[current]++;
  wrongChoices[current].add(i);
  renderQuestion();
  const panel=document.querySelector(".feedback.wrong");
  if(panel)panel.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function wrongFeedback(index){
  const q=activeQuestions[index];
  const msg=q?.kind==="input"?"✕ Sai — hãy thử lại":"✕ Sai — hãy chọn lại";
  const canSkip=q?.kind==="input"&&activeBank?.pilotFixedFormat&&mistakes[index]>=5;
  const skipButton=canSkip
    ? `<button class="secondary" id="skipWordformBtn" style="margin-top:10px">Bỏ qua — xem đáp án</button>`
    : "";
  return `<div class="feedback wrong"><div class="feedback-title">${msg}</div>${skipButton}</div>`;
}

function deepFeedback(index){
  const q=activeQuestions[index],d=activeExplanations[index]||{};
  if(d.mode==="context_guessing"){
    const usage=d.usage?`<div class="deep-box"><b>Cách dùng</b><span>${esc(d.usage)}</span></div>`:"";
    const nuance=d.inferenceNuance?`<div class="deep-box"><b>Sắc thái</b><span>${esc(d.inferenceNuance)}</span></div>`:"";
    return `<div class="feedback correct standard-feedback">
      <div class="feedback-title">✓ Đúng — ${esc(correctAnswerText(q))}</div>
      <div class="deep-grid">
        <div class="deep-box"><b>Nghĩa suy ra</b><span>${esc(d.meaning)}</span></div>
        <div class="deep-box"><b>Clue trong bài</b><span>${esc(d.why)}</span></div>
        ${nuance}
        ${usage}
        <div class="deep-box wide"><b>Phân biệt từ gần nghĩa</b><span>${esc(d.contrast)}</span></div>
      </div>
    </div>`;
  }
  const familyRow=d.family
    ? `<div class="word-family-row"><b>Word family</b><span>${esc(d.family)}</span></div>`
    : "";
  const translationRow=d.translation
    ? `<div class="sentence-translation"><strong>Dịch câu</strong> ${esc(d.translation)}</div>`
    : "";
  const usageBox=(d.usage||d.family)
    ? `<div class="deep-box"><b>Cách dùng / collocation</b><span>${esc(d.usage||"")}</span>${familyRow}</div>`
    : "";
  return `<div class="feedback correct standard-feedback">
    <div class="feedback-title">${skipped[index]?"↷ Đã bỏ qua — đáp án: ":"✓ Đúng — "}${esc(correctAnswerText(q))}</div>
    <div class="deep-grid">
      <div class="deep-box"><b>Nghĩa & sắc thái</b><span>${esc(d.meaning)}</span>${translationRow}</div>
      <div class="deep-box"><b>Vì sao đúng trong câu</b><span>${esc(d.why)}</span></div>
      ${usageBox}
      <div class="deep-box wide"><b>Phân biệt từ dễ nhầm</b><span>${esc(d.contrast)}</span></div>
    </div>
  </div>`;
}
function move(step){
  const n=current+step;
  if(n<0||n>=activeQuestions.length)return;
  if(step>0&&!solved[current])return;
  current=n;renderQuestion();window.scrollTo({top:0,behavior:"smooth"});
}

async function submitLeaderboardScore(firstTry,totalMistakes,totalQuestions){
  if(scoreSubmitted||!currentNickname||!quizStartedAt)return;
  scoreSubmitted=true;
  const duration=Math.max(1,Math.round((Date.now()-quizStartedAt)/1000));
  const payload={nickname:currentNickname,grade:activeGrade,unit_no:activeUnit,set_no:activeSet,difficulty:activeLevel.name,first_try_correct:firstTry,total_questions:totalQuestions,mistakes:totalMistakes,duration_seconds:Math.min(duration,7200)};
  try{
    const res=await fetch(SUPABASE_URL+"/rest/v1/scores",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error("Score submit failed");
    toast("Đã ghi nhận bài hoàn thành");
  }catch(err){
    scoreSubmitted=false;
    console.error(err);
    toast("Chưa ghi nhận được lượt học — kết quả trên máy vẫn giữ nguyên");
  }
}

async function loadDiligenceLeaderboard(grade){
  const mount=document.getElementById("diligenceMount");
  if(!mount)return;
  mount.innerHTML='<div class="diligence-empty">Loading…</div>';
  const safeGrade=Math.min(12,Math.max(9,Number(grade)||12));
  const query="?select=nickname,completed_quizzes,current_streak,active_days,questions_practiced&grade=eq."+safeGrade+"&order=completed_quizzes.desc,current_streak.desc,active_days.desc,questions_practiced.desc&limit=5";
  try{
    const res=await fetch(SUPABASE_URL+"/rest/v1/diligence_leaderboard_by_grade"+query,{
      headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY}
    });
    if(!res.ok)throw new Error("Diligence leaderboard fetch failed");
    const rows=await res.json();
    if(!rows.length){
      mount.innerHTML='<div class="diligence-empty">Chưa có lượt hoàn thành.</div>';
      return;
    }
    const medals=["🥇","🥈","🥉"];
    mount.innerHTML=rows.map((r,i)=>`
      <div class="diligence-row">
        <div class="diligence-rank">${medals[i]||i+1}</div>
        <div class="diligence-name">${esc(r.nickname)}</div>
        <div class="diligence-stats"><b>${r.completed_quizzes} bài</b>🔥 ${r.current_streak} ngày</div>
      </div>`).join("");
  }catch(err){
    console.error(err);
    mount.innerHTML='<div class="diligence-empty">Không tải được BXH.</div>';
  }
}

function finishLearning(){
  const mastered=solved.filter(Boolean).length;
  if(mastered<activeQuestions.length)return;
  const totalMistakes=mistakes.reduce((a,b)=>a+b,0);
  const firstTry=mistakes.filter(x=>x===0).length;
  const pct=Math.round(firstTry/activeQuestions.length*100);
  hideAll();resultScreen.style.display="block";
  const resultCrumbs=resultScreen.querySelector(".breadcrumbs");
  if(resultCrumbs) resultCrumbs.innerHTML=`<button class="crumb-btn" onclick="goAreaHome()">Home</button><span>›</span><button class="crumb-btn" onclick="goGrade(${activeGrade})">Lớp ${activeGrade}</button><span>›</span><button class="crumb-btn" onclick="goUnit(${activeUnit},${activeGrade})">Unit ${activeUnit}</button><span>›</span><span>Set ${activeSet} Result</span>`;
  const backUnitBtn=document.getElementById("backUnitBtn");
  if(backUnitBtn){
    backUnitBtn.textContent="Back to Unit "+activeUnit;
    backUnitBtn.onclick=()=>goUnit(activeUnit,activeGrade);
  }
  document.getElementById("scoreBig").textContent=pct+"%";
  document.getElementById("scoreFraction").textContent="first-try accuracy";
  document.getElementById("correctStat").textContent=mastered;
  document.getElementById("wrongStat").textContent=totalMistakes;
  document.getElementById("answeredStat").textContent=firstTry;
  document.getElementById("scoreRing").style.background=`conic-gradient(var(--accent2) ${pct*3.6}deg,rgba(255,255,255,.08) 0deg)`;
  document.getElementById("resultTitle").textContent=totalMistakes===0?"Excellent — all first try.":totalMistakes<=8?"Strong vocabulary control.":"Review the tricky contrasts below.";
  buildReview();
  submitLeaderboardScore(firstTry,totalMistakes,activeQuestions.length);
  if(pct>=75)confetti();
  window.scrollTo({top:0,behavior:"smooth"});
}

function buildReview(){
  const list=document.getElementById("reviewList");
  list.innerHTML=activeQuestions.map((q,i)=>{
    const d=activeExplanations[i];
    const right=esc(correctAnswerText(q));
    const attemptLabel=skipped[i]
      ? `Skipped after ${mistakes[i]} mistakes`
      : (mistakes[i]===0?"Correct on first try":`${mistakes[i]} mistake${mistakes[i]>1?"s":""} before correct`);
    return `<div class="review-item correct">
      <div class="review-q">${i+1}. ${esc(q.q)}</div>
      <div class="review-meta"><span class="tag good">Correct: ${right}</span><span class="tag">${attemptLabel}</span></div>
      <div class="explain"><b>Nghĩa:</b> ${esc(d.meaning)}<br><br><b>Phân biệt:</b> ${esc(d.contrast)}</div>
    </div>`;
  }).join("");
}

function confetti(){
  const h=document.getElementById("confetti");h.innerHTML="";
  for(let i=0;i<80;i++){const e=document.createElement("i");e.style.left=Math.random()*100+"vw";e.style.setProperty("--x",(Math.random()*220-110)+"px");e.style.setProperty("--t",(2.6+Math.random()*2)+"s");e.style.setProperty("--h",Math.floor(Math.random()*360));e.style.animationDelay=Math.random()*.6+"s";h.appendChild(e)}
  setTimeout(()=>h.innerHTML="",5200);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove("show"),2200)}
document.addEventListener("keydown",e=>{
  if(quizShell.style.display!=="block")return;
  const k=e.key.toLowerCase();if(activeQuestions[current]?.kind!=="input"&&["a","b","c","d"].includes(k)){const i=["a","b","c","d"].indexOf(k);const b=qMount.querySelector(`.answer[data-i="${i}"]`);if(b)b.click()}
  if(e.key==="ArrowRight"&&current<activeQuestions.length-1&&solved[current])move(1);
  if(e.key==="ArrowLeft"&&current>0)move(-1);
});
route();
</script>
