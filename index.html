<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>English Practice Hub</title>
<style>
:root{
  --bg:#06111f;--panel:rgba(13,25,43,.82);--soft:rgba(255,255,255,.055);
  --text:#f8fafc;--muted:#9fb0c8;--line:rgba(255,255,255,.11);
  --accent:#8b5cf6;--accent2:#22d3ee;--good:#34d399;--bad:#fb7185;
  --shadow:0 24px 80px rgba(0,0,0,.36)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 14% 14%,rgba(34,211,238,.13),transparent 28%),
    radial-gradient(circle at 88% 8%,rgba(139,92,246,.16),transparent 30%),
    radial-gradient(circle at 55% 88%,rgba(52,211,153,.07),transparent 24%),
    var(--bg);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:32px 32px;mask-image:linear-gradient(to bottom,#000,transparent 90%)
}
button{font:inherit}
a{color:inherit}
.wrap{width:min(1120px,calc(100% - 28px));margin:auto;padding:24px 0 52px;position:relative;z-index:2}
.site-header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.01em;cursor:pointer}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 34px rgba(34,211,238,.15)}
.header-note{font-size:12px;color:#d6e1ef;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:8px 11px;border-radius:999px}
.panel{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.page{padding:34px;min-height:650px;animation:fadeUp .4s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#cbd7e8}
.eyebrow:before{content:"";width:28px;height:2px;background:linear-gradient(90deg,var(--accent2),transparent)}
h1,h2,h3,p{margin-top:0}
.hero h1{font-size:clamp(40px,6vw,74px);line-height:.98;letter-spacing:-.05em;margin:18px 0}
.gradient{background:linear-gradient(90deg,#fff,#c4b5fd 48%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:17px;line-height:1.7;max-width:720px}
.section-title{margin:36px 0 16px;display:flex;align-items:end;justify-content:space-between;gap:16px}
.section-title h2{margin:0;font-size:24px}
.section-title span{color:var(--muted);font-size:13px}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.unit-card{
  position:relative;min-height:230px;padding:24px;border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  overflow:hidden;cursor:pointer;transition:.22s ease;text-align:left;color:var(--text)
}
.unit-card:hover{transform:translateY(-5px);border-color:rgba(103,232,249,.35);box-shadow:0 18px 50px rgba(0,0,0,.2)}
.unit-card:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;bottom:-80px;background:radial-gradient(circle,rgba(139,92,246,.3),transparent 66%);transition:.3s}
.unit-card:hover:after{transform:scale(1.15)}
.unit-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.unit-no{font-size:12px;font-weight:900;letter-spacing:.12em;color:#c4b5fd}
.status{font-size:11px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status.live{color:#a7f3d0;background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.2)}
.unit-card h3{font-size:29px;margin:34px 0 8px;letter-spacing:-.03em}
.unit-card p{color:var(--muted);line-height:1.5;margin:0;max-width:80%}
.unit-arrow{position:absolute;right:22px;top:50%;font-size:24px;color:#b8c6d9;transition:.2s}
.unit-card:hover .unit-arrow{transform:translateX(5px);color:#67e8f9}
.breadcrumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:22px}
.crumb-btn{border:0;background:none;color:#c9d7e8;padding:0;cursor:pointer}
.crumb-btn:hover{color:white}
.unit-hero{padding:28px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(34,211,238,.06));border-radius:22px;margin-bottom:24px}
.unit-hero h1{font-size:clamp(34px,5vw,58px);margin:12px 0 10px;letter-spacing:-.04em}
.unit-hero p{color:var(--muted);line-height:1.6;max-width:680px;margin-bottom:0}
.exercise-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.exercise-card{
  border:1px solid var(--line);background:var(--soft);border-radius:20px;padding:20px;
  cursor:pointer;transition:.2s;text-align:left;color:var(--text)
}
.exercise-card:hover{transform:translateY(-3px);border-color:rgba(167,139,250,.45);background:rgba(139,92,246,.09)}
.exercise-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(139,92,246,.13);border:1px solid rgba(167,139,250,.2);margin-bottom:28px}
.exercise-card h3{margin:0 0 8px;font-size:21px}
.exercise-card p{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:16px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;color:#c9d7e8;border:1px solid var(--line);padding:6px 8px;border-radius:999px}
.empty{padding:54px 24px;text-align:center;border:1px dashed rgba(255,255,255,.17);border-radius:22px;color:var(--muted)}
.empty b{display:block;color:white;font-size:20px;margin-bottom:8px}
.primary,.secondary{
  border-radius:14px;padding:13px 18px;font-weight:850;cursor:pointer;transition:.2s;
}
.primary{border:0;color:#06111f;background:linear-gradient(135deg,#a78bfa,#67e8f9);box-shadow:0 12px 35px rgba(103,232,249,.12)}
.primary:hover{transform:translateY(-2px);filter:brightness(1.05)}
.secondary{border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text)}
.secondary:hover{background:rgba(255,255,255,.09)}
.exercise-intro{max-width:790px;margin:50px auto;text-align:center}
.exercise-intro h1{font-size:clamp(36px,6vw,68px);line-height:1;letter-spacing:-.05em;margin:18px 0}
.exercise-intro p{color:var(--muted);line-height:1.7;font-size:16px}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:26px 0 32px}
.pill{font-size:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:8px 10px;border-radius:999px;color:#cbd8e8}
.quiz-shell{display:none}
.quiz-top{display:flex;gap:14px;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}
.progress-track{height:8px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;flex:1}
.progress{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .45s cubic-bezier(.22,1,.36,1)}
.counter{min-width:76px;text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.quiz-body{padding:30px}
.question-card{animation:slide .35s cubic-bezier(.22,1,.36,1)}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.kicker{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:18px}
.qnum{font-weight:900;color:#c4b5fd}
.question{font-size:clamp(22px,3.1vw,34px);line-height:1.35;letter-spacing:-.02em;margin-bottom:26px}
.answers{display:grid;gap:11px}
.answer{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;color:var(--text);
  background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:15px 17px;
  cursor:pointer;transition:.18s
}
.answer:hover{transform:translateY(-2px);border-color:rgba(103,232,249,.35)}
.answer.selected{border-color:#8b5cf6;background:rgba(139,92,246,.12);transform:translateX(4px)}
.letter{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);font-weight:900}
.answer.selected .letter{background:#8b5cf6;border-color:#8b5cf6}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.result{display:none;padding:30px}
.score-wrap{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:center}
.score-ring{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent2) 0deg,rgba(255,255,255,.08) 0deg)}
.score-ring:after{content:"";position:absolute;inset:14px;background:#0b1728;border-radius:50%;border:1px solid var(--line)}
.score-inner{position:relative;z-index:2;text-align:center}
.score-big{font-size:50px;font-weight:950;letter-spacing:-.05em}
.score-label{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stat{border:1px solid var(--line);background:var(--soft);border-radius:15px;padding:14px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:11px}
.review{margin-top:28px}
.review-list{display:grid;gap:10px}
.review-item{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:15px;padding:15px}
.review-item.correct{border-left:4px solid var(--good)}
.review-item.wrong{border-left:4px solid var(--bad)}
.review-q{font-weight:760;line-height:1.5}
.review-meta{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.06)}
.tag.good{color:#a7f3d0;background:rgba(52,211,153,.1)}
.tag.bad{color:#fecdd3;background:rgba(251,113,133,.11)}
.explain{font-size:13px;line-height:1.55;color:var(--muted)}
.footer{text-align:center;color:#71839b;font-size:11px;padding:15px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111c2e;border:1px solid var(--line);padding:10px 14px;border-radius:12px;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-16px;width:8px;height:15px;border-radius:3px;background:hsl(var(--h) 85% 65%);animation:fall var(--t) linear forwards}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(760deg)}}
@media(max-width:760px){
  .page{padding:23px 17px;min-height:620px}.units,.exercise-grid{grid-template-columns:1fr}
  .unit-card{min-height:200px}.header-note{display:none}.score-wrap{grid-template-columns:1fr}.score-ring{margin:auto}
  .stats{grid-template-columns:1fr}.quiz-body{padding:23px 17px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="confetti" id="confetti"></div>
<div class="wrap">
  <header class="site-header">
    <div class="brand" id="brandBtn"><div class="logo">✦</div><div>English Practice Hub</div></div>
    <div class="header-note">Grade 12 · Interactive practice</div>
  </header>

  <main class="panel">
    <section class="page" id="pageMount"></section>

    <section class="quiz-shell" id="quizShell">
      <div class="quiz-top">
        <button class="secondary" id="exitQuizBtn">← Unit 6</button>
        <div class="progress-track"><div class="progress" id="progress"></div></div>
        <div class="counter" id="counter">1 / 44</div>
      </div>
      <div class="quiz-body" id="questionMount"></div>
    </section>

    <section class="result" id="resultScreen">
      <div class="breadcrumbs"><button class="crumb-btn" onclick="goUnit(6)">Unit 6</button><span>›</span><span>Result</span></div>
      <div class="score-wrap">
        <div class="score-ring" id="scoreRing"><div class="score-inner"><div class="score-big" id="scoreBig">0%</div><div class="score-label" id="scoreFraction"></div></div></div>
        <div>
          <div class="eyebrow">Quiz complete</div>
          <h2 id="resultTitle" style="font-size:36px;margin:10px 0 8px"></h2>
          <p id="resultMessage" style="color:var(--muted);line-height:1.65"></p>
          <div class="stats">
            <div class="stat"><b id="correctStat">0</b><span>Correct</span></div>
            <div class="stat"><b id="wrongStat">0</b><span>Incorrect</span></div>
            <div class="stat"><b id="answeredStat">0</b><span>Answered</span></div>
          </div>
          <button class="primary" id="retryBtn">Try again</button>
          <button class="secondary" onclick="goUnit(6)" style="margin-left:8px">Back to Unit 6</button>
        </div>
      </div>
      <div class="review"><h3>Answer review</h3><div class="review-list" id="reviewList"></div></div>
    </section>
    <div class="footer">Static website · GitHub Pages · No login required</div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
const QUESTIONS = [{"q": "The company offers regular training courses as part of its employees’ career ________, helping them build useful skills for the future.", "o": ["retirement", "settlement", "development", "advancement"], "a": 2, "e": "Career development focuses on building skills and professional growth within a career."}, {"q": "Taking on a management position can be an important step in career ________ for an experienced employee.", "o": ["advancement", "development", "retirement", "settlement"], "a": 0, "e": "Career advancement emphasizes moving upward or gaining a higher position."}, {"q": "After working as a teacher for nearly forty years, Mr Brown is now looking forward to his ________.", "o": ["standardization", "retirement", "development", "settlement"], "a": 1, "e": "Retirement is the period when someone stops working permanently, usually because of age."}, {"q": "After several weeks of disagreement, the two sides finally reached a peaceful ________.", "o": ["companionship", "retirement", "settlement", "memorization"], "a": 2, "e": "A settlement can mean an agreement that resolves a disagreement."}, {"q": "We had finished our meal, so I asked the waiter if I could ________ the bill.", "o": ["deploy", "settle", "accompany", "retire"], "a": 1, "e": "To settle a bill means to pay it."}, {"q": "It took Mai a few weeks to ________ after moving to a completely new city.", "o": ["settle in", "industrialize", "memorize", "standardize"], "a": 0, "e": "To settle in means to become comfortable in a new place or situation."}, {"q": "After the factory closed, hundreds of local workers became ________ and had to look for new jobs.", "o": ["industrious", "companionable", "unemployable", "unemployed"], "a": 3, "e": "Unemployed describes the state of not having a job."}, {"q": "Without basic computer skills, some workers may become ________ in a labour market that increasingly depends on technology.", "o": ["unemployed", "unemployable", "companionable", "industrious"], "a": 1, "e": "Unemployable means difficult to employ because a person lacks suitable skills or qualifications."}, {"q": "A ________ statement contains information that is factually correct.", "o": ["realistic", "reliable", "truthful", "honest"], "a": 2, "e": "Truthful emphasizes that what is said is true or factually correct."}, {"q": "Jack was ________ enough to admit that he had made the mistake instead of blaming his colleague.", "o": ["truthful", "realistic", "reliable", "honest"], "a": 3, "e": "Honest emphasizes sincerity and not hiding or misrepresenting the truth."}, {"q": "The plan is ambitious, but it is still ________ because the team has enough time, money, and staff to complete it.", "o": ["theoretical", "reliable", "realistic", "truthful"], "a": 2, "e": "Realistic means practical and achievable in real-life conditions."}, {"q": "Before using information in your essay, make sure it comes from a ________ source.", "o": ["realistic", "reliable", "straightforward", "practical"], "a": 1, "e": "A reliable source can be trusted to provide accurate information."}, {"q": "This website sometimes gives incorrect information, so students consider it ________.", "o": ["inaccessible", "untruthful", "unreliable", "unfriendly"], "a": 2, "e": "Unreliable means not consistently accurate or trustworthy."}, {"q": "The course gives students ________ experience by allowing them to work on real projects rather than simply reading about them.", "o": ["theoretical", "practical", "realistic", "reliable"], "a": 1, "e": "Practical experience comes from doing real tasks, not only studying theory."}, {"q": "The first part of the course is mainly ________, while the second part allows students to apply what they have learned in real situations.", "o": ["straightforward", "practical", "theoretical", "automatic"], "a": 2, "e": "Theoretical refers to ideas and principles rather than practical application."}, {"q": "Despite living in different countries, the brothers have maintained strong ________ relationships.", "o": ["communal", "industrial", "familial", "companionable"], "a": 2, "e": "Familial means relating to a family."}, {"q": "I really enjoyed Anna’s ________ during the long train journey because we had so much to talk about.", "o": ["company", "memory", "industry", "settlement"], "a": 0, "e": "To enjoy someone’s company means to enjoy being with that person."}, {"q": "Parents are allowed to ________ their young children on the school trip.", "o": ["deploy", "befriend", "standardize", "accompany"], "a": 3, "e": "Accompany means to go somewhere with someone."}, {"q": "For many elderly people who live alone, a pet can become a valuable ________.", "o": ["retiree", "settler", "companion", "industry"], "a": 2, "e": "A companion is a person or animal that spends time with someone and provides company."}, {"q": "Although David is rather quiet, he is very ________ once you start talking to him.", "o": ["theoretical", "industrial", "companionable", "unemployed"], "a": 2, "e": "Companionable describes someone who is friendly and pleasant to spend time with."}, {"q": "The restaurant chain plans to ________ its cooking procedures so that customers receive the same quality of food at every branch.", "o": ["complicate", "industrialize", "memorize", "standardize"], "a": 3, "e": "Standardize means to make a process follow the same standard."}, {"q": "The ________ of safety procedures across all factories has helped the company reduce human error.", "o": ["memorization", "industrialization", "standardization", "accessibility"], "a": 2, "e": "Standardization is the process of making procedures consistent according to a standard."}, {"q": "The city used to depend mainly on agriculture, but rapid ________ led to the development of hundreds of factories.", "o": ["memorization", "industrialization", "standardization", "settlement"], "a": 1, "e": "Industrialization is the development of industry and factory-based production."}, {"q": "The northern part of the country contains several large ________ areas where factories and warehouses are located.", "o": ["familial", "industrious", "industrial", "communal"], "a": 2, "e": "Industrial means relating to industry or manufacturing."}, {"q": "Sarah is an extremely ________ student who always completes her assignments carefully and on time.", "o": ["industrial", "automatic", "unemployed", "industrious"], "a": 3, "e": "Industrious means hard-working."}, {"q": "Instead of simply trying to ________ every sentence, students should understand the main ideas of the text.", "o": ["deploy", "memorize", "settle", "standardize"], "a": 1, "e": "Memorize means to learn something so that you can remember it exactly."}, {"q": "Some students depend heavily on rote ________ before examinations instead of trying to understand the material.", "o": ["standardization", "development", "memorization", "reality"], "a": 2, "e": "Memorization is the process of learning something by memory."}, {"q": "To get a useful response from an AI chatbot, users should provide a clear and specific ________.", "o": ["memory", "theory", "company", "prompt"], "a": 3, "e": "A prompt is an instruction or input given to an AI system."}, {"q": "The customer thanked the company for its ________ response to her complaint.", "o": ["communal", "theoretical", "prompt", "realistic"], "a": 2, "e": "As an adjective, prompt means immediate or quick."}, {"q": "When the fire alarm went off, staff reacted ________ and helped everyone leave the building safely.", "o": ["theoretically", "realistically", "truthfully", "promptly"], "a": 3, "e": "Promptly means quickly and without unnecessary delay."}, {"q": "The sharp increase in online fraud ________ the bank to introduce stronger security measures.", "o": ["accompanied", "prompted", "deployed", "challenged"], "a": 1, "e": "Prompt somebody to do something means to cause or encourage them to take action."}, {"q": "Learning to speak confidently in front of a large audience can be ________, but it can also help students develop valuable communication skills.", "o": ["straightforward", "challenging", "automatic", "accessible"], "a": 1, "e": "Challenging means difficult in a way that can require effort and may be rewarding."}, {"q": "Introducing too many new rules at the same time may ________ the registration process rather than improve it.", "o": ["deploy", "standardize", "complicate", "befriend"], "a": 2, "e": "Complicate means to make something more difficult or complex."}, {"q": "A sudden technical problem created another ________ and delayed the event for nearly an hour.", "o": ["retirement", "accessibility", "settlement", "complication"], "a": 3, "e": "A complication is an additional problem that makes a situation more difficult."}, {"q": "The application process is fairly ________: you simply complete the form, upload your documents, and click “Submit.”", "o": ["complicated", "straightforward", "theoretical", "realistic"], "a": 1, "e": "Straightforward means clear and uncomplicated."}, {"q": "The online textbook was ________ for several hours because of a problem with the school website.", "o": ["unemployable", "unreliable", "inaccessible", "unfriendly"], "a": 2, "e": "Inaccessible means impossible or difficult to reach or use."}, {"q": "The university has improved the ________ of its website so that students with disabilities can use it more easily.", "o": ["reliability", "practicality", "accessibility", "happiness"], "a": 2, "e": "Accessibility is the quality of being easy to reach, enter, use, or understand."}, {"q": "On her first day at university, Linh quickly ________ several students in her class and began having lunch with them.", "o": ["befriended", "deployed", "retired", "standardized"], "a": 0, "e": "Befriend means to become friends with someone."}, {"q": "Residents can grow vegetables together in the ________ garden behind the apartment building.", "o": ["familial", "communal", "industrial", "companionable"], "a": 1, "e": "Communal describes something shared by a group or community."}, {"q": "The company plans to ________ a new digital system across all of its offices next month.", "o": ["memorize", "industrialize", "deploy", "standardize"], "a": 2, "e": "Deploy means to put something into use."}, {"q": "The supermarket entrance has an ________ door that opens whenever its sensor detects someone approaching.", "o": ["automated", "autonomous", "industrial", "automatic"], "a": 3, "e": "Automatic means operating by itself when triggered, according to a fixed mechanism or program."}, {"q": "The factory has introduced an ________ packaging system, so most products are now packed by machines rather than workers.", "o": ["automatic", "familial", "autonomous", "automated"], "a": 3, "e": "Automated describes a process that has been changed so machines perform tasks previously done manually."}, {"q": "Unlike a basic automatic machine, an ________ robot can analyse its surroundings and make certain decisions by itself.", "o": ["industrial", "autonomous", "automated", "automatic"], "a": 1, "e": "Autonomous means able to operate or make certain decisions independently."}, {"q": "Spending time with close friends and family can contribute greatly to a person’s overall ________.", "o": ["happiness", "accessibility", "reliability", "practicality"], "a": 0, "e": "Happiness is the state of feeling happy or satisfied."}];

const UNITS = [
  {id:1,title:"Unit 1",subtitle:"Practice collection",live:false},
  {id:2,title:"Unit 2",subtitle:"Practice collection",live:false},
  {id:3,title:"Unit 3",subtitle:"Practice collection",live:false},
  {id:4,title:"Unit 4",subtitle:"Practice collection",live:false},
  {id:5,title:"Unit 5",subtitle:"Practice collection",live:false},
  {id:6,title:"Unit 6",subtitle:"Artificial Intelligence",live:true},
  {id:7,title:"Unit 7",subtitle:"Practice collection",live:false},
  {id:8,title:"Unit 8",subtitle:"Practice collection",live:false},
  {id:9,title:"Unit 9",subtitle:"Practice collection",live:false},
  {id:10,title:"Unit 10",subtitle:"Practice collection",live:false}
];

let current=0;
let answers=Array(QUESTIONS.length).fill(null);

const pageMount=document.getElementById("pageMount");
const quizShell=document.getElementById("quizShell");
const resultScreen=document.getElementById("resultScreen");
const qMount=document.getElementById("questionMount");
const progress=document.getElementById("progress");
const counter=document.getElementById("counter");

document.getElementById("brandBtn").onclick=()=>{location.hash=""};
document.getElementById("exitQuizBtn").onclick=()=>goUnit(6);
document.getElementById("retryBtn").onclick=()=>startQuiz(true);
window.addEventListener("hashchange",route);

function hideAll(){
  pageMount.style.display="none";
  quizShell.style.display="none";
  resultScreen.style.display="none";
}

function route(){
  const hash=location.hash.replace(/^#/,"");
  hideAll();
  if(!hash){renderHome();return}
  const exercise=hash.match(/^unit-(\d+)\/vocabulary-practice-1$/);
  if(exercise){renderExercise(Number(exercise[1]));return}
  const unit=hash.match(/^unit-(\d+)$/);
  if(unit){renderUnit(Number(unit[1]));return}
  renderHome();
}

function renderHome(){
  pageMount.style.display="block";
  pageMount.innerHTML=`
    <div class="hero">
      <div class="eyebrow">English 12 practice library</div>
      <h1><span class="gradient">Choose a Unit.</span><br>Then choose your exercise.</h1>
      
    </div>
    <div class="section-title"><h2>Units</h2><span>${UNITS.length} units</span></div>
    <div class="units">
      ${UNITS.map(u=>`
        <button class="unit-card" onclick="goUnit(${u.id})">
          <div class="unit-top">
            <span class="unit-no">UNIT ${String(u.id).padStart(2,"0")}</span>
            <span class="status ${u.live?"live":""}">${u.live?"Exercises available":"Coming soon"}</span>
          </div>
          <h3>${u.title}</h3>
          <p>${u.subtitle}</p>
          <span class="unit-arrow">→</span>
        </button>
      `).join("")}
    </div>`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function goUnit(id){location.hash="unit-"+id}

function renderUnit(id){
  const unit=UNITS.find(x=>x.id===id);
  if(!unit){location.hash="";return}
  pageMount.style.display="block";
  const exerciseHTML=id===6 ? `
    <div class="section-title"><h2>Exercises</h2><span>1 exercise</span></div>
    <div class="exercise-grid">
      <button class="exercise-card" onclick="openExercise(6)">
        <div class="exercise-icon">Aa</div>
        <h3>Vocabulary Practice 1</h3>
        <p>B1–B2 multiple-choice practice using vocabulary from the Unit 6 notes.</p>
        <div class="meta"><span class="chip">44 questions</span><span class="chip">B1–B2</span><span class="chip">Multiple choice</span></div>
      </button>
    </div>` : `
    <div class="section-title"><h2>Exercises</h2><span>0 exercises</span></div>
    <div class="empty"><b>No exercises yet</b>Bài tập của Unit ${id} sẽ xuất hiện ở đây khi được thêm vào.</div>`;
  pageMount.innerHTML=`
    <div class="breadcrumbs"><button class="crumb-btn" onclick="location.hash=''">Home</button><span>›</span><span>Unit ${id}</span></div>
    <div class="unit-hero">
      <div class="eyebrow">Unit ${String(id).padStart(2,"0")}</div>
      <h1>${id===6?"Artificial Intelligence":unit.title}</h1>
      <p>${id===6?"Vocabulary and language practice for Unit 6. Choose an exercise below to begin.":"This unit is ready for future exercises. New practice sets can be added here without changing the overall website structure."}</p>
    </div>
    ${exerciseHTML}`;
  window.scrollTo({top:0,behavior:"smooth"});
}

function openExercise(id){location.hash="unit-"+id+"/vocabulary-practice-1"}

function renderExercise(id){
  if(id!==6){goUnit(id);return}
  pageMount.style.display="block";
  pageMount.innerHTML=`
    <div class="breadcrumbs">
      <button class="crumb-btn" onclick="location.hash=''">Home</button><span>›</span>
      <button class="crumb-btn" onclick="goUnit(6)">Unit 6</button><span>›</span><span>Vocabulary Practice 1</span>
    </div>
    <div class="exercise-intro">
      <div class="eyebrow">Unit 6 · Artificial Intelligence</div>
      <h1><span class="gradient">Vocabulary Practice 1</span></h1>
      <p>44 multiple-choice questions at B1–B2 level. Choose one answer for each question. You can move backward and forward before submitting.</p>
      <div class="pills"><span class="pill">44 questions</span><span class="pill">B1–B2</span><span class="pill">A–D keyboard shortcuts</span><span class="pill">Answer review</span></div>
      <button class="primary" onclick="startQuiz(true)">Start exercise →</button>
    </div>`;
}

function startQuiz(reset=false){
  if(reset){current=0;answers=Array(QUESTIONS.length).fill(null)}
  hideAll();
  quizShell.style.display="block";
  renderQuestion();
  window.scrollTo({top:0,behavior:"smooth"});
}

function renderQuestion(){
  const q=QUESTIONS[current],chosen=answers[current];
  const answered=answers.filter(v=>v!==null).length;
  progress.style.width=((current+1)/QUESTIONS.length*100)+"%";
  counter.textContent=`${current+1} / ${QUESTIONS.length}`;
  qMount.innerHTML=`
    <div class="question-card">
      <div class="kicker"><span class="qnum">QUESTION ${String(current+1).padStart(2,"0")}</span><span>${answered} answered</span></div>
      <h2 class="question">${esc(q.q)}</h2>
      <div class="answers">
        ${q.o.map((opt,i)=>`<button class="answer ${chosen===i?"selected":""}" data-i="${i}"><span class="letter">${"ABCD"[i]}</span><span>${esc(opt)}</span></button>`).join("")}
      </div>
      <div class="nav">
        <button class="secondary" id="prevBtn" ${current===0?"disabled":""}>← Previous</button>
        ${current===QUESTIONS.length-1?'<button class="primary" id="submitBtn">Submit quiz ✓</button>':'<button class="primary" id="nextBtn">Next →</button>'}
      </div>
    </div>`;
  qMount.querySelectorAll(".answer").forEach(btn=>btn.onclick=()=>{
    answers[current]=Number(btn.dataset.i);
    qMount.querySelectorAll(".answer").forEach(x=>x.classList.remove("selected"));
    btn.classList.add("selected");
  });
  const p=document.getElementById("prevBtn"); if(p)p.onclick=()=>move(-1);
  const n=document.getElementById("nextBtn"); if(n)n.onclick=()=>move(1);
  const s=document.getElementById("submitBtn"); if(s)s.onclick=submitQuiz;
}

function move(step){
  const n=current+step;if(n<0||n>=QUESTIONS.length)return;
  current=n;renderQuestion();window.scrollTo({top:0,behavior:"smooth"});
}

function submitQuiz(){
  const correct=QUESTIONS.reduce((n,q,i)=>n+(answers[i]===q.a?1:0),0);
  const pct=Math.round(correct/QUESTIONS.length*100);
  hideAll();resultScreen.style.display="block";
  document.getElementById("scoreBig").textContent=pct+"%";
  document.getElementById("scoreFraction").textContent=`${correct} / ${QUESTIONS.length} correct`;
  document.getElementById("correctStat").textContent=correct;
  document.getElementById("wrongStat").textContent=QUESTIONS.length-correct;
  document.getElementById("answeredStat").textContent=answers.filter(v=>v!==null).length;
  document.getElementById("scoreRing").style.background=`conic-gradient(var(--accent2) ${pct*3.6}deg,rgba(255,255,255,.08) 0deg)`;
  document.getElementById("resultTitle").textContent=pct>=90?"Excellent control.":pct>=75?"Strong result.":pct>=60?"Good progress.":"Keep practising.";
  document.getElementById("resultMessage").textContent=pct>=75?"Review the few missed contrasts below to make the distinctions automatic.":"Use the review below to revisit the vocabulary distinctions from the notes.";
  buildReview();if(pct>=75)confetti();
  window.scrollTo({top:0,behavior:"smooth"});
}

function buildReview(){
  const list=document.getElementById("reviewList");
  list.innerHTML=QUESTIONS.map((q,i)=>{
    const u=answers[i],ok=u===q.a;
    const user=u===null?"Not answered":`${"ABCD"[u]}. ${esc(q.o[u])}`;
    const right=`${"ABCD"[q.a]}. ${esc(q.o[q.a])}`;
    return `<div class="review-item ${ok?"correct":"wrong"}">
      <div class="review-q">${i+1}. ${esc(q.q)}</div>
      <div class="review-meta"><span class="tag ${ok?"good":"bad"}">Your answer: ${user}</span>${ok?"":`<span class="tag good">Correct: ${right}</span>`}</div>
      <div class="explain">${esc(q.e)}</div></div>`;
  }).join("");
}

function confetti(){
  const h=document.getElementById("confetti");h.innerHTML="";
  for(let i=0;i<80;i++){const e=document.createElement("i");e.style.left=Math.random()*100+"vw";e.style.setProperty("--x",(Math.random()*220-110)+"px");e.style.setProperty("--t",(2.6+Math.random()*2)+"s");e.style.setProperty("--h",Math.floor(Math.random()*360));e.style.animationDelay=Math.random()*.6+"s";h.appendChild(e)}
  setTimeout(()=>h.innerHTML="",5200);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove("show"),2200)}
document.addEventListener("keydown",e=>{
  if(quizShell.style.display!=="block")return;
  const k=e.key.toLowerCase();if(["a","b","c","d"].includes(k)){const i=["a","b","c","d"].indexOf(k);const b=qMount.querySelector(`.answer[data-i="${i}"]`);if(b)b.click()}
  if(e.key==="ArrowRight"&&current<QUESTIONS.length-1)move(1);
  if(e.key==="ArrowLeft"&&current>0)move(-1);
});
route();
</script>
</body>
</html>
