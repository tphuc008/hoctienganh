<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>English Practice Hub</title>
<style>
:root{
  --bg:#06111f;--panel:rgba(13,25,43,.82);--soft:rgba(255,255,255,.055);
  --text:#f8fafc;--muted:#9fb0c8;--line:rgba(255,255,255,.11);
  --accent:#8b5cf6;--accent2:#22d3ee;--good:#34d399;--bad:#fb7185;
  --shadow:0 24px 80px rgba(0,0,0,.36)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 14% 14%,rgba(34,211,238,.13),transparent 28%),
    radial-gradient(circle at 88% 8%,rgba(139,92,246,.16),transparent 30%),
    radial-gradient(circle at 55% 88%,rgba(52,211,153,.07),transparent 24%),
    var(--bg);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:32px 32px;mask-image:linear-gradient(to bottom,#000,transparent 90%)
}
button{font:inherit}
a{color:inherit}
.wrap{width:min(1120px,calc(100% - 28px));margin:auto;padding:24px 0 52px;position:relative;z-index:2}
.site-header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.01em;cursor:pointer}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 34px rgba(34,211,238,.15)}
.header-note{font-size:12px;color:#d6e1ef;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:8px 11px;border-radius:999px}
.panel{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.page{padding:34px;min-height:650px;animation:fadeUp .4s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#cbd7e8}
.eyebrow:before{content:"";width:28px;height:2px;background:linear-gradient(90deg,var(--accent2),transparent)}
h1,h2,h3,p{margin-top:0}
.hero h1{font-size:clamp(40px,6vw,74px);line-height:.98;letter-spacing:-.05em;margin:18px 0}
.gradient{background:linear-gradient(90deg,#fff,#c4b5fd 48%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:17px;line-height:1.7;max-width:720px}
.section-title{margin:36px 0 16px;display:flex;align-items:end;justify-content:space-between;gap:16px}
.section-title h2{margin:0;font-size:24px}
.section-title span{color:var(--muted);font-size:13px}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.unit-card{
  position:relative;min-height:230px;padding:24px;border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  overflow:hidden;cursor:pointer;transition:.22s ease;text-align:left;color:var(--text)
}
.unit-card:hover{transform:translateY(-5px);border-color:rgba(103,232,249,.35);box-shadow:0 18px 50px rgba(0,0,0,.2)}
.unit-card:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;bottom:-80px;background:radial-gradient(circle,rgba(139,92,246,.3),transparent 66%);transition:.3s}
.unit-card:hover:after{transform:scale(1.15)}
.unit-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.unit-no{font-size:12px;font-weight:900;letter-spacing:.12em;color:#c4b5fd}
.status{font-size:11px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status.live{color:#a7f3d0;background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.2)}
.unit-card h3{font-size:29px;margin:34px 0 8px;letter-spacing:-.03em}
.unit-card p{color:var(--muted);line-height:1.5;margin:0;max-width:80%}
.unit-arrow{position:absolute;right:22px;top:50%;font-size:24px;color:#b8c6d9;transition:.2s}
.unit-card:hover .unit-arrow{transform:translateX(5px);color:#67e8f9}
.breadcrumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:22px}
.crumb-btn{border:0;background:none;color:#c9d7e8;padding:0;cursor:pointer}
.crumb-btn:hover{color:white}
.unit-hero{padding:28px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(34,211,238,.06));border-radius:22px;margin-bottom:24px}
.unit-hero h1{font-size:clamp(34px,5vw,58px);margin:12px 0 10px;letter-spacing:-.04em}
.unit-hero p{color:var(--muted);line-height:1.6;max-width:680px;margin-bottom:0}
.exercise-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.exercise-card{
  border:1px solid var(--line);background:var(--soft);border-radius:20px;padding:20px;
  cursor:pointer;transition:.2s;text-align:left;color:var(--text)
}
.exercise-card:hover{transform:translateY(-3px);border-color:rgba(167,139,250,.45);background:rgba(139,92,246,.09)}
.exercise-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(139,92,246,.13);border:1px solid rgba(167,139,250,.2);margin-bottom:28px}
.exercise-card h3{margin:0 0 8px;font-size:21px}
.exercise-card p{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:16px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;color:#c9d7e8;border:1px solid var(--line);padding:6px 8px;border-radius:999px}
.empty{padding:54px 24px;text-align:center;border:1px dashed rgba(255,255,255,.17);border-radius:22px;color:var(--muted)}
.empty b{display:block;color:white;font-size:20px;margin-bottom:8px}
.primary,.secondary{
  border-radius:14px;padding:13px 18px;font-weight:850;cursor:pointer;transition:.2s;
}
.primary{border:0;color:#06111f;background:linear-gradient(135deg,#a78bfa,#67e8f9);box-shadow:0 12px 35px rgba(103,232,249,.12)}
.primary:hover{transform:translateY(-2px);filter:brightness(1.05)}
.secondary{border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text)}
.secondary:hover{background:rgba(255,255,255,.09)}
.exercise-intro{max-width:790px;margin:50px auto;text-align:center}
.exercise-intro h1{font-size:clamp(36px,6vw,68px);line-height:1;letter-spacing:-.05em;margin:18px 0}
.exercise-intro p{color:var(--muted);line-height:1.7;font-size:16px}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:26px 0 32px}
.pill{font-size:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:8px 10px;border-radius:999px;color:#cbd8e8}
.quiz-shell{display:none}
.quiz-top{display:flex;gap:14px;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}
.progress-track{height:8px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;flex:1}
.progress{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .45s cubic-bezier(.22,1,.36,1)}
.counter{min-width:76px;text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.quiz-body{padding:30px}
.question-card{animation:slide .35s cubic-bezier(.22,1,.36,1)}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.kicker{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:18px}
.qnum{font-weight:900;color:#c4b5fd}
.question{font-size:clamp(22px,3.1vw,34px);line-height:1.35;letter-spacing:-.02em;margin-bottom:26px}
.answers{display:grid;gap:11px}
.answer{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;color:var(--text);
  background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:15px 17px;
  cursor:pointer;transition:.18s
}
.answer:hover{transform:translateY(-2px);border-color:rgba(103,232,249,.35)}
.answer.selected{border-color:#8b5cf6;background:rgba(139,92,246,.12);transform:translateX(4px)}
.answer.correct{border-color:rgba(52,211,153,.78);background:rgba(52,211,153,.12);transform:translateX(4px)}
.answer.correct .letter{background:var(--good);border-color:var(--good);color:#04140f}
.answer.wrong-choice{border-color:rgba(251,113,133,.78);background:rgba(251,113,133,.11);animation:shake .28s ease}
.answer.wrong-choice .letter{background:var(--bad);border-color:var(--bad);color:#21050b}
.answer:disabled{cursor:default;opacity:.93}
.answer:disabled:hover{transform:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{margin-top:20px;border-radius:18px;padding:18px;border:1px solid var(--line);animation:fadeUp .3s ease}
.feedback.wrong{border-color:rgba(251,113,133,.3);background:rgba(251,113,133,.07)}
.feedback.correct{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.065)}
.feedback-title{font-weight:900;font-size:16px;margin-bottom:8px}
.feedback.wrong .feedback-title{color:#fecdd3}
.feedback.correct .feedback-title{color:#a7f3d0}
.feedback p{color:#cbd7e8;line-height:1.62;margin:0}
.deep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.deep-box{padding:13px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid var(--line)}
.deep-box b{display:block;color:white;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.deep-box span{display:block;color:var(--muted);font-size:13px;line-height:1.58}
.deep-box.wide{grid-column:1/-1}
.word-family-row{grid-column:1/-1;display:flex;align-items:center;gap:10px;min-width:0;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(139,92,246,.065);font-size:13px;line-height:1.45}
.word-family-row b{flex:0 0 auto;color:#ddd6fe;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.word-family-row span{min-width:0;color:#d6e1ef;overflow-wrap:anywhere}
.feedback.standard-feedback .deep-box span{font-size:13.5px;line-height:1.62;min-height:8.1em;max-width:48ch}
.feedback.standard-feedback .deep-box.wide span{max-width:72ch;min-height:7.4em}
@media(max-width:560px){.word-family-row{align-items:flex-start;flex-direction:column;gap:4px}}
.next-lock{color:var(--muted);font-size:12px;align-self:center}
.letter{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);font-weight:900}
.answer.selected .letter{background:#8b5cf6;border-color:#8b5cf6}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.result{display:none;padding:30px}
.score-wrap{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:center}
.score-ring{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent2) 0deg,rgba(255,255,255,.08) 0deg)}
.score-ring:after{content:"";position:absolute;inset:14px;background:#0b1728;border-radius:50%;border:1px solid var(--line)}
.score-inner{position:relative;z-index:2;text-align:center}
.score-big{font-size:50px;font-weight:950;letter-spacing:-.05em}
.score-label{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stat{border:1px solid var(--line);background:var(--soft);border-radius:15px;padding:14px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:11px}
.nickname-box{max-width:420px;margin:18px auto 0;text-align:left}.nickname-box label{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.nickname-box input{width:100%;box-sizing:border-box;color:var(--text);background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;font:inherit}.nickname-box input:focus{border-color:rgba(103,232,249,.55);box-shadow:0 0 0 3px rgba(103,232,249,.08)}.grade-overview{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:stretch;margin-bottom:24px}
.grade-overview .unit-hero{margin-bottom:0}
.diligence-card{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:20px;padding:16px;min-height:100%;box-sizing:border-box}
.diligence-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.diligence-head h3{font-size:16px;margin:0}
.diligence-head span{font-size:11px;color:var(--muted)}
.diligence-list{display:grid;gap:7px}
.diligence-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px 8px;border-radius:12px;background:rgba(255,255,255,.035)}
.diligence-rank{font-weight:900;text-align:center}
.diligence-name{font-weight:760;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diligence-stats{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.diligence-empty{padding:14px 4px;color:var(--muted);font-size:12px;text-align:center}
@media(max-width:900px){.grade-overview{grid-template-columns:1fr}.diligence-card{min-height:auto}}
.review{margin-top:28px}
.review-list{display:grid;gap:10px}
.review-item{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:15px;padding:15px}
.review-item.correct{border-left:4px solid var(--good)}
.review-item.wrong{border-left:4px solid var(--bad)}
.review-q{font-weight:760;line-height:1.5}
.review-meta{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.06)}
.tag.good{color:#a7f3d0;background:rgba(52,211,153,.1)}
.tag.bad{color:#fecdd3;background:rgba(251,113,133,.11)}
.explain{font-size:13px;line-height:1.55;color:var(--muted)}
.footer{text-align:center;color:#71839b;font-size:11px;padding:15px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111c2e;border:1px solid var(--line);padding:10px 14px;border-radius:12px;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-16px;width:8px;height:15px;border-radius:3px;background:hsl(var(--h) 85% 65%);animation:fall var(--t) linear forwards}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(760deg)}}
@media(max-width:760px){
  .page{padding:23px 17px;min-height:620px}.units,.exercise-grid{grid-template-columns:1fr}
  .unit-card{min-height:200px}.header-note{display:none}.score-wrap{grid-template-columns:1fr}.score-ring{margin:auto}
  .stats{grid-template-columns:1fr}.deep-grid{grid-template-columns:1fr}.quiz-body{padding:23px 17px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>
<div class="confetti" id="confetti"></div>
<div class="wrap">
  <header class="site-header">
    <div class="brand" id="brandBtn"><div class="logo">✦</div><div>English Practice Hub</div></div>
    <div class="header-note">Grades 9–12 · Interactive practice</div>
  </header>

  <main class="panel">
    <section class="page" id="pageMount"></section>

    <section class="quiz-shell" id="quizShell">
      <div class="quiz-top">
        <button class="secondary" id="exitQuizBtn">← Unit 6</button>
        <div class="progress-track"><div class="progress" id="progress"></div></div>
        <div class="counter" id="counter">1 / 20</div>
      </div>
      <div class="quiz-body" id="questionMount"></div>
    </section>

    <section class="result" id="resultScreen">
      <div class="breadcrumbs"><button class="crumb-btn" onclick="goUnit(6)">Unit 6</button><span>›</span><span>Result</span></div>
      <div class="score-wrap">
        <div class="score-ring" id="scoreRing"><div class="score-inner"><div class="score-big" id="scoreBig">0%</div><div class="score-label" id="scoreFraction"></div></div></div>
        <div>
          <div class="eyebrow">Quiz complete</div>
          <h2 id="resultTitle" style="font-size:36px;margin:10px 0 8px"></h2>
          <div class="stats">
            <div class="stat"><b id="correctStat">0</b><span>Mastered</span></div>
            <div class="stat"><b id="wrongStat">0</b><span>Total mistakes</span></div>
            <div class="stat"><b id="answeredStat">0</b><span>First-try correct</span></div>
          </div>
          <button class="primary" id="retryBtn">Try again</button>
          <button class="secondary" id="backUnitBtn" style="margin-left:8px">Back to Unit</button>
        </div>
      </div>
      <div class="review"><h3>Answer review</h3><div class="review-list" id="reviewList"></div></div>
    </section>
    
  </main>
  <div class="footer">🔥 = streak: ngày học liên tục</div>
</div>
<div class="toast" id="toast"></div>

<script src="grade9-unit2.js"></script>
<script src="grade9-unit3.js"></script>
<script src="grade9-unit4.js"></script>
<script src="grade9-unit5.js"></script>
<script src="grade10-unit3.js"></script>
<script src="grade12-units.js"></script>
<script>
const QUESTIONS = [{"q":"The company offers regular training courses as part of its employees’ career ________, helping them build useful skills for the future.","o":["retirement","settlement","development","advancement"],"a":2,"e":"Career development focuses on building skills and professional growth within a career."},{"q":"Taking on a management position can be an important step in career ________ for an experienced employee.","o":["advancement","development","retirement","settlement"],"a":0,"e":"Career advancement emphasizes moving upward or gaining a higher position."},{"q":"After working as a teacher for nearly forty years, Mr Brown is now looking forward to his ________.","o":["standardization","retirement","development","settlement"],"a":1,"e":"Retirement is the period when someone stops working permanently, usually because of age."},{"q":"After several weeks of disagreement, the two sides finally reached a peaceful ________.","o":["companionship","retirement","settlement","memorization"],"a":2,"e":"A settlement can mean an agreement that resolves a disagreement."},{"q":"We had finished our meal, so I asked the waiter if I could ________ the bill.","o":["deploy","settle","accompany","retire"],"a":1,"e":"To settle a bill means to pay it."},{"q":"It took Mai a few weeks to ________ after moving to a completely new city.","o":["settle in","industrialize","memorize","standardize"],"a":0,"e":"To settle in means to become comfortable in a new place or situation."},{"q":"After the factory closed, hundreds of local workers became ________ and had to look for new jobs.","o":["industrious","companionable","unemployable","unemployed"],"a":3,"e":"Unemployed describes the state of not having a job."},{"q":"Without basic computer skills, some workers may become ________ in a labour market that increasingly depends on technology.","o":["unemployed","unemployable","companionable","industrious"],"a":1,"e":"Unemployable means difficult to employ because a person lacks suitable skills or qualifications."},{"q":"A ________ statement contains information that is factually correct.","o":["realistic","reliable","truthful","honest"],"a":2,"e":"Truthful emphasizes that what is said is true or factually correct."},{"q":"Jack was ________ enough to admit that he had made the mistake instead of blaming his colleague.","o":["truthful","realistic","reliable","honest"],"a":3,"e":"Honest emphasizes sincerity and not hiding or misrepresenting the truth."},{"q":"The plan is ambitious, but it is still ________ because the team has enough time, money, and staff to complete it.","o":["theoretical","reliable","realistic","truthful"],"a":2,"e":"Realistic means practical and achievable in real-life conditions."},{"q":"Before using information in your essay, make sure it comes from a ________ source.","o":["realistic","reliable","straightforward","practical"],"a":1,"e":"A reliable source can be trusted to provide accurate information."},{"q":"This website sometimes gives incorrect information, so students consider it ________.","o":["inaccessible","untruthful","unreliable","unfriendly"],"a":2,"e":"Unreliable means not consistently accurate or trustworthy."},{"q":"The course gives students ________ experience by allowing them to work on real projects rather than simply reading about them.","o":["theoretical","practical","realistic","reliable"],"a":1,"e":"Practical experience comes from doing real tasks, not only studying theory."},{"q":"The first part of the course is mainly ________, while the second part allows students to apply what they have learned in real situations.","o":["straightforward","practical","theoretical","automatic"],"a":2,"e":"Theoretical refers to ideas and principles rather than practical application."},{"q":"Despite living in different countries, the brothers have maintained strong ________ relationships.","o":["communal","industrial","familial","companionable"],"a":2,"e":"Familial means relating to a family."},{"q":"I really enjoyed Anna’s ________ during the long train journey because we had so much to talk about.","o":["company","memory","industry","settlement"],"a":0,"e":"To enjoy someone’s company means to enjoy being with that person."},{"q":"Parents are allowed to ________ their young children on the school trip.","o":["deploy","befriend","standardize","accompany"],"a":3,"e":"Accompany means to go somewhere with someone."},{"q":"For many elderly people who live alone, a pet can become a valuable ________.","o":["retiree","settler","companion","industry"],"a":2,"e":"A companion is a person or animal that spends time with someone and provides company."},{"q":"Although David is rather quiet, he is very ________ once you start talking to him.","o":["theoretical","industrial","companionable","unemployed"],"a":2,"e":"Companionable describes someone who is friendly and pleasant to spend time with."},{"q":"The restaurant chain plans to ________ its cooking procedures so that customers receive the same quality of food at every branch.","o":["complicate","industrialize","memorize","standardize"],"a":3,"e":"Standardize means to make a process follow the same standard."},{"q":"The ________ of safety procedures across all factories has helped the company reduce human error.","o":["memorization","industrialization","standardization","accessibility"],"a":2,"e":"Standardization is the process of making procedures consistent according to a standard."},{"q":"The city used to depend mainly on agriculture, but rapid ________ led to the development of hundreds of factories.","o":["memorization","industrialization","standardization","settlement"],"a":1,"e":"Industrialization is the development of industry and factory-based production."},{"q":"The northern part of the country contains several large ________ areas where factories and warehouses are located.","o":["familial","industrious","industrial","communal"],"a":2,"e":"Industrial means relating to industry or manufacturing."},{"q":"Sarah is an extremely ________ student who always completes her assignments carefully and on time.","o":["industrial","automatic","unemployed","industrious"],"a":3,"e":"Industrious means hard-working."},{"q":"Instead of simply trying to ________ every sentence, students should understand the main ideas of the text.","o":["deploy","memorize","settle","standardize"],"a":1,"e":"Memorize means to learn something so that you can remember it exactly."},{"q":"Some students depend heavily on rote ________ before examinations instead of trying to understand the material.","o":["standardization","development","memorization","reality"],"a":2,"e":"Memorization is the process of learning something by memory."},{"q":"To get a useful response from an AI chatbot, users should provide a clear and specific ________.","o":["memory","theory","company","prompt"],"a":3,"e":"A prompt is an instruction or input given to an AI system."},{"q":"The customer thanked the company for its ________ response to her complaint.","o":["communal","theoretical","prompt","realistic"],"a":2,"e":"As an adjective, prompt means immediate or quick."},{"q":"When the fire alarm went off, staff reacted ________ and helped everyone leave the building safely.","o":["theoretically","realistically","truthfully","promptly"],"a":3,"e":"Promptly means quickly and without unnecessary delay."},{"q":"The sharp increase in online fraud ________ the bank to introduce stronger security measures.","o":["accompanied","prompted","deployed","challenged"],"a":1,"e":"Prompt somebody to do something means to cause or encourage them to take action."},{"q":"Learning to speak confidently in front of a large audience can be ________, but it can also help students develop valuable communication skills.","o":["straightforward","challenging","automatic","accessible"],"a":1,"e":"Challenging means difficult in a way that can require effort and may be rewarding."},{"q":"Introducing too many new rules at the same time may ________ the registration process rather than improve it.","o":["deploy","standardize","complicate","befriend"],"a":2,"e":"Complicate means to make something more difficult or complex."},{"q":"A sudden technical problem created another ________ and delayed the event for nearly an hour.","o":["retirement","accessibility","settlement","complication"],"a":3,"e":"A complication is an additional problem that makes a situation more difficult."},{"q":"The application process is fairly ________: you simply complete the form, upload your documents, and click “Submit.”","o":["complicated","straightforward","theoretical","realistic"],"a":1,"e":"Straightforward means clear and uncomplicated."},{"q":"The online textbook was ________ for several hours because of a problem with the school website.","o":["unemployable","unreliable","inaccessible","unfriendly"],"a":2,"e":"Inaccessible means impossible or difficult to reach or use."},{"q":"The university has improved the ________ of its website so that students with disabilities can use it more easily.","o":["reliability","practicality","accessibility","happiness"],"a":2,"e":"Accessibility is the quality of being easy to reach, enter, use, or understand."},{"q":"On her first day at university, Linh quickly ________ several students in her class and began having lunch with them.","o":["befriended","deployed","retired","standardized"],"a":0,"e":"Befriend means to become friends with someone."},{"q":"Residents can grow vegetables together in the ________ garden behind the apartment building.","o":["familial","communal","industrial","companionable"],"a":1,"e":"Communal describes something shared by a group or community."},{"q":"The company plans to ________ a new digital system across all of its offices next month.","o":["memorize","industrialize","deploy","standardize"],"a":2,"e":"Deploy means to put something into use."},{"q":"The supermarket entrance has an ________ door that opens whenever its sensor detects someone approaching.","o":["automated","autonomous","industrial","automatic"],"a":3,"e":"Automatic means operating by itself when triggered, according to a fixed mechanism or program."},{"q":"The factory has introduced an ________ packaging system, so most products are now packed by machines rather than workers.","o":["automatic","familial","autonomous","automated"],"a":3,"e":"Automated describes a process that has been changed so machines perform tasks previously done manually."},{"q":"Unlike a basic automatic machine, an ________ robot can analyse its surroundings and make certain decisions by itself.","o":["industrial","autonomous","automated","automatic"],"a":1,"e":"Autonomous means able to operate or make certain decisions independently."},{"q":"Spending time with close friends and family can contribute greatly to a person’s overall ________.","o":["happiness","accessibility","reliability","practicality"],"a":0,"e":"Happiness is the state of feeling happy or satisfied."},{"q":"The company’s mentoring scheme is designed mainly for long-term career ________, whereas promotions are treated separately as career advancement.","o":["development","retirement","settlement","unemployment"],"a":0,"e":"Career development focuses on building skills and professional growth over time."},{"q":"A witness may be completely ________ about what she remembers even if some details later prove inaccurate.","o":["truthful","honest","reliable","realistic"],"a":1,"e":"Honest emphasizes sincerity and not deliberately hiding or distorting what one believes to be true."},{"q":"The virtual assistant’s voice sounds remarkably ________, but that does not necessarily mean the information it gives is reliable.","o":["realistic","practical","truthful","theoretical"],"a":0,"e":"Realistic can mean closely resembling real life; reliability is a separate question about trustworthiness."},{"q":"The proposal is theoretically attractive, but managers want more ________ evidence that it will work in everyday conditions.","o":["practical","truthful","familial","automatic"],"a":0,"e":"Practical relates to real use and real-world application rather than theory alone."},{"q":"Although the care robot cannot replace human friendship, it may still provide valuable ________ to elderly people who live alone.","o":["companionship","company","settlement","industry"],"a":0,"e":"Companionship refers to the state or benefit of having someone or something as a companion."},{"q":"To reduce errors across all branches, the company decided to ________ the procedure rather than let each office create its own version.","o":["standardize","industrialize","memorize","deploy"],"a":0,"e":"To standardize means to make procedures or products follow the same standard."},{"q":"The government hopes rapid ________ will create more factory jobs, although it may also change the structure of local communities.","o":["industrialization","standardization","memorization","retirement"],"a":0,"e":"Industrialization is the process by which industry and factory production become more important in an economy."},{"q":"Her teacher’s warning ________ her to check the AI-generated references instead of submitting them immediately.","o":["prompted","accompanied","standardized","retired"],"a":0,"e":"Prompt can be a verb meaning to cause or encourage someone to take an action."},{"q":"The assignment was demanding but ________: students said it pushed them to think more deeply rather than simply frustrating them.","o":["challenging","complicated","inaccessible","automatic"],"a":0,"e":"Challenging often suggests difficulty that can be stimulating or worthwhile, not merely negative."},{"q":"Adding another approval stage would only ________ matters, especially when the current process is already difficult to follow.","o":["complicate","standardize","deploy","befriend"],"a":0,"e":"To complicate matters means to make an already difficult situation more complex."},{"q":"The instructions are not necessarily easy, but they are ________: each step is clearly explained and there are no hidden rules.","o":["straightforward","realistic","reliable","automatic"],"a":0,"e":"Straightforward emphasizes clarity and lack of unnecessary complexity, not low difficulty."},{"q":"Improving website ________ requires more than making pages attractive; users with different needs must be able to reach and use the content.","o":["accessibility","reliability","practicality","happiness"],"a":0,"e":"Accessibility is the quality of being easy to reach, use, or understand, including for users with disabilities."},{"q":"Once a sensor detects movement, the door opens according to a fixed program; it is therefore ________ rather than autonomous.","o":["automatic","automated","industrial","communal"],"a":0,"e":"Automatic describes something that responds according to a preset mechanism without independent decision-making."},{"q":"The production line was once operated manually, but it has now been fully ________ so that machines perform most routine steps.","o":["automated","automatic","autonomous","industrial"],"a":0,"e":"Automated emphasizes that a process has been changed from manual operation to machine-controlled operation."},{"q":"Unlike an automatic door, an ________ vehicle must analyse its surroundings and make decisions about how to respond.","o":["autonomous","automated","automatic","industrial"],"a":0,"e":"Autonomous describes a system capable of a degree of independent decision-making."},{"q":"After months of testing, the company is ready to ________ the new AI tool across its customer-service departments.","o":["deploy","memorize","settle","standardize"],"a":0,"e":"To deploy technology means to put it into practical use in a real setting."}];

const DEEP_EXPLANATIONS = [{"meaning":"Career development = quá trình nâng cao kỹ năng, kiến thức và kinh nghiệm nghề nghiệp. Trọng tâm là trở nên giỏi hơn trong nghề, không nhất thiết được thăng chức.","why":"Câu nhấn mạnh training courses giúp nhân viên build useful skills, nên ý chính là phát triển năng lực.","usage":"Collocations: career development, professional development, development opportunities. Word family: develop → development → developed/developing.","contrast":"Career advancement = đi lên về vị trí/chức vụ. Development có thể xảy ra dù job title không đổi."},{"meaning":"Career advancement = sự thăng tiến nghề nghiệp: lên vị trí cao hơn, có trách nhiệm hoặc quyền hạn lớn hơn.","why":"Taking on a management position là thay đổi cấp bậc, nên dùng advancement.","usage":"Collocations: career advancement, opportunities for advancement, advance in one’s career.","contrast":"Career development = phát triển năng lực; career advancement = phát triển vị trí."},{"meaning":"Retirement = việc/giai đoạn nghỉ hưu, khi một người dừng công việc nghề nghiệp lâu dài, thường do tuổi tác.","why":"Mr Brown đã làm giáo viên gần 40 năm và đang mong chờ lúc ngừng làm việc.","usage":"retire (v) → retirement (n) → retiree (n). Collocations: retirement age, early retirement.","contrast":"Development/advancement mô tả sự nghiệp đang tiếp diễn; retirement là rời khỏi công việc."},{"meaning":"Settlement trong câu này = sự dàn xếp/thỏa thuận giải quyết tranh chấp. Từ này cũng có thể nghĩa là khu định cư.","why":"Hai bên có disagreement rồi finally reached a peaceful ___ → reach a settlement.","usage":"Collocations: reach/negotiate a settlement. Word family: settle → settlement → settler.","contrast":"Companionship, retirement, memorization không mang nghĩa giải quyết bất đồng."},{"meaning":"Settle a bill = thanh toán hóa đơn. Settle ở đây có nghĩa hoàn tất một khoản phải trả.","why":"Sau khi ăn xong và gọi waiter, hành động hợp logic là thanh toán bill.","usage":"settle a bill/account/debt; settle a dispute; settle in.","contrast":"Deploy = triển khai; accompany = đi cùng; retire = nghỉ hưu."},{"meaning":"Settle in = dần quen, thoải mái và ổn định ở nơi hoặc hoàn cảnh mới.","why":"Mai vừa chuyển đến thành phố mới và cần vài tuần để thích nghi.","usage":"settle in; settle into a new job/routine.","contrast":"Settle không có in thường có thể là giải quyết hoặc thanh toán; settle in nhấn mạnh thích nghi."},{"meaning":"Unemployed = đang không có việc làm. Nó mô tả trạng thái hiện tại, không nói rằng người đó không thể tìm việc.","why":"Factory closed → workers lost their jobs → became unemployed.","usage":"become/remain unemployed; unemployment. Word family: employ → employment → unemployed.","contrast":"Unemployable = khó được tuyển vì thiếu kỹ năng/kiến thức. Một người unemployed vẫn có thể rất employable."},{"meaning":"Unemployable = khó có khả năng được tuyển vì kỹ năng/kiến thức không đáp ứng thị trường.","why":"Câu nhấn mạnh thiếu basic computer skills trong thị trường phụ thuộc công nghệ.","usage":"make somebody unemployable; potentially unemployable.","contrast":"Unemployed = hiện tại không có việc; unemployable = khả năng tìm được việc thấp."},{"meaning":"Truthful = đúng sự thật, phản ánh facts chính xác. Trọng tâm nằm ở nội dung có đúng hay không.","why":"Câu định nghĩa trực tiếp 'factually correct'.","usage":"truth → truthful → truthfully; untruthful. Collocations: truthful account/answer/statement.","contrast":"Honest nhấn mạnh sincerity/không cố lừa dối. Một người có thể honest nhưng nhớ sai fact."},{"meaning":"Honest = thành thật, không cố ý nói dối, che giấu hoặc đổ lỗi sai. Trọng tâm là ý định và phẩm chất người nói.","why":"Jack admitted his mistake thay vì blame colleague.","usage":"be honest about/with; honestly admit; honesty.","contrast":"Truthful nghiêng về độ chính xác của thông tin; honest nghiêng về sự chân thành."},{"meaning":"Realistic = thực tế, phù hợp điều kiện thật và có khả năng đạt được; cũng có thể nghĩa giống đời thực.","why":"Plan ambitious nhưng có đủ time, money, staff → vẫn achievable.","usage":"realistic goal/expectation/plan; be realistic about. real → reality → realistic.","contrast":"Reliable = đáng tin cậy; practical = thiên về ứng dụng/thực hành."},{"meaning":"Reliable = đáng tin cậy, có thể dựa vào vì thường xuyên cho kết quả đúng hoặc ổn định.","why":"Nguồn dùng cho essay cần có độ tin cậy cao.","usage":"reliable source/information/method/person. reliable → reliably → reliability.","contrast":"Realistic = thực tế/khả thi; truthful = đúng sự thật trong một phát biểu."},{"meaning":"Unreliable = không đáng tin, không ổn định hoặc hay cho thông tin/kết quả sai.","why":"Website đôi khi cung cấp incorrect information.","usage":"unreliable source/data/service; unreliability.","contrast":"Untruthful thường gợi ý không nói thật; unreliable rộng hơn và có thể do chất lượng kém."},{"meaning":"Practical = mang tính thực hành/thực tiễn, liên quan việc làm hoặc áp dụng trong tình huống thật.","why":"Students work on real projects rather than only reading.","usage":"practical experience/skills/advice/solution; practicality.","contrast":"Theoretical = thuộc lý thuyết. Practical không hoàn toàn đồng nghĩa realistic."},{"meaning":"Theoretical = thuộc lý thuyết, dựa trên ideas/principles hơn là việc thực hiện trong thực tế.","why":"First part học kiến thức, second part mới apply in real situations.","usage":"theoretical knowledge/framework/approach; theory → theoretical → theoretically.","contrast":"Practical = áp dụng/thực hành. Hai từ thường tạo thành cặp đối lập."},{"meaning":"Familial = thuộc về hoặc liên quan đến gia đình.","why":"Relationships giữa brothers là quan hệ gia đình.","usage":"familial relationships/ties/responsibilities.","contrast":"Communal = thuộc cộng đồng; companionable = dễ bầu bạn."},{"meaning":"Company trong enjoy someone’s company = sự hiện diện/sự đồng hành của ai đó, không phải 'công ty'.","why":"Người nói thích ở cùng Anna trong chuyến tàu dài.","usage":"enjoy someone’s company; keep someone company.","contrast":"Companionship là sự bầu bạn/mối quan hệ đồng hành mang tính khái quát hơn."},{"meaning":"Accompany = đi cùng, hộ tống hoặc hiện diện cùng ai đó.","why":"Parents được phép đi cùng children on the school trip.","usage":"accompany somebody to/on something. Không dùng 'accompany with somebody' khi nghĩa là đi cùng.","contrast":"Befriend = kết bạn; deploy = triển khai."},{"meaning":"Companion = người hoặc động vật đồng hành/bầu bạn với ai đó.","why":"Pet có thể giúp elderly people living alone bớt cô đơn.","usage":"travelling companion, constant companion, companion animal.","contrast":"Company = sự hiện diện; companion = bản thân người/vật đồng hành."},{"meaning":"Companionable = thân thiện, dễ trò chuyện và dễ chịu khi ở cùng.","why":"David quiet nhưng pleasant once you talk to him.","usage":"a companionable person/silence/atmosphere.","contrast":"Friendly rộng hơn; companionable nhấn mạnh cảm giác dễ chịu khi dành thời gian cùng."},{"meaning":"Standardize = tiêu chuẩn hóa, làm cho quy trình/sản phẩm tuân theo cùng một chuẩn.","why":"Chuỗi nhà hàng muốn mọi branch có cùng quality.","usage":"standardize a process/system/procedure; standardization.","contrast":"Industrialize = công nghiệp hóa; complicate = làm phức tạp."},{"meaning":"Standardization = quá trình tạo và áp dụng tiêu chuẩn chung để tăng tính nhất quán.","why":"Safety procedures across all factories được làm đồng nhất.","usage":"standardization of procedures/data/testing.","contrast":"Industrialization = phát triển công nghiệp; standardization = làm theo chuẩn chung."},{"meaning":"Industrialization = quá trình nền kinh tế/khu vực phát triển mạnh sản xuất công nghiệp và nhà máy.","why":"City chuyển từ agriculture sang hundreds of factories.","usage":"rapid industrialization; industrialize; industrial.","contrast":"Không phải standardization: một từ nói về công nghiệp hóa, một từ nói về chuẩn hóa."},{"meaning":"Industrial = thuộc công nghiệp, nhà máy hoặc sản xuất quy mô lớn.","why":"Areas chứa factories and warehouses là industrial areas.","usage":"industrial area/zone/production/development.","contrast":"Industrious nhìn giống nhưng nghĩa là chăm chỉ."},{"meaning":"Industrious = chăm chỉ, cần cù, làm việc đều đặn và nghiêm túc.","why":"Sarah luôn hoàn thành assignments carefully and on time.","usage":"an industrious student/worker; industriously.","contrast":"Industrial = thuộc công nghiệp; industrious = hard-working."},{"meaning":"Memorize = chủ động ghi nhớ để có thể nhớ/nhắc lại thông tin.","why":"Câu đối lập memorize every sentence với understand the main ideas.","usage":"memorize a poem/formula/list. memory → memorize → memorization.","contrast":"Memory là danh từ; memorization là quá trình; memorize là hành động."},{"meaning":"Memorization = quá trình học thuộc/ghi nhớ thông tin.","why":"Rote memorization là collocation phổ biến cho học thuộc máy móc.","usage":"rote memorization; memorization technique.","contrast":"Understanding và memorization khác nhau: nhớ được chưa chắc hiểu được."},{"meaning":"Prompt (noun) = câu lệnh/đầu vào hướng dẫn hệ thống AI tạo phản hồi.","why":"Muốn chatbot trả lời hữu ích cần clear and specific instruction.","usage":"write/give/refine a prompt; AI prompt; prompt engineering.","contrast":"Prompt còn là adjective = nhanh và verb = thúc đẩy. Ở đây có article 'a' nên cần noun."},{"meaning":"Prompt (adjective) = nhanh chóng, kịp thời, không trì hoãn.","why":"Cấu trúc 'a ___ response' cần adjective bổ nghĩa response.","usage":"prompt response/action/payment/attention.","contrast":"Prompt noun = câu lệnh; promptly = adverb."},{"meaning":"Promptly = một cách nhanh chóng/kịp thời; đây là adverb.","why":"Sau động từ reacted cần adverb.","usage":"respond promptly, act promptly, arrive promptly.","contrast":"Prompt là adjective/noun/verb; promptly mới là trạng từ."},{"meaning":"Prompt somebody to do something = khiến/thúc đẩy ai đó làm một hành động.","why":"Online fraud tăng khiế function explanationGloss(question,detail,answer){
  const direct=String(question?.q||"").match(/(?:means|có nghĩa|nghĩa)\s*[“"]([^”"]+)[”"]/i);
  if(direct)return direct[1].trim();
  const e=String(question?.e||"");
  let m=e.match(/=\s*([^.;]+)/);
  if(m)return m[1].trim();
  const meaning=String(detail?.meaning||"");
  m=meaning.match(/(?:=|—)\s*[“"]?([^.;”"]+)/);
  if(m)return m[1].trim();
  return "";
}

function explanationFamily(detail,answer){
  if(detail?.family&&String(detail.family).trim()&&detail.family!=="—")return String(detail.family).trim();
  const usage=String(detail?.usage||"");
  const wf=usage.match(/Word family:\s*([^.]*(?:→[^.]*)?)/i);
  if(wf&&wf[1].trim())return wf[1].trim();
  const pieces=usage.split(/\.\s+/);
  const arrow=pieces.find(x=>x.includes("→"));
  if(arrow)return arrow.replace(/^Word family:\s*/i,"").replace(/^Collocations?:\s*/i,"").trim();
  return `“${answer}” — tài liệu hiện không nêu thêm dạng word family; ghi nhớ dạng từ/cụm đang dùng trong bài.`;
}

function questionCore(text){
  return String(text||"")
    .replace(/^Choose the vocabulary item that best completes the source sentence:\s*/i,"")
    .replace(/^Choose the most precise vocabulary item from the source:\s*/i,"")
    .trim();
}

function blankInfo(text,answer){
  const core=questionCore(text);
  const m=core.match(/_{2,}/);
  if(!m)return {core,completed:core,before:"",after:""};
  const pos=m.index;
  const before=core.slice(0,pos).trim();
  const after=core.slice(pos+m[0].length).trim();
  const completed=core.slice(0,pos)+answer+core.slice(pos+m[0].length);
  const clip=(s,n=92)=>{
    const clean=s.replace(/\s+/g," ").replace(/^[“"]|[”"]$/g,"").trim();
    return clean.length<=n?clean:clean.slice(clean.length-n).trim();
  };
  const clipAfter=(s,n=92)=>{
    const clean=s.replace(/\s+/g," ").replace(/^[“"]|[”"]$/g,"").trim();
    return clean.length<=n?clean:clean.slice(0,n).trim()+"…";
  };
  return {core,completed,before:clip(before),after:clipAfter(after)};
}

function connectorClue(core,gloss){
  const because=core.match(/\bbecause\b\s+(.+)$/i);
  if(because)return `Mệnh đề sau “because” — “${because[1].trim()}” — nêu lý do trực tiếp làm rõ đặc điểm hoặc ý “${gloss}” mà chỗ trống cần diễn đạt.`;
  const semi=core.split(";");
  if(semi.length>1)return `Phần sau dấu chấm phẩy — “${semi.slice(1).join(";").trim()}” — giải thích cụ thể cho ý cần điền ở vế trước.`;
  const soThat=core.match(/\bso\b[^.?!]*\bthat\b[^.?!]*/i);
  if(soThat)return `Cấu trúc “${soThat[0].trim()}” cho thấy vế sau là kết quả trực tiếp của đặc điểm hoặc hành động được chọn ở chỗ trống.`;
  if(/\binstead of\b/i.test(core))return "Cụm “instead of” tạo thế đối chiếu ngay trong câu, nên đáp án phải phù hợp với hành động hoặc ý được đặt đối lập ở hai vế.";
  if(/\brather than\b/i.test(core))return "Cụm “rather than” đặt hai khả năng trong thế đối chiếu; đáp án đúng phải khớp với hành động hoặc đặc điểm mà câu ưu tiên ở vế còn lại.";
  return "";
}

function grade9StandardExplanation(bank,question,detail){
  const answer=question.o[question.a];
  const gloss=explanationGloss(question,detail,answer);
  const direct=/Which English word or phrase means|có nghĩa/i.test(question.q);
  const info=blankInfo(question.q,answer);

  const meaningBase=String(detail.meaning||question.e||`${answer} = ${gloss}`).trim();
  const meaning=meaningBase+

  }else{
    const left=info.before?`Phần ngay trước chỗ trống là “${info.before}”. `:"";
    const right=info.after?`Phần ngay sau chỗ trống là “${info.after}”. `:"";
    const connector=connectorClue(info.core,gloss);

  }

  const contrastBase=String(detail.contrast||"").trim();
  const contrast=contrastBase+
    ` Trong câu này, ý cần giữ là “${gloss||answer}”. Nếu thay “${answer}” bằng một lựa chọn có nghĩa khác ở trên, câu sẽ chuyển sang một nội dung khác với tình huống hoặc yêu cầu đang được nêu.`;

  return {meaning,why,contrast,family:explanationFamily(detail,answer),standard:true};
}

function unit6StandardExplanation(question,detail){
  const answer=question.o[question.a];
  const info=blankInfo(question.q,answer);
  const meaning=String(detail.meaning||"").trim();
  const baseWhy=String(detail.why||"").trim();
  let why=baseWhy;
  if(info.before||info.after){
    const left=info.before?` Trước chỗ trống là “${info.before}”.`:"";
    const right=info.after?` Sau chỗ trống là “${info.after}”.`:"";
    why+=`${left}${right} Khi điền “${answer}”, ta được câu “${info.completed}”. Các chi tiết này gắn trực tiếp với nghĩa và vai trò của “${answer}” trong chính câu hỏi.`;
  }
  return {
    meaning,
    why,
    contrast:String(detail.contrast||"").trim(),
    family:explanationFamily(detail,answer),
    standard:true
  };
}

function fallbackStandardExplanation(bank,question,detail){
  const answer=question.o[question.a];
  const gloss=explanationGloss(question,detail,answer);
  const info=blankInfo(question.q,answer);
  const meaning=String(detail.meaning||question.e||`${answer} = ${gloss}`).trim();
  const why=String(detail.why||"").trim() || (info.before||info.after
    ? `Trong câu “${info.core}”, khi điền “${answer}” (= “${gloss}”), ta được “${info.completed}”. Các phần đứng trước và sau chỗ trống xác định trực tiếp nghĩa và vai trò của đáp án trong câu.`
    : `Câu hỏi đang yêu cầu đúng nghĩa “${gloss}”, và “${answer}” là mục từ mang nghĩa này trong bài.`);
  return {
    meaning,
    why,
    contrast:String(detail.contrast||"").trim(),
    family:explanationFamily(detail,answer),
    standard:true
  };
}

for(const bank of Object.values(BANKS)){

  });

function shuffled(items){
  const copy=[...items];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

function shuffleQuestionOptions(question){
  const shuffledOptions=shuffled(
    question.o.map((text,originalIndex)=>({text,originalIndex}))
  );
  return {
    ...question,
    o:shuffledOptions.map(item=>item.text),
    a:shuffledOptions.findIndex(item=>item.originalIndex===question.a)
  };
}

function useBank(grade,unit){
  const bank=BANKS[`${grade}-${unit}`];

  activeGrade=grade;

}

  document.getElementById("correctStat").textContent=mastered;
  document.getElementById("wrongStat").textContent=totalMistakes;
  document.getElementById("answeredStat").textContent=firstTry;
  document.getElementById("scoreRing").style.background=`conic-gradient(var(--accent2) ${pct*3.6}deg,rgba(255,255,255,.08) 0deg)`;
  document.getElementById("resultTitle").textContent=totalMistakes===0?"Excellent — all first try.":totalMistakes<=8?"Strong vocabulary control.":"Review the tricky contrasts below.";
  buildReview();
  submitLeaderboardScore(firstTry,totalMistakes,activeQuestions.length);
  if(pct>=75)confetti();
  window.scrollTo({top:0,behavior:"smooth"});
}

function buildReview(){
  const list=document.getElementById("reviewList");
  list.innerHTML=activeQuestions.map((q,i)=>{
    const d=activeExplanations[i];
    const right=`${"ABCD"[q.a]}. ${esc(q.o[q.a])}`;
    const attemptLabel=mistakes[i]===0?"Correct on first try":`${mistakes[i]} mistake${mistakes[i]>1?"s":""} before correct`;
    return `<div class="review-item correct">
      <div class="review-q">${i+1}. ${esc(q.q)}</div>
      <div class="review-meta"><span class="tag good">Correct: ${right}</span><span class="tag">${attemptLabel}</span></div>
      <div class="explain"><b>Nghĩa:</b> ${esc(d.meaning)}<br><br><b>Phân biệt:</b> ${esc(d.contrast)}</div>
    </div>`;
  }).join("");
}

function confetti(){
  const h=document.getElementById("confetti");h.innerHTML="";
  for(let i=0;i<80;i++){const e=document.createElement("i");e.style.left=Math.random()*100+"vw";e.style.setProperty("--x",(Math.random()*220-110)+"px");e.style.setProperty("--t",(2.6+Math.random()*2)+"s");e.style.setProperty("--h",Math.floor(Math.random()*360));e.style.animationDelay=Math.random()*.6+"s";h.appendChild(e)}
  setTimeout(()=>h.innerHTML="",5200);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(window.__t);window.__t=setTimeout(()=>t.classList.remove("show"),2200)}
document.addEventListener("keydown",e=>{
  if(quizShell.style.display!=="block")return;
  const k=e.key.toLowerCase();if(["a","b","c","d"].includes(k)){const i=["a","b","c","d"].indexOf(k);const b=qMount.querySelector(`.answer[data-i="${i}"]`);if(b)b.click()}
  if(e.key==="ArrowRight"&&current<activeQuestions.length-1&&solved[current])move(1);
  if(e.key==="ArrowLeft"&&current>0)move(-1);
});
route();
</script>
</body>
