<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#F8FBFF">
<title>English Practice Hub</title>
<style>
:root{
  --bg:#06111f;--panel:rgba(13,25,43,.82);--soft:rgba(255,255,255,.055);
  --text:#f8fafc;--muted:#9fb0c8;--line:rgba(255,255,255,.11);
  --accent:#8b5cf6;--accent2:#22d3ee;--good:#34d399;--bad:#fb7185;
  --shadow:0 24px 80px rgba(0,0,0,.36)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 14% 14%,rgba(34,211,238,.13),transparent 28%),
    radial-gradient(circle at 88% 8%,rgba(139,92,246,.16),transparent 30%),
    radial-gradient(circle at 55% 88%,rgba(52,211,153,.07),transparent 24%),
    var(--bg);
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.34;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:32px 32px;mask-image:linear-gradient(to bottom,#000,transparent 90%)
}
button{font:inherit}
a{color:inherit}
.wrap{width:min(1680px,calc(100% - 24px));margin:auto;padding:24px 0 52px;position:relative;z-index:2}
.site-header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:-.01em;cursor:pointer}
.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 10px 34px rgba(34,211,238,.15)}
.header-note{font-size:12px;color:#d6e1ef;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:8px 11px;border-radius:999px}
.panel{border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(18px);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.page{padding:34px;min-height:650px;animation:fadeUp .4s cubic-bezier(.22,1,.36,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#cbd7e8}
.eyebrow:before{content:"";width:28px;height:2px;background:linear-gradient(90deg,var(--accent2),transparent)}
h1,h2,h3,p{margin-top:0}
.hero h1{font-size:clamp(40px,6vw,74px);line-height:.98;letter-spacing:-.05em;margin:18px 0}
.gradient{background:linear-gradient(90deg,#fff,#c4b5fd 48%,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);font-size:17px;line-height:1.7;max-width:720px}
.section-title{margin:36px 0 16px;display:flex;align-items:end;justify-content:space-between;gap:16px}
.section-title h2{margin:0;font-size:24px}
.section-title span{color:var(--muted);font-size:13px}
.units{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.unit-card{
  position:relative;min-height:230px;padding:24px;border-radius:22px;border:1px solid var(--line);
  background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));
  overflow:hidden;cursor:pointer;transition:.22s ease;text-align:left;color:var(--text)
}
.unit-card:hover{transform:translateY(-5px);border-color:rgba(103,232,249,.35);box-shadow:0 18px 50px rgba(0,0,0,.2)}
.unit-card:after{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;bottom:-80px;background:radial-gradient(circle,rgba(139,92,246,.3),transparent 66%);transition:.3s}
.unit-card:hover:after{transform:scale(1.15)}
.unit-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.unit-no{font-size:12px;font-weight:900;letter-spacing:.12em;color:#c4b5fd}
.status{font-size:11px;padding:6px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.status.live{color:#a7f3d0;background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.2)}
.unit-card h3{font-size:29px;margin:34px 0 8px;letter-spacing:-.03em}
.unit-card p{color:var(--muted);line-height:1.5;margin:0;max-width:80%}
.unit-arrow{position:absolute;right:22px;top:50%;font-size:24px;color:#b8c6d9;transition:.2s}
.unit-card:hover .unit-arrow{transform:translateX(5px);color:#67e8f9}
.breadcrumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:22px}
.crumb-btn{border:0;background:none;color:#c9d7e8;padding:0;cursor:pointer}
.crumb-btn:hover{color:white}
.unit-hero{padding:28px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(139,92,246,.12),rgba(34,211,238,.06));border-radius:22px;margin-bottom:24px}
.unit-hero h1{font-size:clamp(34px,5vw,58px);margin:12px 0 10px;letter-spacing:-.04em}
.unit-hero p{color:var(--muted);line-height:1.6;max-width:680px;margin-bottom:0}
.exercise-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.exercise-card{
  border:1px solid var(--line);background:var(--soft);border-radius:20px;padding:20px;
  cursor:pointer;transition:.2s;text-align:left;color:var(--text)
}
.exercise-card:hover{transform:translateY(-3px);border-color:rgba(167,139,250,.45);background:rgba(139,92,246,.09)}
.exercise-icon{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(139,92,246,.13);border:1px solid rgba(167,139,250,.2);margin-bottom:28px}
.exercise-card h3{margin:0 0 8px;font-size:21px}
.exercise-card p{color:var(--muted);font-size:14px;line-height:1.55;margin-bottom:16px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;color:#c9d7e8;border:1px solid var(--line);padding:6px 8px;border-radius:999px}
.empty{padding:54px 24px;text-align:center;border:1px dashed rgba(255,255,255,.17);border-radius:22px;color:var(--muted)}
.empty b{display:block;color:white;font-size:20px;margin-bottom:8px}
.primary,.secondary{
  border-radius:14px;padding:13px 18px;font-weight:850;cursor:pointer;transition:.2s;
}
.primary{border:0;color:#06111f;background:linear-gradient(135deg,#a78bfa,#67e8f9);box-shadow:0 12px 35px rgba(103,232,249,.12)}
.primary:hover{transform:translateY(-2px);filter:brightness(1.05)}
.secondary{border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text)}
.secondary:hover{background:rgba(255,255,255,.09)}
.exercise-intro{max-width:790px;margin:50px auto;text-align:center}
.exercise-intro h1{font-size:clamp(36px,6vw,68px);line-height:1;letter-spacing:-.05em;margin:18px 0}
.exercise-intro p{color:var(--muted);line-height:1.7;font-size:16px}
.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin:26px 0 32px}
.pill{font-size:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:8px 10px;border-radius:999px;color:#cbd8e8}
.quiz-shell{display:none}
.quiz-top{display:flex;gap:14px;align-items:center;padding:17px 20px;border-bottom:1px solid var(--line)}
.progress-track{height:8px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden;flex:1}
.progress{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .45s cubic-bezier(.22,1,.36,1)}
.counter{min-width:76px;text-align:right;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.quiz-body{padding:30px}
.question-card{animation:slide .35s cubic-bezier(.22,1,.36,1)}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.kicker{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin-bottom:18px}
.qnum{font-weight:900;color:#c4b5fd}
.question{font-size:clamp(22px,3.1vw,34px);line-height:1.35;letter-spacing:-.02em;margin-bottom:26px}
.answers{display:grid;gap:11px}
.answer{
  width:100%;display:flex;align-items:center;gap:14px;text-align:left;color:var(--text);
  background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:15px 17px;
  cursor:pointer;transition:.18s
}
.answer:hover{transform:translateY(-2px);border-color:rgba(103,232,249,.35)}
.answer.selected{border-color:#8b5cf6;background:rgba(139,92,246,.12);transform:translateX(4px)}
.answer.correct{border-color:rgba(52,211,153,.78);background:rgba(52,211,153,.12);transform:translateX(4px)}
.answer.correct .letter{background:var(--good);border-color:var(--good);color:#04140f}
.answer.wrong-choice{border-color:rgba(251,113,133,.78);background:rgba(251,113,133,.11);animation:shake .28s ease}
.answer.wrong-choice .letter{background:var(--bad);border-color:var(--bad);color:#21050b}
.answer:disabled{cursor:default;opacity:.93}
.answer:disabled:hover{transform:none}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.feedback{margin-top:20px;border-radius:18px;padding:18px;border:1px solid var(--line);animation:fadeUp .3s ease}
.feedback.wrong{border-color:rgba(251,113,133,.3);background:rgba(251,113,133,.07)}
.feedback.correct{border-color:rgba(52,211,153,.3);background:rgba(52,211,153,.065)}
.feedback-title{font-weight:900;font-size:16px;margin-bottom:8px}
.feedback.wrong .feedback-title{color:#fecdd3}
.feedback.correct .feedback-title{color:#a7f3d0}
.feedback p{color:#cbd7e8;line-height:1.62;margin:0}
.deep-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.deep-box{padding:13px;border-radius:14px;background:rgba(255,255,255,.045);border:1px solid var(--line)}
.deep-box b{display:block;color:white;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.deep-box span{display:block;color:var(--muted);font-size:13px;line-height:1.58}
.deep-box.wide{grid-column:1/-1}
.word-family-row{grid-column:1/-1;display:flex;align-items:center;gap:10px;min-width:0;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:rgba(139,92,246,.065);font-size:13px;line-height:1.45}
.word-family-row b{flex:0 0 auto;color:#ddd6fe;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.word-family-row span{min-width:0;color:#d6e1ef;overflow-wrap:anywhere}
.sentence-translation{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.08);color:#e7eef9;font-size:13px;line-height:1.58}
.sentence-translation strong{color:#c4b5fd;font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin-right:5px}
.feedback.standard-feedback .deep-box span{font-size:13.5px;line-height:1.62;max-width:52ch}
.feedback.standard-feedback .deep-box.wide span{max-width:76ch}
@media(max-width:560px){.word-family-row{align-items:flex-start;flex-direction:column;gap:4px}}
.next-lock{color:var(--muted);font-size:12px;align-self:center}
.letter{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);font-weight:900}
.answer.selected .letter{background:#8b5cf6;border-color:#8b5cf6}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:26px}
.result{display:none;padding:30px}
.score-wrap{display:grid;grid-template-columns:220px 1fr;gap:28px;align-items:center}
.score-ring{width:210px;height:210px;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent2) 0deg,rgba(255,255,255,.08) 0deg)}
.score-ring:after{content:"";position:absolute;inset:14px;background:#0b1728;border-radius:50%;border:1px solid var(--line)}
.score-inner{position:relative;z-index:2;text-align:center}
.score-big{font-size:50px;font-weight:950;letter-spacing:-.05em}
.score-label{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}
.stat{border:1px solid var(--line);background:var(--soft);border-radius:15px;padding:14px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:11px}
.nickname-box{max-width:420px;margin:18px auto 0;text-align:left}.nickname-box label{display:block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.nickname-box input{width:100%;box-sizing:border-box;color:var(--text);background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;font:inherit}.nickname-box input:focus{border-color:rgba(103,232,249,.55);box-shadow:0 0 0 3px rgba(103,232,249,.08)}.grade-overview{display:grid;grid-template-columns:1fr;gap:18px;align-items:stretch;margin-bottom:24px}
.grade-overview .unit-hero{margin-bottom:0}
.review{margin-top:28px}
.review-list{display:grid;gap:10px}
.review-item{border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:15px;padding:15px}
.review-item.correct{border-left:4px solid var(--good)}
.review-item.wrong{border-left:4px solid var(--bad)}
.review-q{font-weight:760;line-height:1.5}
.review-meta{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}
.tag{font-size:11px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.06)}
.tag.good{color:#a7f3d0;background:rgba(52,211,153,.1)}
.tag.bad{color:#fecdd3;background:rgba(251,113,133,.11)}
.explain{font-size:13px;line-height:1.55;color:var(--muted)}
.footer{text-align:center;color:#71839b;font-size:11px;padding:15px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#111c2e;border:1px solid var(--line);padding:10px 14px;border-radius:12px;transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-16px;width:8px;height:15px;border-radius:3px;background:hsl(var(--h) 85% 65%);animation:fall var(--t) linear forwards}
@keyframes fall{to{transform:translate3d(var(--x),110vh,0) rotate(760deg)}}
@media(max-width:760px){
  .page{padding:23px 17px;min-height:620px}.units,.exercise-grid{grid-template-columns:1fr}
  .unit-card{min-height:200px}.header-note{display:none}.score-wrap{grid-template-columns:1fr}.score-ring{margin:auto}
  .stats{grid-template-columns:1fr}.deep-grid{grid-template-columns:1fr}.quiz-body{padding:23px 17px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}

.reading-passage{margin:0 0 18px;padding:16px 17px;border:1px solid var(--line);border-radius:16px;background:rgba(34,211,238,.045);color:#dbe7f5;line-height:1.7;font-size:14px;white-space:normal}
.wordform-wrap{display:flex;gap:10px;align-items:stretch;margin-top:14px}
.wordform-input{flex:1;min-width:0;border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text);border-radius:14px;padding:13px 14px;font:inherit;outline:none}
.wordform-input:focus{border-color:rgba(103,232,249,.55);box-shadow:0 0 0 3px rgba(103,232,249,.08)}
.wordform-input:disabled{opacity:.9}
@media(max-width:560px){.wordform-wrap{flex-direction:column}}

.context-level-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.context-level-card{border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:18px;padding:18px;text-align:left;color:var(--text);cursor:pointer;transition:.2s ease}
.context-level-card:hover{transform:translateY(-2px);border-color:rgba(103,232,249,.42);background:rgba(103,232,249,.06)}
.context-level-card strong{display:block;font-size:20px;margin-bottom:7px}
.context-level-card span{display:block;color:var(--muted);font-size:13px;line-height:1.5}
.reading-card{padding:0;overflow:hidden}
.reading-layout{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(340px,.88fr);height:clamp(520px,calc(100dvh - 175px),760px);min-height:0;max-height:none;overflow:hidden}
.reading-pane,.reading-question-pane{height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;scrollbar-gutter:stable;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.context-reading-layout{height:clamp(520px,calc(100dvh - 175px),760px);min-height:0;max-height:none;overflow:hidden}
.context-reading-layout>.reading-pane,.context-reading-layout>.reading-question-pane{height:100%;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;scrollbar-gutter:stable;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.context-reading-layout>.reading-pane{scroll-behavior:smooth}
.context-reading-layout>.reading-question-pane{scroll-behavior:smooth}
.reading-pane{padding:22px 24px;border-right:1px solid var(--line);background:rgba(255,255,255,.025)}
.reading-pane-head{position:sticky;top:-22px;margin:-22px -24px 16px;padding:16px 24px 12px;background:rgba(10,16,31,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);z-index:2}
.reading-pane-head b{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent2)}
.reading-pane-head span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
.reading-text{font-size:15px;line-height:1.88;color:#dce8f6}
.reading-focus{padding:1px 5px;border-radius:6px;background:rgba(250,204,21,.18);box-shadow:0 0 0 1px rgba(250,204,21,.22);color:#fff1a8;font-weight:700}
.context-reading-layout>.reading-pane::-webkit-scrollbar,.context-reading-layout>.reading-question-pane::-webkit-scrollbar{width:8px}
.context-reading-layout>.reading-pane::-webkit-scrollbar-thumb,.context-reading-layout>.reading-question-pane::-webkit-scrollbar-thumb{background:rgba(148,163,184,.34);border-radius:999px}
.context-reading-layout>.reading-pane::-webkit-scrollbar-track,.context-reading-layout>.reading-question-pane::-webkit-scrollbar-track{background:rgba(255,255,255,.025)}
.reading-question-pane{padding:22px 24px}
.reading-question-pane .question{margin-top:14px}
.reading-question-pane .nav{position:sticky;bottom:-22px;margin:22px -24px -22px;padding:14px 24px;background:rgba(10,16,31,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);z-index:2}
.reading-question-pane .nav.context-nav{position:sticky;top:-22px;bottom:auto;margin:14px -24px 18px;padding:12px 24px;border-top:0;border-bottom:1px solid var(--line);z-index:3}
.cg-note{margin:12px 0 0;padding:12px 14px;border:1px solid rgba(103,232,249,.18);border-radius:14px;background:rgba(103,232,249,.045);color:var(--muted);font-size:13px;line-height:1.55}
@media(max-width:820px){
  .context-level-grid{grid-template-columns:1fr}
  .reading-layout{display:block;max-height:none;min-height:0}
  .reading-pane{border-right:0;border-bottom:1px solid var(--line);max-height:44vh;padding:18px}
  .reading-pane-head{top:-18px;margin:-18px -18px 14px;padding:14px 18px 10px}
  .reading-question-pane{overflow:visible;padding:18px}
  .reading-question-pane .nav{position:static;margin:20px 0 0;padding:14px 0 0;background:none;backdrop-filter:none}
  .context-reading-layout{display:grid;grid-template-rows:minmax(220px,42vh) minmax(260px,48vh);height:auto;min-height:0;max-height:none;overflow:visible}
  .context-reading-layout>.reading-pane,.context-reading-layout>.reading-question-pane{height:auto;min-height:0;max-height:none;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  .context-reading-layout>.reading-question-pane{padding:18px}
}

/* Grade 12 Unit 1 semantic-precision pilot */
.question-mode{display:block;width:max-content;margin-bottom:10px;padding:5px 9px;border-radius:999px;border:1px solid rgba(103,232,249,.24);background:rgba(34,211,238,.07);color:#67e8f9;font-size:11px;font-weight:900;letter-spacing:.12em}
.vocab-target{text-decoration-thickness:2px;text-underline-offset:4px;text-decoration-color:#67e8f9}

.done-chip{border-color:rgba(52,211,153,.38)!important;background:rgba(52,211,153,.10)!important;color:#a7f3d0!important}
.semantic-feedback{padding:0;overflow:hidden;background:linear-gradient(180deg,rgba(8,23,39,.96),rgba(8,18,32,.96));border:1px solid rgba(103,232,249,.18)}
.semantic-feedback>.feedback-title{padding:18px 20px;border-bottom:1px solid var(--line);background:rgba(52,211,153,.07)}
.semantic-step{padding:22px 20px;border-bottom:1px solid var(--line)}
.semantic-step-label{display:flex;align-items:center;gap:12px;margin-bottom:15px}
.semantic-step-label>span{width:32px;height:32px;flex:0 0 32px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,rgba(139,92,246,.35),rgba(34,211,238,.24));border:1px solid rgba(196,181,253,.26)}
.semantic-step-label b{display:block;font-size:15px;color:#f8fafc}

/* Learner account gate */
.header-actions{display:flex;align-items:center;gap:9px}
.header-logout{display:none;border:1px solid var(--line);background:rgba(255,255,255,.72);color:var(--text);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;cursor:pointer}
.header-logout:hover{background:rgba(255,255,255,.96)}
.account-shell{max-width:760px;margin:24px auto 8px}
.account-card{border:1px solid var(--line);background:rgba(255,255,255,.86);border-radius:24px;padding:26px;box-shadow:0 18px 50px rgba(37,99,235,.08)}
.account-card h1{font-size:clamp(34px,5vw,56px);letter-spacing:-.045em;margin:12px 0 8px}
.account-sub{color:var(--muted);line-height:1.65;margin-bottom:20px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.58);margin-bottom:18px}
.auth-tab{border:0;border-radius:12px;padding:11px 12px;background:transparent;color:var(--muted);font-weight:850;cursor:pointer}
.auth-tab.active{background:#fff;color:var(--text);box-shadow:0 5px 18px rgba(37,99,235,.09)}
.auth-fields{display:grid;gap:12px}
.auth-field label{display:block;margin-bottom:6px;color:var(--muted);font-size:12px;font-weight:850;letter-spacing:.03em}
.auth-field input{width:100%;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:14px;padding:13px 14px;font:inherit;outline:none}
.auth-field input:focus{border-color:#2563EB;box-shadow:0 0 0 3px rgba(37,99,235,.09)}
.auth-help{color:var(--muted);font-size:12px;line-height:1.55;margin-top:4px}
.auth-message{min-height:22px;margin:12px 0 0;color:#C43255;font-size:13px}
.auth-message.success{color:#16734F}
.account-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:18px 0 8px;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.74)}

.account-banner span{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* Global Tutoring streak */
.tutoring-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(520px,680px);gap:28px;align-items:start;margin-bottom:22px}
.tutoring-top .hero{margin:0;padding-top:16px}
.global-streak-card{display:grid;grid-template-columns:minmax(0,1fr) 170px;background:rgba(255,255,255,.92);border:1px solid rgba(148,163,184,.28);border-radius:22px;box-shadow:0 18px 45px rgba(30,64,175,.08);overflow:hidden;min-height:238px}
.streak-heatmap-pane{padding:24px 22px 20px;min-width:0}
.streak-months{display:grid;grid-template-columns:repeat(27,11px);gap:4px;margin-left:45px;height:22px;align-items:end;color:var(--muted);font-size:11px;font-weight:750;white-space:nowrap}
.streak-months span{grid-row:1}
.streak-chart-row{display:flex;align-items:flex-start;gap:10px}
.streak-weekdays{display:grid;grid-template-rows:repeat(7,11px);gap:4px;width:35px;color:var(--muted);font-size:10px;line-height:11px;text-align:right;flex:0 0 35px}
.streak-weekdays span{height:11px}
.streak-heatmap{display:grid;grid-template-rows:repeat(7,11px);grid-auto-flow:column;grid-auto-columns:11px;gap:4px;min-width:401px}
.streak-cell{width:11px;height:11px;border-radius:3px;background:#E8ECF2;border:1px solid rgba(148,163,184,.08)}
.streak-cell.level-1{background:#C7F2DB}
.streak-cell.level-2{background:#79DFA9}
.streak-cell.level-3{background:#25B96E}
.streak-cell.level-4{background:#7057E8}
.streak-cell.future{background:rgba(226,232,240,.34);border-color:transparent}
.streak-legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:16px;color:var(--muted);font-size:11px}
.streak-legend-cells{display:flex;gap:4px}
.streak-legend .streak-cell{display:block;flex:0 0 11px}
.streak-summary{border-left:1px solid rgba(148,163,184,.25);padding:30px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.streak-flame{font-size:42px;line-height:1;margin-bottom:8px}
.streak-number{font-size:50px;line-height:1;font-weight:950;letter-spacing:-.05em;color:var(--text)}
.streak-label{margin-top:8px;font-size:15px;font-weight:850;color:var(--text)}
.streak-note{margin-top:14px;color:var(--muted);font-size:11px;line-height:1.45;font-style:italic}
@media(max-width:1180px){.tutoring-top{grid-template-columns:1fr}.global-streak-card{max-width:760px}}
@media(max-width:700px){.global-streak-card{grid-template-columns:1fr}.streak-summary{border-left:0;border-top:1px solid rgba(148,163,184,.25);padding:20px}.streak-heatmap-pane{overflow-x:auto}.streak-number{font-size:44px}}

function explanationGloss(question,detail,answer){
  const direct=String(question?.q||"").match(/(?:means|có nghĩa|nghĩa)\s*[“"]([^”"]+)[”"]/i);
  if(direct)return direct[1].trim();
  const e=String(question?.e||"");
  let m=e.match(/=\s*([^.;]+)/);
  if(m)return m[1].trim();
  const meaning=String(detail?.meaning||"");
  m=meaning.match(/(?:=|—)\s*[“"]?([^.;”"]+)/);
  if(m)return m[1].trim();
  return "";
}

function explanationFamily(detail,answer){
  let family=String(detail?.family||"").trim();
  if(!family){
    const usage=String(detail?.usage||"");
    const wf=usage.match(/Word family:\s*([^.]*(?:→[^.]*)?)/i);
    if(wf)family=wf[1].trim();
    if(!family){
      const arrow=usage.split(/\.\s+/).find(x=>x.includes("→"));
      if(arrow)family=arrow.replace(/^Word family:\s*/i,"").replace(/^Collocations?:\s*/i,"").trim();
    }
  }
  if(!family||family==="—")return "";
  if(!family.includes("→"))return "";
  if(/tài liệu|không mở rộng|cụm cố định|dạng từ trọng tâm|ghi nhớ cả cụm|giữ đúng từ loại|rare|thường dùng|\s\+\s|community-based|city \(n\).*urban|cultural heritage|project-based|peer group|plural n|fauna|flora|qualitative|anciently|due date/i.test(family))return "";
  return family;
}
function questionCore(text){
  return String(text||"")
    .replace(/^Choose the vocabulary item that best completes the source sentence:\s*/i,"")
    .replace(/^Choose the most precise vocabulary item from the source:\s*/i,"")
    .trim();
}

function blankInfo(text,answer){
  const core=questionCore(text);
  const m=core.match(/_{2,}/);
  if(!m)return {core,completed:core,before:"",after:""};
  const pos=m.index;
  const before=core.slice(0,pos).trim();
  const after=core.slice(pos+m[0].length).trim();
  const completed=core.slice(0,pos)+answer+core.slice(pos+m[0].length);
  const clip=(s,n=92)=>{
    const clean=s.replace(/\s+/g," ").replace(/^[“"]|[”"]$/g,"").trim();
    return clean.length<=n?clean:clean.slice(clean.length-n).trim();
  };
  const clipAfter=(s,n=92)=>{
    const clean=s.replace(/\s+/g," ").replace(/^[“"]|[”"]$/g,"").trim();
    return clean.length<=n?clean:clean.slice(0,n).trim()+"…";
  };
  return {core,completed,before:clip(before),after:clipAfter(after)};
}

function partOfSpeechClue(detail){
  const text=String(detail?.meaning||"").toLowerCase();
  if(/\((?:adj|adjective)[^)]*\)/.test(text))return "Vị trí chỗ trống cần một tính từ để mô tả đặc điểm hoặc trạng thái của đối tượng đang được nói tới.";
  if(/\((?:adv|adverb)[^)]*\)/.test(text))return "Vị trí chỗ trống cần một trạng từ để bổ nghĩa cho hành động hoặc đặc điểm trong câu.";
  if(/\((?:v|verb|phr\.? ?v|pv)[^)]*\)/.test(text))return "Vị trí chỗ trống cần một động từ hoặc cụm động từ để diễn tả hành động xảy ra trong tình huống này.";
  if(/\((?:n|noun)[^)]*\)/.test(text))return "Vị trí chỗ trống cần một danh từ hoặc cụm danh từ để gọi tên người, vật, sự việc hoặc khái niệm được nhắc tới.";
  return "";
}

function connectorClue(core,gloss){
  const because=core.match(/\bbecause\b\s+(.+)$/i);
  if(because)return `Mệnh đề sau “because” — “${because[1].trim()}” — nêu lý do trực tiếp làm rõ đặc điểm hoặc ý “${gloss}” mà chỗ trống cần diễn đạt.`;
  const semi=core.split(";");
  if(semi.length>1)return `Phần sau dấu chấm phẩy — “${semi.slice(1).join(";").trim()}” — giải thích cụ thể cho ý cần điền ở vế trước.`;
  const soThat=core.match(/\bso\b[^.?!]*\bthat\b[^.?!]*/i);
  if(soThat)return `Cấu trúc “${soThat[0].trim()}” cho thấy vế sau là kết quả trực tiếp của đặc điểm hoặc hành động được chọn ở chỗ trống.`;
  if(/\binstead of\b/i.test(core))return "Cụm “instead of” tạo thế đối chiếu ngay trong câu, nên đáp án phải phù hợp với hành động hoặc ý được đặt đối lập ở hai vế.";
  if(/\brather than\b/i.test(core))return "Cụm “rather than” đặt hai khả năng trong thế đối chiếu; đáp án đúng phải khớp với hành động hoặc đặc điểm mà câu ưu tiên ở vế còn lại.";
  return "";
}

function grade9MeaningMap(bank){
  const map={};
  bank.questions.forEach((q,i)=>{
    const answer=q.o[q.a];
    const detail=bank.explanations[i]||{};
    const gloss=explanationGloss(q,detail,answer);
    if(answer&&gloss)map[answer]=gloss;
  });
  return map;
}
function grade9SemanticClue(core,info,answer,gloss){
  const text=String(core||"").replace(/\s+/g," ").trim();

  const because=text.match(/\bbecause\b\s+([^.!?]+)/i);
  if(because){
    return `Mệnh đề “because ${because[1].trim()}” nêu lý do trực tiếp. Chi tiết này giải thích vì sao đặc điểm “${gloss}” đúng với đối tượng được nói tới.`;
  }

  const show=text.match(/^(.{1,150}?)\b(?:show|shows|showed)\b\s+(.+)$/i);
  if(show){
    return `Phần “${show[1].trim()}” là bằng chứng, còn động từ “show” cho biết bằng chứng đó đang chứng minh một đặc điểm. Vì các chi tiết này thể hiện rõ “${gloss}”, đáp án “${answer}” phù hợp về nghĩa.`;
  }

  const soThat=text.match(/\bso\b\s+([^.!?]+?)\s+\bthat\b\s+([^.!?]+)/i);
  if(soThat){
    return `Cấu trúc “so ${soThat[1].trim()} that ${soThat[2].trim()}” nối mức độ với kết quả. Kết quả ở vế sau giúp xác định đặc điểm cần điền là “${gloss}”.`;
  }

  const result=text.match(/;\s*(it|this|that|he|she|they|we)\s+([^.!?]+)/i);
  if(result){
    return `Vế sau dấu chấm phẩy — “${result[0].slice(1).trim()}” — giải thích hoặc cho thấy hệ quả của ý ở chỗ trống. Hệ quả này phù hợp với nghĩa “${gloss}”.`;
  }

  const before=String(info.before||"");
  const after=String(info.after||"");

  if(/\b(a|an|the)\s*$/i.test(before) && /^[a-z][^.!?]{2,120}/i.test(after)){
    return `Cụm sau chỗ trống — “${after}” — mô tả hành động hoặc vai trò của người/vật cần điền. Những hành động đó phù hợp với “${answer}” (= “${gloss}”), nên đáp án được xác định từ chính vai trò trong câu.`;
  }

  if(/\b(to|can|could|will|would|should|may|might|must)\s*$/i.test(before)){
    return `Chỗ trống đứng sau “${before.split(/\s+/).slice(-1)[0]}”, nên cần một động từ hoặc cụm động từ. Phần còn lại “${after}” cho biết đối tượng hoặc kết quả của hành động; “${answer}” mang nghĩa “${gloss}” nên khớp với hành động câu đang mô tả.`;
  }

  if(/\b(is|are|was|were|be|become|became|seem|feel|look|remain)\s*$/i.test(before)){
    return `Chỗ trống đứng sau động từ nối, nên cần một từ mô tả trạng thái hoặc đặc điểm. Chi tiết “${after}” làm rõ trạng thái đó và phù hợp với nghĩa “${gloss}” của “${answer}”.`;
  }

  return `Cụm ngay trước chỗ trống là “${info.before}”, còn phần sau là “${info.after}”. Hai phần này cùng xác định ý cần điền là “${gloss}”; “${answer}” diễn đạt đúng ý đó và đúng vai trò ngữ pháp trong câu.`;
}
function grade9StandardExplanation(bank,question,detail){
  const answer=question.o[question.a];
  const gloss=explanationGloss(question,detail,answer);
  const direct=/Which English word or phrase means|có nghĩa/i.test(question.q);
  const info=blankInfo(question.q,answer);

  const rawMeaning=String(detail.meaning||question.e||`${answer} = ${gloss}`).trim();
  const sentences=rawMeaning.split(/(?<=[.!?])\s+/);
  const isPhrase=/phr|phrasal|pv|cụm động từ|cụm giới từ/i.test(rawMeaning);
  const meaning=isPhrase&&sentences[1] ? sentences.slice(0,2).join(" ") : sentences[0];

  let why;
  if(direct){
    why=`“${answer}” mang nghĩa “${gloss}”. Đây là câu nhận diện nghĩa trực tiếp, nên không cần suy luận thêm từ ngữ cảnh.`;
  }else{
    const grammar=partOfSpeechClue(detail);
    const semantic=grade9SemanticClue(info.core,info,answer,gloss);
    why=`${grammar?grammar+" ":""}${semantic}`;
  }

  const meaningMap=grade9MeaningMap(bank);
  const distractors=question.o
    .filter(x=>x!==answer)
    .map(x=>meaningMap[x]?`“${x}” = “${meaningMap[x]}”`:`“${x}”`)
    .join("; ");
  const contrast=`“${answer}” = “${gloss}”. So với các lựa chọn còn lại: ${distractors}. ${direct
    ? `Các nghĩa khác nhau rõ ràng nên chỉ “${answer}” khớp với khái niệm được hỏi.`
    : `Trong câu này, chỉ “${answer}” vừa đúng nghĩa “${gloss}” vừa phù hợp với vai trò mà câu đang mô tả; các lựa chọn kia sẽ làm câu đổi nghĩa hoặc sai vai trò.`}`;

  return {meaning,why,contrast,family:explanationFamily(detail,answer),standard:true};
}
function unit6StandardExplanation(question,detail){
  const answer=question.o[question.a];
  const gloss=explanationGloss(question,detail,answer);
  const info=blankInfo(question.q,answer);
  const meaning=String(detail.meaning||"").trim();
  const baseWhy=String(detail.why||"").trim();
  let why=baseWhy;
  if(info.before||info.after){
    const left=info.before?` Trước chỗ trống là “${info.before}”.`:"";
    const right=info.after?` Sau chỗ trống là “${info.after}”.`:"";
    const glossNote=gloss?` “${answer}” ở đây mang nghĩa “${gloss}”.`:"";
    why+=`${left}${right}${glossNote} Hai phần này cho thấy trực tiếp vai trò của “${answer}” trong câu và giải thích vì sao đáp án phù hợp với tình huống đang được mô tả.`;
  }
  return {
    meaning,
    why,
    contrast:String(detail.contrast||"").trim(),
    family:explanationFamily(detail,answer),
    standard:true
  };
}
function fallbackStandardExplanation(bank,question,detail){
  const answer=question.o[question.a];
  const gloss=explanationGloss(question,detail,answer);
  const info=blankInfo(question.q,answer);
  const meaning=String(detail.meaning||question.e||`${answer} = ${gloss}`).trim();
  const why=String(detail.why||"").trim() || (info.before||info.after
    ? `Ngay trước chỗ trống là “${info.before}”, còn sau chỗ trống là “${info.after}”. “${answer}” mang nghĩa “${gloss}”, nên nó hoàn chỉnh đúng ý và đúng vai trò ngữ pháp của câu.`
    : `“${answer}” mang nghĩa “${gloss}”, nên đáp án này khớp trực tiếp với yêu cầu của câu hỏi.`);
  return {
    meaning,
    why,
    contrast:String(detail.contrast||"").trim(),
    family:explanationFamily(detail,answer),
    standard:true
  };
}


function compactCore(text){
  return String(text||"")
    .replace(/^Choose the vocabulary item that best completes the source sentence:\s*/i,"")
    .replace(/^Choose the most precise vocabulary item from the source:\s*/i,"")
    .replace(/^Chọn từ\/cụm từ phù hợp nhất để hoàn thành câu:\s*/i,"")
    .replace(/^Chọn từ\/cụm từ chính xác nhất để hoàn thành câu:\s*/i,"")
    .replace(/^Chọn từ\/cụm từ hoàn thành đúng collocation:\s*/i,"")
    .trim();
}
function compactSnippet(text,max=76){
  const clean=String(text||"")
    .replace(/\s+/g," ")
    .replace(/^[“”"'.,;:!?\s]+|[“”"'.,;:!?\s]+$/g,"")
    .trim();
  if(clean.length<=max)return clean;
  return clean.slice(0,max).replace(/\s+\S*$/,"").trim()+"…";
}
function compactBlankInfo(text,answer){
  const core=compactCore(text);
  const m=core.match(/_{2,}/);
  if(!m)return {core,completed:core,before:"",after:""};
  const pos=m.index;
  const before=core.slice(0,pos).trim();
  const after=core.slice(pos+m[0].length).trim();
  return {
    core,
    completed:core.slice(0,pos)+answer+core.slice(pos+m[0].length),
    before,
    after
  };
}
function explanationPos(detail,answer){
  const text=String(detail?.meaning||"").toLowerCase();
  const a=String(answer||"").toLowerCase().trim();
  if(/\((?:adj|adjective|adj\.)[^)]*\)/.test(text) || /\b(adj\.?|adjective)\b/.test(text))return "adj";
  if(/\((?:adv|adverb|adv\.)[^)]*\)/.test(text) || /\b(adv\.?|adverb)\b/.test(text))return "adv";
  if(/\((?:v|verb|phr\.?\s*v|phr\.?v|pv|v\.)[^)]*\)/.test(text) || /\b(phr\.?\s*v|phrasal verb|verb|v\.)\b/.test(text))return "v";
  if(/\((?:n|noun|n\.)[^)]*\)/.test(text) || /\b(noun|n\.)\b/.test(text))return "n";
  if(/ly$/.test(a))return "adv";
  if(/(tion|sion|ment|ness|ity|ance|ence|ship|ism|ist)$/.test(a))return "n";
  if(/(ous|ive|al|ic|able|ible|less|ful|ant|ent)$/.test(a) || /^(world-class)$/.test(a))return "adj";
  return "";
}
function usageCollocation(detail,answer,info){
  const usage=String(detail?.usage||"");
  if(!usage)return "";
  const candidates=usage
    .split(/[;.]/)
    .map(x=>x.trim())
    .filter(x=>x && !/word family/i.test(x) && x.toLowerCase().includes(String(answer).toLowerCase()));
  if(!candidates.length)return "";
  const local=(info.before+" "+answer+" "+info.after).toLowerCase();
  return candidates.find(x=>{
    const words=x.toLowerCase().match(/[a-z][a-z'-]*/g)||[];
    return words.length>=2 && words.every(w=>local.includes(w));
  })||"";
}
function naturalCombination(question,detail,answer,info,pos){
  const explicit=/collocation/i.test(String(question?.q||""));
  if(explicit && /_{2,}/.test(info.core)){
    return compactSnippet(
      info.completed.replace(/[“”"]/g,"").replace(/[.?!]+$/,"").trim(),
      82
    );
  }

  const after=String(info.after||"").replace(/^[”"',;:.!?()\s]+/,"").trim();
  const next=(after.match(/^([A-Za-z][A-Za-z'-]*)/)||[])[1]||"";
  const stop=/^(because|and|or|but|to|of|in|on|at|for|with|by|from|as|than|that|which|who|whose|where|when|is|are|was|were|be|been|being|has|have|had|can|could|will|would|should|may|might|must|a|an|the|this|these|those|his|her|their|our|your|my)$/i;
  if(next && !stop.test(next) && (pos==="adj" || pos==="adv" || !pos)){
    return answer+" "+next;
  }

  return "";
}
function decisiveGrammar(info,pos,answer,gloss){
  const b=String(info.before||"").replace(/[“"'(),;:.!?]+$/g,"").trim();
  const last=(b.match(/([A-Za-z'-]+)\s*$/)||[])[1]||"";
  if(pos==="v" && /^(to|can|could|will|would|should|may|might|must)$/i.test(last)){
    return "Sau “"+last+"” cần động từ nguyên mẫu; “"+answer+"” vừa đúng cấu trúc vừa diễn tả ý “"+gloss+"”.";
  }
  if(pos==="adj" && /^(is|are|was|were|be|been|being|become|became|seem|seems|feel|feels|look|looks|remain|remains)$/i.test(last)){

function evidenceReason(info,answer,gloss){
  const text=String(info.core||"").replace(/\s+/g," ").trim();
  let m=text.match(/\bbecause\b\s+([^.!?]+)/i);
  if(m)return "Dấu hiệu quyết định là mệnh đề “because "+compactSnippet(m[1],68)+"”: nó cung cấp bằng chứng trực tiếp cho ý “"+gloss+"”.";
  m=text.match(/\bsuch as\b\s+([^.!?]+)/i);
  if(m)return "Các ví dụ sau “such as” — “"+compactSnippet(m[1],68)+"” — xác định đúng trường nghĩa cần điền, dẫn tới “"+answer+"”.";
  m=text.match(/\bfor example\b[,:\s]+([^.!?]+)/i);
  if(m)return "Ví dụ “"+compactSnippet(m[1],68)+"” thu hẹp nghĩa của chỗ trống về đúng ý “"+gloss+"”.";
  m=text.match(/\bso\b\s+([^.!?]+?)\s+\bthat\b\s+([^.!?]+)/i);
  if(m)return "Quan hệ mức độ–kết quả trong “so … that …” là manh mối chính: kết quả phía sau cho thấy đặc điểm cần diễn đạt là “"+gloss+"”.";
  m=text.match(/\bnot\b\s+([^,.]{1,90})\s*,?\s*\bbut(?: rather)?\b\s+([^,.]{1,100})/i);
  if(m)return "Cấu trúc đối lập “not … but …” loại bỏ một khả năng và nhấn mạnh ý còn lại; ý được nhấn mạnh phù hợp với “"+answer+"”.";
  m=text.match(/\bfrom\b\s+([^,.]{1,70})\s+\bto\b\s+([^,.]{1,90})/i);
  if(m)return "Cấu trúc “from … to …” cho thấy một quá trình hoặc sự chuyển biến; “"+answer+"” khái quát đúng đặc điểm của quá trình đó.";
  const semi=text.split(";");
  if(semi.length>1){
    return "Vế sau dấu chấm phẩy — “"+compactSnippet(semi.slice(1).join(";"),72)+"” — đóng vai trò bằng chứng/giải thích cho ý “"+gloss+"”.";
  }
  const after=compactSnippet(info.after,70);
  const before=compactSnippet(info.before,70);
  const clue=after||before;
  if(clue)return "Dấu hiệu quyết định là “"+clue+"”: chi tiết này hướng tới ý “"+gloss+"”, nên “"+answer+"” là cách diễn đạt phù hợp.";
  return "“"+answer+"” diễn đạt chính xác ý “"+gloss+"” mà câu yêu cầu.";
}
function usefulExistingWhy(text){
  const s=String(text||"").trim();
  if(!s)return "";
  if(/Ngay trước chỗ trống|Ngay sau chỗ trống|Câu hoàn chỉnh là|Khi đặt vào|phần câu quanh đáp án|khớp trực tiếp với yêu cầu|không cần suy luận thêm|Hai phần này cùng xác định|đúng vai trò ngữ pháp/i.test(s))return "";
  const sentences=s.split(/(?<=[.!?])\s+/).filter(Boolean);
  const useful=sentences.filter(x=>!/^(“?Audience|“?Participant|“?Judge|“?Organiser|Các lựa chọn|Các phương án)/i.test(x));
  const picked=(useful.length?useful:sentences).slice(0,2).join(" ").trim();
  return picked.length<=460?picked:compactSnippet(picked,440);
}
function usefulExistingContrast(text){
  const s=String(text||"").trim();
  if(!s || s.length>330)return "";
  if(/các lựa chọn còn lại|các phương án còn lại|vì vậy chỉ|câu sẽ chuyển|không còn hợp|khớp chính xác|so với các lựa chọn|đổi nghĩa hoặc sai vai trò/i.test(s))return "";
  return s;
}
function semanticClass(gloss,answer){
  const g=String(gloss||"").toLowerCase();
  if(/người|nhân viên|thợ|nghệ nhân|ca sĩ|nhà hoạt động|nhà ngoại giao|khán giả|công dân|tình nguyện viên|chú rể/.test(g) || /(er|or|ist|ian|ant|ent)$/.test(String(answer||"").toLowerCase()))return "chỉ người";
  if(/^(sự|việc|quá trình|trạng thái|quyền|khát vọng|chủ quyền|dinh dưỡng|nhận thức|trách nhiệm|đóng góp|đoàn kết)/.test(g))return "chỉ khái niệm hoặc trạng thái trừu tượng";
  return "gọi tên đúng loại đối tượng hoặc khái niệm";

function compactWhy(question,detail,answer,gloss,info,pos){
  const q=String(question?.q||"");
  const direct=/Which English word or phrase means|Từ\/cụm từ nào có nghĩa|có nghĩa/i.test(q) && !/_{2,}/.test(q);

  const explicit=/collocation/i.test(q);
  const combo=naturalCombination(question,detail,answer,info,pos);
  if(explicit && combo){
    return "“"+combo+"” là cấu trúc/collocation cố định; “"+answer+"” là thành tố được quy ước để tạo đúng nghĩa “"+gloss+"”.";
  }
  if(combo && (pos==="adj" || pos==="adv" || !pos)){
    return "“"+combo+"” là cách kết hợp tự nhiên; “"+answer+"” tạo đúng sắc thái “"+gloss+"” cho từ đứng cạnh.";
  }

  const grammar=decisiveGrammar(info,pos,answer,gloss);
  if(grammar)return grammar;

  const existing=usefulExistingWhy(detail?.why);
  if(existing)return existing;

  return evidenceReason(info,answer,gloss);
}
function compactContrast(question,detail,answer,gloss,info,pos){
  const q=String(question?.q||"");
  const explicit=/collocation/i.test(q);
  const combo=naturalCombination(question,detail,answer,info,pos);

  if(explicit && combo){
    return "Khung “"+combo+"” có tính cố định: “"+answer+"” được lựa chọn bởi chính collocation này. Từ gần nghĩa không thể thay vào tùy ý mà vẫn giữ cùng cách dùng và sắc thái.";
  }

  if(combo && (pos==="adj" || pos==="adv" || !pos)){
    const after=String(info.after||"").replace(/^[”"',;:.!?()\s]+/,"").trim();
    const head=(after.match(/^([A-Za-z][A-Za-z'-]*)/)||[])[1]||"";
    if(pos==="adv"){
      return "“"+answer+"” chọn tự nhiên hành động “"+head+"” và bổ sung sắc thái “"+gloss+"”. Đây là selectional restriction: không phải trạng từ gần nghĩa nào cũng mô tả hành động này với cùng sắc thái.";
    }
    return "Về mặt ngữ nghĩa, “"+answer+"” kết hợp tự nhiên với “"+head+"” để gán đúng thuộc tính “"+gloss+"”. Điểm phân biệt nằm ở selectional restriction và sắc thái, không chỉ ở từ loại.";
  }

  const existing=usefulExistingContrast(detail?.contrast);
  if(existing)return existing;

  const after=String(info.after||"").replace(/^[”"',;:.!?()\s]+/,"").trim();
  const before=String(info.before||"").replace(/[”"',;:.!?()\s]+$/,"").trim();

    return "“"+prev+" "+answer+"” tạo một quan hệ nghĩa cụ thể: trạng từ giới hạn phương diện đánh giá, còn “"+answer+"” mang sắc thái “"+gloss+"”. Vì vậy điểm phân biệt nằm ở đúng phương diện nghĩa mà tính từ mô tả.";
  }
  if(pos==="v" && after){
    return "“"+answer+"” kết hợp tự nhiên với bổ ngữ “"+compactSnippet(after,48)+"” để diễn tả “"+gloss+"”. Đây là selectional restriction: động từ phải phù hợp với đúng loại đối tượng và quan hệ nghĩa.";
  }
  if(pos==="n"){
    return "“"+answer+"” thuộc đúng nhóm danh từ "+semanticClass(gloss,answer)+". Sự phù hợp nằm ở loại thực thể/khái niệm mà từ có thể gọi tên, không chỉ ở hình thức ngữ pháp.";

  }
  if(/\s/.test(String(answer))){
    return "“"+answer+"” hoạt động như một đơn vị nghĩa cố định mang ý “"+gloss+"”; thay từng thành tố bằng từ gần nghĩa không bảo đảm giữ được cùng cách dùng và sắc thái.";
  }

  const direct=/Which English word or phrase means|Từ\/cụm từ nào có nghĩa|có nghĩa/i.test(q) && !/_{2,}/.test(q);
  if(direct){
    return "Điểm cần phân biệt là phạm vi nghĩa: “"+answer+"” gọi đúng khái niệm “"+gloss+"”, còn các lựa chọn khác biểu đạt những khái niệm khác trong cùng nhóm từ vựng.";
  }

  return "Điểm phân biệt nằm ở sắc thái “"+gloss+"”: “"+answer+"” phù hợp với loại đối tượng và quan hệ nghĩa mà ngữ cảnh cho phép.";
}
function unifiedStandardExplanation(bank,question,detail){
  if(detail?.preserve)return {...detail,standard:true};
  const answer=question.o[question.a];
  const gloss=explanationGloss(question,detail,answer);
  const info=compactBlankInfo(question.q,answer);
  const pos=explanationPos(detail,answer);
  const meaning=String(detail?.meaning||question.e||"“"+answer+"” = “"+gloss+"”.").trim();
  return {
    ...detail,
    meaning,
    why:compactWhy(question,detail,answer,gloss,info,pos),
    contrast:compactContrast(question,detail,answer,gloss,info,pos),
    family:explanationFamily(detail,answer),
    standard:true
  };
}

async function learnerAuthRequest(path,init={}){
  const headers={

    "Content-Type":"application/json",
    ...((init.headers)||{})
  };
  const res=await fetch(SUPABASE_URL+path,{...init,headers});
  const raw=await res.text();
  let data=null;
  if(raw){try{data=JSON.parse(raw)}catch(_){data={message:raw}}}

function shuffled(items){
  const copy=[...items];
  for(let i=copy.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  return copy;
}

function shuffleQuestionOptions(question){
  if(question?.lockOptions)return {...question,o:[...(question.o||[])]};
  if(!Array.isArray(question?.o))return {...question};
  const shuffledOptions=shuffled(
    question.o.map((text,originalIndex)=>({text,originalIndex}))
  );
  return {
    ...question,
    o:shuffledOptions.map(item=>item.text),
    a:shuffledOptions.findIndex(item=>item.originalIndex===question.a)
  };
}

  }catch(_){}

function contextProgressRank(index,progress){
  const q=activeBank.questions[index]||{};
  const id=q.targetId||q.id||("cg-"+index);
  const st=progress.items[id];
  if(!st)return [0,0,0];
  const seen=Number(st.seenCount)||0;
  const wrong=Number(st.wrongAttempts)||0;
  const first=Number(st.firstTryCorrect)||0;
  const acc=seen?first/seen:0;
  const weakness=wrong>0&&acc<0.75?0:1;
  return [weakness,Number(st.lastSeen)||0,seen];
}
function pickContextAdaptive(pool,count,progress){
  const candidates=shuffled([...(pool||[])]);
  candidates.sort((a,b)=>{
    const A=contextProgressRank(a,progress),B=contextProgressRank(b,progress);
    return A[0]-B[0] || A[1]-B[1] || A[2]-B[2];
  });
  return candidates.slice(0,Math.max(0,count));
}
function recordContextProgress(question,wrongCount){
  if(!question)return;
  const id=question.targetId||question.id;
  if(!id)return;
  const data=readContextProgress();
  const st=data.items[id]||{seenCount:0,firstTryCorrect:0,wrongAttempts:0,lastSeen:0};
  st.seenCount++;
  if(!wrongCount)st.firstTryCorrect++;
  st.wrongAttempts+=Number(wrongCount)||0;
  st.lastSeen=Date.now();
  data.items[id]=st;
  writeContextProgress(data);
}
function progressRank(index,progress){
  const q=activeBank.questions[index]||{};
  const id=q.targetId||q.id||("q-"+index);
  const st=progress.items[id];
  if(!st)return [0,0,0];
  const seen=Number(st.seenCount)||0;
  const first=Number(st.firstTryCorrect)||0;
  const wrong=Number(st.wrongAttempts)||0;
  const acc=seen?first/seen:0;
  let band=2;
  if(st.mastery==="weak" || (wrong>0&&acc<0.7))band=1;
  else if(st.mastery==="mastered" || (seen>=3&&acc>=0.8))band=3;
  return [band,Number(st.lastSeen)||0,seen];
}
function pickAdaptive(pool,count,progress,exclude=new Set()){
  const candidates=shuffled((pool||[]).filter(i=>!exclude.has(i)));
  candidates.sort((a,b)=>{
    const A=progressRank(a,progress),B=progressRank(b,progress);
    return A[0]-B[0] || A[1]-B[1] || A[2]-B[2];
  });
  return candidates.slice(0,Math.max(0,count));
}
function recordVocabProgress(question,wrongCount){
  if(!question)return;
  if(question.type==="context_guessing")recordContextProgress(question,wrongCount);
  if(activeGrade!==12)return;
  const id=question.targetId||question.id;
  if(!id)return;
  const data=readVocabProgress();
  const st=data.items[id]||{seenCount:0,firstTryCorrect:0,wrongAttempts:0,lastSeen:0,mastery:"new"};
  st.seenCount++;
  if(!wrongCount)st.firstTryCorrect++;
  st.wrongAttempts+=Number(wrongCount)||0;
  st.lastSeen=Date.now();
  const acc=st.firstTryCorrect/st.seenCount;
  if(wrongCount>0&&acc<0.75)st.mastery="weak";
  else if(st.seenCount>=3&&acc>=0.8)st.mastery="mastered";
  else st.mastery="learning";
  data.items[id]=st;
  writeVocabProgress(data);
}

function getUnitSetNumbers(){
  return Object.keys(activeLevelConfig||{}).map(Number).filter(Number.isFinite).sort((a,b)=>a-b);
}
function explanationForQuestion(question,index){
  return activeBank?.explanationById?.[question?.id] || activeBank?.explanations?.[index] || {};
}
function loadQuestionPool(indices,{shuffleOrder=true}={}){
  activeQuestionIndices=shuffleOrder?shuffled(indices):[...indices];
  activeQuestions=activeQuestionIndices.map(i=>shuffleQuestionOptions(activeBank.questions[i]));
  activeExplanations=activeQuestions.map((q,pos)=>activeBank?.explanationById?.[q.id]||activeBank.explanations[activeQuestionIndices[pos]]||{});
}
function selectSet(setNo){
  const requested=Number(setNo)||1;
  const available=getUnitSetNumbers();
  const safe=available.includes(requested)?requested:(available[0]||1);
  activeSet=safe;
  activeLevel=activeLevelConfig[safe];
  activeSublevelKey="";

  if(activeMode==="grammar"){
    loadQuestionPool(activeLevel.pool||[],{shuffleOrder:false});
    return;
  }

  if(activeLevel?.contextGuessing){
    activeQuestionIndices=[];
    activeQuestions=[];
    activeExplanations=[];
    return;
  }
  if(activeLevel?.fixedOrder){
    loadQuestionPool(activeLevel.pool||[],{shuffleOrder:false});
    return;
  }
  if(activeLevel?.readingTail){
    const pool=[...(activeLevel.pool||[])];
    const head=pool.slice(0,Math.max(0,pool.length-5));
    const tail=pool.slice(-5);
    activeQuestionIndices=shuffled(head).concat(tail);
    activeQuestions=activeQuestionIndices.map(i=>shuffleQuestionOptions(activeBank.questions[i]));
    activeExplanations=activeQuestions.map((q,pos)=>activeBank?.explanationById?.[q.id]||activeBank.explanations[activeQuestionIndices[pos]]||{});
  }else if(activeGrade===12&&activeLevel?.sessionSize){
    const progress=readVocabProgress();
    const selected=[];
    const used=new Set();
    const mix=activeLevel.mix||{};
    const add=(pool,count)=>{
      const picked=pickAdaptive(pool,count,progress,used);
      picked.forEach(i=>{selected.push(i);used.add(i)});
    };
    if(mix.source)add(activeLevel.sourcePool||activeLevel.pool,mix.source);
    if(mix.external)add(activeLevel.externalPool||activeLevel.pool,mix.external);
    if(!mix.source&&!mix.external)add(activeLevel.pool,activeLevel.sessionSize);
    if(selected.length<activeLevel.sessionSize)add(activeLevel.pool,activeLevel.sessionSize-selected.length);
    loadQuestionPool(selected.slice(0,activeLevel.sessionSize),{shuffleOrder:true});
  }else{
    loadQuestionPool(activeLevel.pool||[],{shuffleOrder:true});
  }
}

  const res=await fetch(ACCESS_FUNCTION_URL,{
    method:"POST",

    body:JSON.stringify(payload)
  });
  let data={};

  if(!res.ok)throw new Error(data.error||"Không thể xác minh quyền truy cập.");

function cachedAccessValid(area,token){
  try{
    const row=JSON.parse(sessionStorage.getItem("hoctienganh_valid_"+area)||"null");
    return !!(row&&row.token===token&&row.until>Date.now());
  }catch(_){return false}
}

async function validateStoredAccess(area){
  const stored=getStoredAccess(area);
  if(!stored?.token)return false;
  if(stored.expiresAt&&Date.parse(stored.expiresAt)<=Date.now()){
    clearStoredAccess(area);
    return false;
  }
  if(cachedAccessValid(area,stored.token))return true;
  try{
    const data=await accessRequest({action:"validate",area,token:stored.token,deviceId:getDeviceId()});
    if(data?.ok){cacheAccessValid(area,stored.token);return true}
  }catch(_){}
  clearStoredAccess(area);
  return false;

    }else{
      clearStoredAccess("school");
      clearActiveArea();
      renderAccessPrompt("school");
    }
    return;
  }

  if(hash==="tutoring"){
    if(await validateStoredAccess("tutoring")){
      setActiveArea("tutoring");
      renderHome();
    }else{
      clearStoredAccess("tutoring");
      clearActiveArea();
      renderAccessPrompt("tutoring");
    }
    return;
  }

  if(hash.startsWith("school/")){
    if(!await validateStoredAccess("school")){
      clearStoredAccess("school");
      clearActiveArea();
      renderAccessPrompt("school");
      return;
    }
    setActiveArea("school");

    if(hash==="school/grade-10"){renderSchoolGrade10();return}
    if(hash==="school/grade-10/midterm-1"){renderSchoolMidterm1();return}

    const schoolSet=hash.match(/^school\/grade-10\/midterm-1\/set-(\d+)$/);
    if(schoolSet){renderSchoolSetIntro(Number(schoolSet[1]));return}

    location.hash="school";
    return;
  }

  const area=await ensureActiveAccess();
  if(!area){renderPortal();return}
  if(area!=="tutoring"){location.hash="school";return}

  if(hash==="listening"){renderListeningHome();return}
  if(hash==="listening/entertainment"){renderEntertainment();return}
  if(hash==="listening/entertainment/change-your-life-one-tiny-step-at-a-time"){renderEntertainmentVideo();return}
  if(hash==="listening/news"){renderNews();return}
  if(hash==="listening/news/former-openai-employee-ai-might-really-kill-us-all"){renderNewsVideo();return}

  if(hash==="grammar"){renderGrammarHome();return}

  const grammarSet=hash.match(/^grammar\/([^/]+)\/set-(\d+)$/);
  if(grammarSet){
    const slug=grammarSet[1],setNo=Number(grammarSet[2]);
    if(window.GRAMMAR_BANKS?.[slug]){renderGrammarExercise(slug,setNo);return}
  }

  const grammarUnit=hash.match(/^grammar\/([^/]+)$/);
  if(grammarUnit){
    const slug=grammarUnit[1];
    if(window.GRAMMAR_BANKS?.[slug]){renderGrammarUnit(slug);return}
  }

  const exercise=hash.match(/^grade-(9|10|11|12)\/unit-(\d+)\/vocabulary-practice-(\d+)$/);
  if(exercise){
    const grade=Number(exercise[1]),unit=Number(exercise[2]),setNo=Number(exercise[3]);
    if(BANKS[`${grade}-${unit}`]){renderExercise(grade,unit,setNo);return}
  }

  const unitRoute=hash.match(/^grade-(9|10|11|12)\/unit-(\d+)$/);
  if(unitRoute){
    const grade=Number(unitRoute[1]),unit=Number(unitRoute[2]);
    if(BANKS[`${grade}-${unit}`]){renderUnit(grade,unit);return}
  }

  const grade=hash.match(/^grade-(9|10|11|12)$/);
  if(grade){renderGrade(Number(grade[1]));return}

  goAreaHome();
}

const STREAK_WEEKS=27;
function vnDateKey(date=new Date()){
  const parts=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Ho_Chi_Minh",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(date);
  const pick=t=>parts.find(p=>p.type===t)?.value||"";
  return pick("year")+"-"+pick("month")+"-"+pick("day");
}
function utcDateFromKey(key){
  const a=String(key).split("-").map(Number);
  return new Date(Date.UTC(a[0],a[1]-1,a[2]));
}
function dateKeyUTC(date){
  return date.getUTCFullYear()+"-"+String(date.getUTCMonth()+1).padStart(2,"0")+"-"+String(date.getUTCDate()).padStart(2,"0");
}
function addDaysKey(key,days){
  const d=utcDateFromKey(key);
  d.setUTCDate(d.getUTCDate()+days);
  return dateKeyUTC(d);
}
function streakHeatmapStart(todayKey=vnDateKey()){
  const today=utcDateFromKey(todayKey);
  const sundayOffset=today.getUTCDay();
  const currentSunday=new Date(today);
  currentSunday.setUTCDate(today.getUTCDate()-sundayOffset);
  currentSunday.setUTCDate(currentSunday.getUTCDate()-(STREAK_WEEKS-1)*7);
  return dateKeyUTC(currentSunday);
}
function streakLevel(count){
  const n=Number(count)||0;
  if(n<=0)return 0;
  if(n===1)return 1;
  if(n===2)return 2;
  if(n<=4)return 3;
  return 4;
}
function calculateCurrentStreak(activityMap,todayKey=vnDateKey()){
  let cursor=activityMap[todayKey]>0?todayKey:addDaysKey(todayKey,-1);
  if(!(activityMap[cursor]>0))return 0;
  let streak=0;
  while(activityMap[cursor]>0){
    streak++;
    cursor=addDaysKey(cursor,-1);
  }
  return streak;
}
function renderTutoringStreak(rows=[]){
  const heat=document.getElementById("tutoringStreakHeatmap");
  const months=document.getElementById("tutoringStreakMonths");
  const number=document.getElementById("tutoringStreakNumber");
  if(!heat||!months||!number)return;
  const today=vnDateKey();
  const start=streakHeatmapStart(today);
  const map={};
  rows.forEach(r=>{map[String(r.activity_date)]=Number(r.activity_count)||0});
  const cells=[];
  const monthSlots=[];
  let previousMonth="";
  const monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  for(let week=0;week<STREAK_WEEKS;week++){
    const weekStart=addDaysKey(start,week*7);
    const d=utcDateFromKey(weekStart);
    const month=d.getUTCMonth();
    const monthKey=d.getUTCFullYear()+"-"+month;
    if(monthKey!==previousMonth){
      monthSlots.push('<span style="grid-column:'+(week+1)+'">'+monthNames[month]+'</span>');
      previousMonth=monthKey;
    }
    for(let day=0;day<7;day++){
      const key=addDaysKey(weekStart,day);
      const count=map[key]||0;
      const future=key>today;
      const level=future?0:streakLevel(count);
      const label=future?"":key+" · "+count+" hoạt động";
      cells.push('<span class="streak-cell '+(future?"future":"level-"+level)+'" title="'+esc(label)+'" aria-label="'+esc(label)+'"></span>');
    }
  }
  months.innerHTML=monthSlots.join("");
  heat.innerHTML=cells.join("");
  number.textContent=String(calculateCurrentStreak(map,today));
}
async function loadTutoringStreak(){
  if(!document.getElementById("tutoringStreakCard"))return;
  const session=await ensureLearnerSession();
  if(!session?.user?.id||!session?.access_token)return;
  const start=streakHeatmapStart();
  try{
    const query="?select=activity_date,activity_count&user_id=eq."+encodeURIComponent(session.user.id)+"&order=activity_date.asc";
    const res=await fetch(SUPABASE_URL+"/rest/v1/learner_daily_activity"+query,{headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+session.access_token}});
    if(!res.ok)throw new Error("Streak fetch failed");
    renderTutoringStreak(await res.json());
  }catch(err){
    console.error(err);
    const number=document.getElementById("tutoringStreakNumber");
    if(number)number.textContent="—";
  }
}
async function recordTutoringActivity(eventType="study"){
  try{

      body:JSON.stringify({p_event_type:String(eventType||"study").slice(0,64)})
    });

    if(document.getElementById("tutoringStreakCard"))loadTutoringStreak();

}
