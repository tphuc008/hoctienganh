name: Live GitHub Pages audit
on:
  push:
    branches: [audit/live-site-20261020]
jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependencies
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Audit live GitHub Pages without production data writes
        run: node tests/live-site-audit.cjs