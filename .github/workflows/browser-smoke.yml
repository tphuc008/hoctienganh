name: Chromium learner journeys
on:
  push:
    branches: [main, feat/interface-performance-20261020]
  pull_request:
    branches: [main]
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Ensure PDF text inspection tool is available
        run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Serve static website
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hoctienganh-server.log 2>&1 &
          sleep 2
      - name: Exercise learner journeys without production credentials
        run: |
          node tests/browser-smoke.cjs
          node tests/manifest-browser.cjs
          node tests/lesson-quiz-print-browser.cjs
          node tests/flow-browser.cjs
          node tests/history-browser.cjs
          node tests/interface-performance-browser.cjs
          node tests/grammar-topic21-browser.cjs
