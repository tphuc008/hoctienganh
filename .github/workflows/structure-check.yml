name: Learning structure checks
on:
  push:
    branches:
      - main
      - feat/interface-performance-20261020
      - feat/unified-history-streak-20261020
      - feat/shared-quiz-lifecycle-20261020
      - fix/safe-structure-main-20261020
      - feat/content-manifest-20261020
  pull_request:
    branches: [main]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript, routes and progress isolation
        run: node --test tests/*.test.cjs
